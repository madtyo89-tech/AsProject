<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600;700&family=Bebas+Neue&family=Oswald:wght@400;500;600&family=EB+Garamond:wght@500;600&family=Merriweather:wght@400;700&family=Work+Sans:wght@400;500;600&family=Pacifico&family=Dancing+Script:wght@600;700&family=Caveat:wght@600;700&family=Sacramento&family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">

<style>
:root{--bg:#fafaf8;--card:#fff;--line:#eee;--line2:#e9e9e9;--ink:#1a1a1a;--mut:#737373;--mut2:#a3a3a3;--gold:#D4AF37;--cream:#FFFBEB;--cream2:#FDE68A;--soft:#f5f5f4}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 Inter,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent}
input,textarea,select{outline:0}
::selection{background:rgba(212,175,55,.3)}
.sb::-webkit-scrollbar{width:5px;height:5px}.sb::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:10px}
.gold{background:linear-gradient(135deg,#D4AF37,#F9E79F,#D4AF37)}
.emerald-bg{background:radial-gradient(120% 120% at 50% 0%,#12372a 0%,#0a1f18 70%)}
.hdr{position:sticky;top:0;z-index:40;backdrop-filter:blur(24px);background:rgba(255,255,255,.85);border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:10px}
.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#5a4a12;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;padding:2px 8px;border-radius:99px}
.pill.dark{background:#111;color:#fff;font-weight:600;letter-spacing:.1em}
.pill.cream{background:#FFF6D6;color:#8a6d0f;border:1px solid #F3E5AB}
.btn-pub{height:36px;padding:0 16px;border-radius:99px;background:#111;color:#fff;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.btn-pub:hover{background:#000}
.layout{max-width:1600px;margin:auto;display:grid;grid-template-columns:300px 480px 1fr;min-height:100dvh}
.aside{border-right:1px solid var(--line);background:#fff;padding:16px;position:sticky;top:0;height:100dvh;overflow-y:auto}
.mainc{background:#fbfaf8;border-right:1px solid var(--line);overflow-y:auto;height:100dvh}
.prevc{background:#f5f5f0;position:sticky;top:0;height:100dvh;padding:16px;overflow-y:auto;display:flex;flex-direction:column;align-items:center}
.lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.evbtn{text-align:left;border-radius:16px;border:1px solid var(--line);padding:12px;background:#fbfaf8;transition:.15s;width:100%}
.evbtn:hover{background:#fff}
.evbtn.on{background:#111;color:#fff;border-color:#111;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.evbtn.on .sub{color:rgba(255,255,255,.6)}
.evbtn .sub{font-size:10px;color:var(--mut)}
.thbtn{width:100%;display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid var(--line);padding:10px;text-align:left;background:#fbfaf8;transition:.15s;margin-bottom:8px}
.thbtn:hover{background:#fff}
.thbtn.on{background:#111;color:#fff;border-color:#111}
.thbtn.on .sub{color:rgba(255,255,255,.6)}
.thbtn .sub{font-size:10px;color:var(--mut)}
.tpl-custom-entry{display:grid;gap:2px;margin-bottom:8px}
.tpl-custom-entry .thbtn{margin-bottom:0;min-width:0}
.tpl-custom-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:0 4px}
.tpl-custom-actions .sm-btn{min-width:0;min-height:32px;justify-content:center;padding:5px 3px;font-size:10px}
.cv-layout-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:12px}
.cv-layout-btn{min-width:0;min-height:76px;display:grid;align-content:center;justify-items:center;gap:5px;padding:8px 6px;border:2px solid var(--line);border-radius:14px;background:#fbfaf8;color:inherit;cursor:pointer;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s}
.cv-layout-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.08)}
.cv-layout-btn.on{border-color:#111;background:#111;color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.13)}
.cv-layout-btn .cv-layout-icon{font-size:20px;line-height:1}
.cv-layout-btn .cv-layout-name{font-size:10px;font-weight:600;line-height:1.3;text-align:center}
/* ===== Pilihan gaya tombol "Buka Undangan" (13 gaya, cermin CSS undangan.html) ===== */
.bo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:12px}
.bo-btn{min-width:0;display:grid;align-content:start;justify-items:center;gap:6px;padding:10px 6px 8px;border:2px solid var(--line);border-radius:14px;background:#fbfaf8;color:inherit;cursor:pointer;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s;font-family:inherit}
.bo-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.08)}
.bo-btn.on{border-color:#111;background:#111;color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.13)}
.bo-btn .bo-name{font-size:10px;font-weight:600;line-height:1.3;text-align:center}
.bo-sample{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;font-size:9.5px;font-weight:700;letter-spacing:.05em;white-space:nowrap;pointer-events:none}
.bo-amplop{border-radius:7px;background:linear-gradient(172deg,#FFFCF5,#F2E3C2);color:#5C4222;border:1px solid rgba(168,130,63,.55);box-shadow:inset 0 8px 0 rgba(240,225,188,.65),0 5px 10px rgba(90,60,20,.22)}
.bo-pil{border-radius:99px;background:#26332a;color:#fff}
.bo-emas{border-radius:99px;background:linear-gradient(135deg,#F0D894,#C9A24B 60%,#A8823F);color:#3A2A10;border:1px solid rgba(168,130,63,.7)}
.bo-garis{border-radius:99px;background:rgba(255,255,255,.5);color:#3c4a3e;border:1.5px solid #3c4a3e}
.bo-kaca{border-radius:99px;background:rgba(255,255,255,.45);color:#33503c;border:1px solid rgba(120,150,130,.65);box-shadow:inset 0 1px 0 #fff,0 5px 12px rgba(40,70,50,.16)}
.bo-pita{border-radius:3px;background:linear-gradient(135deg,#B4506B,#7E2A44);color:#fff;clip-path:polygon(0 0,100% 0,92% 50%,100% 100%,0 100%,8% 50%);padding:0 16px}
.bo-cap{border-radius:6px;background:#FFFCF5;color:#5C4222;border:2px dashed #B08A44;box-shadow:3px 3px 0 rgba(176,138,68,.4)}
.bo-daun{border-radius:99px 6px 99px 6px;background:linear-gradient(135deg,#5F7A5C,#2F4A2C);color:#fff}
.bo-kartu{border-radius:7px;background:#fff;color:#4B4237;border:1px solid rgba(120,100,70,.4);box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3px rgba(168,130,63,.6),0 5px 10px rgba(90,60,20,.15)}
.bo-neon{border-radius:99px;background:#11101F;color:#7DF3FF;border:1px solid #47EEFF;box-shadow:0 0 12px rgba(71,238,255,.55)}
.bo-mutiara{border-radius:99px;background:linear-gradient(160deg,#fff,#EFE3CB);color:#6B5A34;border:1px solid #D9C69A}
.bo-royal{border-radius:6px;background:linear-gradient(150deg,#1E3A30,#0E241B);color:#EAD9A4;border:1px solid #C9A95C}
.bo-minimal{border-radius:0;background:transparent;color:inherit;border:0;border-bottom:2px solid #B08A44;height:auto;padding:4px 2px;letter-spacing:.16em}
.menubtn{width:100%;display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid var(--line);padding:12px;text-align:left;background:#fff;transition:.15s;margin-bottom:6px}
.menubtn:hover{background:#fbfaf8}
.menubtn.on{background:#111;color:#fff;border-color:#111}
.menubtn.on .sub{color:rgba(255,255,255,.6)}
.menubtn .sub{font-size:11px;color:var(--mut)}
.icbox{width:32px;height:32px;border-radius:12px;display:grid;place-items:center;font-size:14px;background:var(--soft)}
.menubtn.on .icbox{background:#fff;color:#000}
.tabbar{position:sticky;top:0;z-index:20;background:rgba(251,250,248,.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--line);padding:8px;display:flex;gap:6px;overflow-x:auto}
.tabbtn{white-space:nowrap;padding:8px 14px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid var(--line2);background:#fff}
.tabbtn.on{background:#111;color:#fff;border-color:#111}
.card{border-radius:20px;background:#fff;border:1px solid var(--line);padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.04)}
.card h4{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.f{font-size:11px;font-weight:500;display:block}
.f input,.f select,.f textarea{margin-top:4px;width:100%;border:1px solid var(--line2);border-radius:12px;padding:0 12px;height:40px;font-size:13px;background:#fff}
.f textarea{height:auto;padding:8px 12px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{box-shadow:0 0 0 2px rgba(212,175,55,.3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:span 2}
.chip{font-size:10px;padding:4px 8px;border-radius:99px;background:var(--soft)}
.sm-btn{font-size:11px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:#fbfaf8}
a.sm-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.sm-btn.dirty{background:#fff7e6;border-color:#e6c68a;color:#8a6d0f}
.sm-btn:disabled{opacity:.55;cursor:default}
.sm-btn.dark{background:#111;color:#fff;border-color:#111}
.sm-btn.wa{background:#25D366;color:#fff;border-color:#25D366}
.togglerow{display:flex;align-items:center;justify-content:space-between;background:#fbfaf8;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:500;cursor:pointer;margin-bottom:8px}
.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:99px;z-index:99;font-size:12px;font-weight:500;box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px}
.notice button{background:#fff;color:#111;border:0;border-radius:99px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;margin-top:6px}
.guestrow{border-radius:12px;border:1px solid var(--line);padding:10px;display:flex;align-items:center;gap:8px;background:#fbfaf8;margin-bottom:8px}
.guestrow.sel{border-color:var(--gold);background:var(--cream)}
.upload-dash{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;border:2px dashed rgba(212,175,55,.4);background:rgba(255,251,235,.5);cursor:pointer;font-size:13px;transition:.15s}
.upload-dash:hover{background:var(--cream)}
.photo-field{min-width:0}
.photo-upload-slot{position:relative;min-width:0}
.photo-upload-tile{height:112px;display:grid;place-items:center;position:relative;overflow:hidden;border:1px dashed var(--line2);border-radius:12px;background:#fbfaf8;cursor:pointer}
.photo-upload-tile img{width:100%;height:100%;object-fit:cover;display:block}
.photo-upload-tile input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.photo-remove{position:absolute;z-index:3;top:6px;right:6px;width:32px;height:32px;display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.85);border-radius:50%;background:rgba(153,27,27,.94);color:#fff;font-size:15px;font-weight:700;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.22)}
.photo-remove:hover{background:#991b1b}
.gallery-thumb{position:relative;min-width:0;height:64px}
.gallery-thumb img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.gallery-thumb .photo-remove{top:4px;right:4px;width:24px;height:24px;font-size:12px}
.cvprev{position:absolute;left:0;top:0;max-width:none;max-height:none}
.dot{width:8px;height:8px;border-radius:99px}
@keyframes pulse{50%{opacity:.5}}.pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
/* ===== Animasi pratinjau undangan — diputar ulang hanya saat struktur
   berubah (ganti template / event / slide), bukan tiap ketik teks ===== */
@keyframes cUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes cZoom{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes cWord{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes cDeco{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes cPop{0%{opacity:0;transform:scale(.5)}60%{transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
.ap .a-up{animation:cUp .55s cubic-bezier(.22,.8,.36,1) both}
.ap .a-zoom{animation:cZoom .7s cubic-bezier(.22,.8,.36,1) both}
.ap .a-word{display:inline-block;animation:cWord .6s cubic-bezier(.22,.8,.36,1) both}
.ap .a-deco{transform-origin:center;animation:cDeco .8s cubic-bezier(.22,.8,.36,1) both}
.ap .a-pop{animation:cPop .6s cubic-bezier(.22,.8,.36,1) both}
/* ===== 10 efek animasi cover (pilihan state.anim.effect) ===== */
@keyframes cFade{from{opacity:0}to{opacity:1}}
@keyframes cRise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes cDrop{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
@keyframes cBlurIn{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:blur(0)}}
@keyframes cFlip{from{opacity:0;transform:perspective(700px) rotateX(24deg) translateY(18px)}to{opacity:1;transform:none}}
@keyframes cSlideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes cSwing{from{opacity:0;transform:rotate(-7deg) translateY(-14px)}to{opacity:1;transform:none}}
@keyframes cElastic{0%{opacity:0;transform:scale(.4)}55%{opacity:1;transform:scale(1.12)}75%{transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
@keyframes cShimmer{0%{opacity:0;filter:brightness(1.9) saturate(1.3)}60%{opacity:1;filter:brightness(1.15)}100%{opacity:1;filter:none}}
@keyframes cCurtain{0%{opacity:0;transform:scaleX(.55)}100%{opacity:1;transform:none}}
@keyframes cVipZoom{0%{opacity:0;transform:scale(1.28);filter:blur(6px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes cVipCurt{0%{clip-path:inset(0 50% 0 50%);opacity:.4}100%{clip-path:inset(0 0 0 0);opacity:1}}
.ap .fx-c-fade{animation:cFade .8s ease both}
.ap .fx-c-zoom{animation:cZoom .7s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-rise{animation:cRise .7s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-drop{animation:cDrop .7s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-blur{animation:cBlurIn .8s ease both}
.ap .fx-c-pop{animation:cPop .6s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-flip{animation:cFlip .75s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-slide{animation:cSlideIn .7s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-swing{animation:cSwing .7s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-elastic{animation:cElastic .8s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-shimmer{animation:cShimmer 1s ease both}
.ap .fx-c-curtain{animation:cCurtain .9s cubic-bezier(.22,.8,.36,1) both;transform-origin:50% 0}
.ap .fx-c-vip-zoom{animation:cVipZoom 1.4s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-vip-curtain{animation:cVipCurt 1.2s cubic-bezier(.5,0,.3,1) both}
.fxbtn{text-align:left;border-radius:12px;padding:10px 12px;display:grid;gap:2px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:.15s;font-family:inherit}
.fxbtn b{font-size:11px;font-weight:600;color:#111}
.fxbtn span{font-size:10px;color:var(--mut);line-height:1.4}
.fxbtn:hover{background:#fbfaf8}
.fxbtn.on{border-color:#111;background:#111;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.fxbtn.on b{color:#fff}
.fxbtn.on span{color:rgba(255,255,255,.6)}
/* ===== Floating preview undangan (mini HP melayang, selalu tampil) ===== */
#floatPrev{position:fixed;right:16px;bottom:16px;z-index:60}
#floatPrev .fp-pill{height:44px;padding:0 16px;border-radius:99px;background:#111;color:#fff;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.15);box-shadow:0 12px 32px rgba(0,0,0,.3);cursor:pointer;display:flex;align-items:center;gap:8px}
#floatPrev .fp-pill:hover{background:#000}
#floatPrev .fp-box{width:180px;max-width:calc(100vw - 16px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
#floatPrev.fp-expanded .fp-box{width:360px}
#floatPrev.fp-expanded .fp-screen{height:min(680px,calc(100dvh - 100px))}
#floatPrev .fp-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;background:#111;color:#fff;font-size:10px;font-weight:600;cursor:grab;user-select:none;touch-action:none}
#floatPrev .fp-head:active{cursor:grabbing}
#floatPrev .fp-head>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Saat mini, judul dipendekkan jadi "📱 Live" supaya tombol tetap muat & satu baris. */
#floatPrev:not(.fp-expanded) .fp-t-full{display:none}
#floatPrev .fp-actions{display:flex;gap:4px;flex:none;margin-left:auto}
#floatPrev .fp-actions button{width:22px;height:22px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-size:10px;cursor:pointer;display:grid;place-items:center;line-height:1}
#floatPrev .fp-actions button:hover{background:rgba(255,255,255,.15)}
#floatPrev .fp-screen{width:100%;height:min(318px,calc(100dvh - 100px));overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;background:#fff}
#floatPrev .fp-screen::-webkit-scrollbar{display:none}
#floatPrev .fp-hint{padding:6px 10px;background:var(--soft);border-top:1px solid var(--line);font-size:9px;color:var(--mut);text-align:center}
@media (max-width:760px){#floatPrev{right:8px;bottom:8px}}
.modebtn{text-align:left;border-radius:12px;padding:12px;display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid transparent;transition:.15s;width:100%}
.modebtn:hover{background:#fbfaf8}
.modebtn.on{background:#111;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.radio{margin-top:2px;width:20px;height:20px;border-radius:99px;border:2px solid #ddd;background:#fff;display:grid;place-items:center;flex:none}

@media(max-width:800px){.layout{grid-template-columns:1fr}.aside{position:static;height:auto}}

 body.studio-nav-open .aside{display:block}

/* Baris katalog: susunan bertumpuk (nama → harga → promo/badge → aksi) sebagai bawaan — aman di HP maupun
   kolom tengah desktop yang hanya 480px. Satu baris penuh hanya bila lebar daftar memang cukup (container query). */
.kat-list{container-type:inline-size;container-name:kat}
.kat-row{padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;border-bottom:1px solid #f0f0f0}
.kat-row.hid{opacity:.55}
.kat-thumb{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);flex:none;display:grid;place-items:center}
.kat-main{flex:1 1 calc(100% - 52px);min-width:0}
.kat-main input{width:100%;font-size:13px;font-weight:500;border:0;background:transparent;padding:0;min-width:0}
.kat-meta{display:flex;align-items:center;gap:6px 8px;margin-top:4px;flex-wrap:wrap}

.kat-price{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1 1 100%}
.kat-price input,.kat-badge{width:100%;height:36px;border-radius:99px;border:1px solid var(--line);padding:0 10px;font-size:13px;background:#fff;min-width:0}

.sm-btn.del:hover{background:#fee2e2}

/* ===== Alur studio: stepper langkah + checklist kesiapan ===== */
.stepbar{position:sticky;top:0;z-index:21;display:flex;gap:0;background:rgba(251,250,248,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--line);padding:10px 12px 8px;overflow-x:auto}
.step{flex:1;min-width:118px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;border:0;background:transparent;cursor:pointer;text-align:left;white-space:nowrap}
.step .num{width:22px;height:22px;flex:none;border-radius:99px;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--soft);color:var(--mut);border:1px solid var(--line2)}

.step.on .num{background:#111;color:#fff;border-color:#111}
.step.on .stxt{color:#111}

.step.done .stxt{color:#8a6d2f}

/* === Ornamen sudut preview (bunga 3D/4D) === */
.orn-cp{position:absolute;width:56px;height:56px;opacity:.88;pointer-events:none;z-index:2}
.orn-cp svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(60,40,10,.25))}
.orn-cp.tl{top:8px;left:8px}
.orn-cp.tr{top:8px;right:8px;transform:scaleX(-1)}
.orn-cp.bl{bottom:8px;left:8px;transform:scaleY(-1)}
.orn-cp.br{bottom:8px;right:8px;transform:scale(-1,-1)}
.orn-cp .orn-l{transform-box:fill-box;transform-origin:50% 50%}
.orn-cp.orn-bunga4d{animation:cpAyun 7s ease-in-out infinite}
.orn-cp.orn-bunga4d.tr{animation-delay:-1.6s}
.orn-cp.orn-bunga4d.bl{animation-delay:-3.2s}
.orn-cp.orn-bunga4d.br{animation-delay:-4.8s}
.orn-cp.orn-bunga4d .l-back{animation:cpLapis 8s ease-in-out infinite}
.orn-cp.orn-bunga4d .l-mid{animation:cpLapis 8s ease-in-out infinite reverse}
.orn-cp.orn-bunga4d .l-front{animation:cpLapis2 6.5s ease-in-out infinite}
@keyframes cpAyun{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -4px;rotate:1.1deg}}
@keyframes cpLapis{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(1px,-1.4px) scale(1.035)}}
@keyframes cpLapis2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-1.1px,1px) scale(1.05)}}
@media (prefers-reduced-motion:reduce){.orn-cp.orn-bunga4d,.orn-cp.orn-bunga4d .orn-l{animation:none!important}}

 try{if(localStorage.getItem(KEY)===HASH||sessionStorage.getItem(KEY)===HASH){unlock();return}}catch(e){}
 function sha256(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}

function customColor(v,fallback){const s=String(v||'').trim();return /^#[0-9a-f]{6}$/i.test(s)?s.toUpperCase():fallback}
function customAsset(v){const s=String(v||''),parts=s.split('/');return parts[0]==='assets'&&parts.length>1&&parts.slice(1).every(p=>/^[a-z0-9._-]+$/i.test(p))&&!parts.includes('..')?s:''}
function normalizeTplCustom(items){
 if(!Array.isArray(items))return[];
 const used=new Set(TPL.map(t=>t.id)),out=[];
 items.slice(0,80).forEach(raw=>{
  if(!raw||typeof raw!=='object')return;
  const id=String(raw.id||'').toLowerCase();
  if(!/^custom-[a-z0-9][a-z0-9-]{2,80}$/.test(id)||used.has(id))return;
  const base=TPL.find(t=>t.id===raw.baseTpl)||TPL[0];
  const nama=String(raw.nama||'Template Kustom').replace(/[<>]/g,'').trim().slice(0,60);
  if(!nama)return;
  const ev=CUSTOM_TPL_EVENTS.includes(raw.ev)?raw.ev:(CUSTOM_TPL_EVENTS.includes(base.ev)?base.ev:'all');
  const colors=Array.isArray(raw.g)?raw.g:base.g;
  const fonts=FONTS.map(f=>f.id);
  const source=raw.design&&typeof raw.design==='object'?raw.design:{};
  const design={};
  if(fonts.includes(source.fontBody))design.fontBody=source.fontBody;
  if(BORDERS.some(b=>b.id===source.border))design.border=source.border;
  if(['tanpa','ranting','bunga3d','bunga4d'].includes(source.ornSudut))design.ornSudut=source.ornSudut;
  if(CUSTOM_TPL_COVER_LAYOUTS.includes(source.coverLayout))design.coverLayout=source.coverLayout;
  if(CUSTOM_TPL_COVER_STYLES.includes(source.coverStyle))design.coverStyle=source.coverStyle;
  if(CV_UKURAN_ID.includes(source.coverSize))design.coverSize=source.coverSize;
  if(BTN_OPEN_ID.includes(source.coverBtn))design.coverBtn=source.coverBtn;
  if(typeof source.coverStyleExplicit==='boolean')design.coverStyleExplicit=source.coverStyleExplicit;
  if(typeof source.darkMode==='boolean')design.darkMode=source.darkMode;
  if(typeof source.goldOrn==='boolean')design.goldOrn=source.goldOrn;
  const row={id,nama,ev,baseTpl:base.id,
   g:[0,1,2].map(i=>customColor(colors[i],base.g[i])),
   accent:customColor(raw.accent,base.accent),ink:customColor(raw.ink,base.ink),
   badge:'CUSTOM',deco:String(raw.deco||base.deco||'✦ ❖ ✦').replace(/[<>]/g,'').replace(/\s+/g,' ').slice(0,60),
   pat:CUSTOM_TPL_PATTERNS.includes(raw.pat)?raw.pat:(base.pat||''),
   ft:fonts.includes(raw.ft)?raw.ft:base.ft,char:String(raw.char||base.char||'').replace(/[<>]/g,'').slice(0,24),
   desc:String(raw.desc||'Tema undangan kustom').replace(/[<>]/g,'').replace(/\s+/g,' ').slice(0,180),
   arch:!!raw.arch,bg3d:customAsset(raw.bg3d),bgPaper:customAsset(raw.bgPaper),
   studioOnly:raw.studioOnly!==false,custom:true,design};
  used.add(id);out.push(row)
 });
 return out
}

function syncDefaultCoverStyle(t){if(!state.coverStyleExplicit)state.coverStyle=t&&t.arch?'arch':'kotak'}

 const c=pos=>`<i style="position:absolute;width:22px;height:22px;border:0 solid ${A};${pos};pointer-events:none;z-index:2"></i>`;

/* QR asli (pustaka qrcode-generator, MIT — lihat assets/qrcode.js). Modul QR digambar
   penuh dengan quiet zone 6 modul supaya benar-benar bisa dipindai; label emas
   nama/kode ditaruh di pita bawah di luar area QR. */
function qrTeks(teks,label){const cv=document.createElement('canvas');cv.width=300;cv.height=328;const x=cv.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,300,328);
 try{
  const q=window.qrcode(0,'M');q.addData(teks);q.make();
  const n=q.getModuleCount();
  /* Quiet zone 4 modul penuh di keempat sisi (standar QR) — inilah yang membuat
     scan lancar di HP lama/cahaya redup. Modul digambar bulat penuh (integer)
     supaya tidak ada celah piksel antar-modul. Label emas berada DI LUAR area QR. */
  const C=Math.max(1,Math.floor(300/(n+8))),ox=Math.floor((300-n*C)/2),oy=ox;
  x.fillStyle='#111';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(ox+c*C,oy+r*C,C,C);
 }catch(e){x.fillStyle='#b91c1c';x.font='bold 12px Inter';x.fillText('QR gagal dibuat',12,150)}
 x.fillStyle='#D4AF37';x.fillRect(0,304,300,20);x.fillStyle='#fff';x.font='bold 10px Inter';
 x.fillText(String(label||''),10,318);return cv.toDataURL()}
/* QR CHECK-IN: dipindai PANITIA di pintu masuk (halaman scan.html) */
function qrData(g){return qrTeks(checkinUrl(g),state.showNameQr?`${g.code} • ${g.nama.slice(0,14)}`:g.code)}

function isNetworkError(e){return /failed to fetch|networkerror|network request failed|load failed|fetch failed/i.test(String(e&&e.message||e||''))}
async function upsertInvitationDraft(payload){
 /* Gunakan client normal bila CDN Supabase berhasil dimuat. Bila diblokir/gagal,
    endpoint REST Supabase tetap bisa dipakai langsung — Publish tidak bergantung
    pada CDN pihak ketiga. Retry REST hanya untuk kegagalan jaringan, bukan error DB. */
 if(db){
  try{
   const {error}=await db.from('invitation_drafts').upsert(payload,{onConflict:'slug'});
   if(!error)return;
   if(!isNetworkError(error))throw error;
  }catch(e){if(!isNetworkError(e))throw e}
 }
 const response=await fetch(SUPABASE_URL+'/rest/v1/invitation_drafts?on_conflict=slug',{
  method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,
   'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
  body:JSON.stringify(payload)});
 if(response.ok)return;
 let raw='',detail='',code='';
 try{raw=await response.text()}catch(e){}
 if(raw){try{const body=JSON.parse(raw);detail=body.message||body.error_description||body.error||raw;code=body.code||''}catch(e){detail=raw}}
 const err=new Error(detail||('Supabase HTTP '+response.status));
 err.code=code;err.status=response.status;throw err;
}

  <select id="rvpH" style="margin-top:8px;width:100%;height:40px;border:1px solid #ddd;border-radius:12px;padding:0 10px;font-size:12px;background:#fff">
   <option>Hadir 🙌</option><option>Hadir, bawa keluarga</option><option>Tidak hadir — maaf 🙏</option></select>
  <textarea id="rvpM" rows="2" placeholder="Ucapan untuk pasangan..." style="margin-top:8px;width:100%;border:1px solid #ddd;border-radius:12px;padding:8px 12px;font-size:12px;background:#fff;resize:none"></textarea>
  <button onclick="rsvpWa()" style="margin-top:10px;width:100%;height:42px;border:0;border-radius:99px;background:#25D366;color:#fff;font-size:12px;font-weight:600">Kirim RSVP via WA</button>`));
 if(SL.closing.on&&SL.closing.text.trim())out.push(`<div style="margin-top:28px;text-align:center;padding:8px 16px">
  <div style="font-size:14px;letter-spacing:10px;color:${state.accent};opacity:.7">❖ ✦ ❖</div>
  <p style="margin-top:12px;font-size:12.5px;font-style:italic;line-height:1.8;color:#444;font-family:Georgia,serif">${esc(SL.closing.text)}</p>
  <div style="margin-top:12px;font-size:11px;font-weight:600;color:${state.accent}">${esc(displayName())}</div></div>`);
 return out
}

function render(){
 if(!state.started||_welcome||(state.stage==='ready'&&linkReady())){
  clearScrollReveal($('floatPrev'));$('floatPrev').innerHTML='';
  $('root').innerHTML=(!state.started||_welcome)?welcomeView():readyView();syncAudio();return;
 }
 $('root').innerHTML=header()+`<div class="layout">${sidebar()}
  <main class="mainc sb">${state.page==='editor'?editor():state.page==='katalog'?katalog():arsip()}</main>
  <aside class="prevc sb"><div id="phoneWrap" class="pv-stage"></div></aside>
 </div>`;
 cvGambar();syncAudio();syncFloat();
}

/* ===== Pratinjau = undangan asli di dalam iframe =====
   Studio tidak menggambar ulang undangan lagi: berkas undangan.html yang sama
   dijalankan di iframe (mode ?preview=1) dan menerima isian draft lewat pesan.
   Hasilnya selalu sama dengan undangan yang dibuka tamu — termasuk pembaruan
   tampilan berikutnya, karena hanya ada satu renderer. */
const PV_LEBAR=390,PV_TINGGI=780;
/* Baris undangan = bentuk yang sama dengan yang dikirim ke Supabase saat
   Publish, jadi pratinjau memakai data persis seperti data undangan live. */
function barisUndangan(){
 const f=state.form;
 return {slug:state.slug,name1:state.event==='pernikahan'?f.namaPria:f.namaAnak,
  name2:state.event==='pernikahan'?f.namaWanita:'',venue:f.venue,
  event_date:f.tanggalAcara,event_time:f.jamAcara,
  music_url:state.music&&!state.music.local?new URL(state.music.url,location.href).href:'',
  music_name:state.music?state.music.name:'',
  theme:Math.max(0,TPL.findIndex(t=>t.id===state.tpl)),
  data:{form:JSON.parse(JSON.stringify(state.form)),event:state.event,tpl:state.tpl,tplCustom:JSON.parse(JSON.stringify(state.tplCustom||[])),doa:state.doa,
   accent:state.accent,fontTitle:state.fontTitle,fontBody:state.fontBody,border:state.border,ornSudut:state.ornSudut,
   amplop:JSON.parse(JSON.stringify(state.amplop)),
   slides:JSON.parse(JSON.stringify(state.slides)),anim:JSON.parse(JSON.stringify(state.anim)),videoLink:state.videoLink||'',
   music:(state.music&&!state.music.local)?{name:state.music.name,url:new URL(state.music.url,location.href).href}:{name:'',url:''},
   cover:state.cover||'',coverStyle:CV_URUT.includes(state.coverStyle)?state.coverStyle:'kotak',coverLayout:state.coverLayout||'amplop',coverStyleExplicit:!!state.coverStyleExplicit,coverPos:Object.assign({},cvPos()),coverSize:cvSizeId(),coverBtn:coverBtnId(),
   fotoPria:state.fotoPria||'',fotoWanita:state.fotoWanita||'',
   gallery:Array.isArray(state.gallery)?state.gallery.slice(0,12):[],
   guestsRaw:state.guestsRaw||'',guestCodes:Object.assign({},state.guestCodes||{}),
   masterKey:state.masterKey||'',linkMode:state.linkMode||'personal',
   /* Teks WA milik pemilik → dipakai Undangan Master & tombol Bagikan di undangan live. */
   waTemplate:String(state.waTemplate||'')}};
}
function pvHtml(){return '<div class="pv-phone"><iframe class="pv-frame" src="undangan.html?preview=1" title="Pratinjau undangan (tampilan asli)" loading="eager" referrerpolicy="no-referrer"></iframe></div>'}
/* Ukuran iframe: undangan selalu digambar pada lebar HP (390 px), lalu
   diperkecil dengan transform supaya pas di panel atau di kotak melayang. */
function pvUkur(ifr){
 const box=ifr.parentElement;if(!box)return;
 const layar=box.closest('.fp-screen');
 const lebar=Math.max(160,(layar?layar.clientWidth:box.clientWidth)||360);
 const tinggi=Math.max(260,(layar?layar.clientHeight:window.innerHeight-32)||680);
 const k=Math.min(lebar/PV_LEBAR,tinggi/PV_TINGGI);
 ifr.style.transform='scale('+k+')';
 box.style.width=Math.round(PV_LEBAR*k)+'px';box.style.height=Math.round(PV_TINGGI*k)+'px';
 box.style.margin='0 auto';
}
function pvKirim(ifr){
 const row=barisUndangan();
 /* Simpan payload terakhir di elemen iframe: bila pesan ini terkirim saat
    iframe masih memuat (dokumen lama), handler load mengirim ulang payload
    terakhir ini — pesan tidak hilang di tengah jalan. */
 ifr.__aspRow=row;
 try{const t=ifr.contentWindow;if(t)t.postMessage({type:'asproject:preview',row},'*')}catch(e){}
}
const _pvPantau=new WeakSet();
function pvPasang(ifr){
 if(!ifr)return;
 if(!_pvPantau.has(ifr)){_pvPantau.add(ifr);ifr.addEventListener('load',()=>{
  ifr.__aspSiap=true;pvUkur(ifr);
  /* Pakai payload tersimpan terakhir (bisa lebih baru dari saat load mulai). */
  try{const t=ifr.contentWindow,row=ifr.__aspRow||barisUndangan();if(t)t.postMessage({type:'asproject:preview',row},'*')}catch(e){}
 })}
 pvUkur(ifr);pvKirim(ifr);
}
/* Semua pratinjau (panel kanan & kotak melayang) memakai berkas undangan yang sama. */
function syncPreview(){
 const panel=$('phoneWrap');
 if(panel&&!panel.querySelector('iframe.pv-frame'))panel.innerHTML=pvHtml();
 const fl=$('floatPrev');
 if(fl&&state.floatPrevOn){const layar=fl.querySelector('.fp-screen');
  if(layar&&!layar.querySelector('iframe.pv-frame'))layar.innerHTML=pvHtml()}
 document.querySelectorAll('.pv-stage iframe.pv-frame, #floatPrev .fp-screen iframe.pv-frame').forEach(pvPasang);
}
let _pvTimer=null;
/* Ketikan pemilik tidak me-render ulang seluruh editor, jadi pratinjau
   diperbarui dengan jeda pendek supaya tidak membebani browser. */
function renderPreview(){if(_pvTimer)clearTimeout(_pvTimer);_pvTimer=setTimeout(syncPreview,140)}
function pvPerbaruiSekarang(){if(_pvTimer)clearTimeout(_pvTimer);syncPreview()}

/* ===== Floating preview — mini HP melayang berisi undangan yang sedang dibuat ===== */
let _fpExpanded=false,_fpDrag=null;
function syncFloat(){const w=$('floatPrev');if(!w)return;
 w.classList.toggle('fp-expanded',_fpExpanded);
 if(!state.floatPrevOn){w.style.left='';w.style.top='';w.style.right='';w.style.bottom='';w.innerHTML=`<button class="fp-pill" onclick="setFloat(true)" title="Tampilkan floating preview">📱 Preview</button>`;syncPreview();return}
 if(!w.querySelector('iframe.pv-frame')){
  w.innerHTML=`<div class="fp-box">
  <div class="fp-head" onpointerdown="fpDragStart(event)"><span>📱 Live<span class="fp-t-full"> Preview</span></span>
   <span class="fp-actions">
    <button title="Muat ulang preview" aria-label="Muat ulang preview secara manual" onclick="fpRefresh()">⟳</button>
    <button title="Kembali ke cover" aria-label="Kembali ke cover awal undangan" onclick="fpCover()">⤒</button>
    <button class="fp-expand-btn" title="${_fpExpanded?'Perkecil preview':'Perbesar preview'}" aria-label="${_fpExpanded?'Perkecil preview':'Perbesar preview'}" aria-expanded="${_fpExpanded}" onclick="floatGo()">${_fpExpanded?'⤡':'⤢'}</button>
    <button title="Sembunyikan preview" aria-label="Sembunyikan preview" onclick="setFloat(false)">–</button>
   </span></div>
  <div class="fp-screen" tabindex="0" role="region" aria-label="Pratinjau undangan, gulir di dalam layar untuk melihat isi">${pvHtml()}</div>
  <div class="fp-hint">geser judul • ⟳ muat ulang • ⤒ cover • ⤢ perbesar</div>
 </div>`;
  fitFloat();
 }
 /* Ikon tombol perbesar WAJIB mengikuti keadaan terakhir walau iframe tidak
    dibangun ulang (dulu ikonnya basi: sudah besar tapi ikon tetap "perbesar"). */
 const eb=w.querySelector('.fp-expand-btn');
 if(eb){eb.textContent=_fpExpanded?'⤡':'⤢';eb.title=_fpExpanded?'Perkecil preview':'Perbesar preview';eb.setAttribute('aria-label',eb.title);eb.setAttribute('aria-expanded',String(_fpExpanded))}
 syncPreview();
}
function setFloat(v){state.floatPrevOn=v;save();syncFloat()}
function floatGo(){_fpExpanded=!_fpExpanded;syncFloat();fitFloat()}
/* Muat ulang manual floating preview: buang iframe lama (beserta keadaan
   macetnya) lalu pasang iframe baru; draft terakhir dikirim ulang saat load.
   Dipakai bila pratinjau kosong/macet — pemilik tidak perlu refresh halaman. */
function fpRefresh(){
 const w=$('floatPrev');if(!w)return;
 if(!state.floatPrevOn){setFloat(true)}
 const layar=w.querySelector('.fp-screen');
 if(layar){layar.innerHTML=pvHtml();const f=layar.querySelector('iframe.pv-frame');if(f)pvPasang(f)}
 else syncFloat();
 notify('Preview dimuat ulang ⟳')
}
/* Tombol ⤒: bawa isi preview kembali ke cover undangan (bagian paling atas). */
function fpCover(){const w=$('floatPrev'),f=w&&w.querySelector('iframe.pv-frame');if(!f)return;
 try{const t=f.contentWindow;if(t){t.postMessage({type:'asproject:cover'},'*');if(typeof t.scrollTo==='function')t.scrollTo(0,0)}}catch(e){}}
function placeFloat(x,y){const w=$('floatPrev'),r=w.getBoundingClientRect(),gap=8;
 const pos={x:Math.max(gap,Math.min(Number.isFinite(x)?x:gap,window.innerWidth-r.width-gap)),y:Math.max(gap,Math.min(Number.isFinite(y)?y:gap,window.innerHeight-r.height-gap))};
 Object.assign(w.style,{left:pos.x+'px',top:pos.y+'px',right:'auto',bottom:'auto'});return pos;
}
function fitFloat(){const w=$('floatPrev');if(!w||!state.floatPrevOn)return;
 w.querySelectorAll('iframe.pv-frame').forEach(pvUkur);
 if(state.floatPos){placeFloat(state.floatPos.x,state.floatPos.y)}
 else{w.style.left='';w.style.top='';w.style.right='';w.style.bottom=''}
}
function fpDragStart(e){if(e.button!==0||e.target.closest('button'))return;
 const w=$('floatPrev'),r=w.getBoundingClientRect(),head=e.currentTarget;
 _fpDrag={dx:e.clientX-r.left,dy:e.clientY-r.top};
 head.setPointerCapture(e.pointerId);
 const mv=ev=>{if(!_fpDrag||ev.pointerId!==e.pointerId)return;placeFloat(ev.clientX-_fpDrag.dx,ev.clientY-_fpDrag.dy)};
 const up=ev=>{if(ev.pointerId!==e.pointerId)return;
  const rect=w.getBoundingClientRect();state.floatPos=placeFloat(rect.left,rect.top);save();_fpDrag=null;
  head.removeEventListener('pointermove',mv);head.removeEventListener('pointerup',up);head.removeEventListener('pointercancel',up);head.removeEventListener('lostpointercapture',up);
  if(head.hasPointerCapture(e.pointerId))head.releasePointerCapture(e.pointerId);
 };
 head.addEventListener('pointermove',mv);head.addEventListener('pointerup',up);head.addEventListener('pointercancel',up);head.addEventListener('lostpointercapture',up);e.preventDefault();
}
window.addEventListener('resize',function(){fitFloat();syncPreview()});
/* Musik gagal dimuat (link privat/rusak) → beri tahu, jangan diam saja. */
document.addEventListener('error',e=>{const t=e.target;if(t&&t.id==='player'&&state.music&&!state.music.local)
 notifyErr('Musik <b>'+esc(state.music.name||'')+'</b> gagal dimuat dari penyimpanan — file mungkin privat/terhapus. Upload ulang atau pilih musik lain.',10000)},true);

if(paksaTier())save();
/* pratinjau ringan 4D: geser latar pratinjau mengikuti mouse saat tier VIP */
document.addEventListener('mousemove',function(e){if(typeof bolehVip!=='function'||!bolehVip())return;var ap=document.querySelector('.ap');if(!ap)return;var r=ap.getBoundingClientRect();if(!r.width)return;var dx=(e.clientX-r.left)/r.width*2-1,dy=(e.clientY-r.top)/r.height*2-1;if(dx<-1.2||dx>1.2||dy<-1.2||dy>1.2)return;ap.style.backgroundPosition=(50+dx*3).toFixed(1)+'% '+(50+dy*3).toFixed(1)+'%';},{passive:true});
render();
</script>
</body>
