<style>
:root{--bg:#fafaf8;--card:#fff;--line:#eee;--line2:#e9e9e9;--ink:#1a1a1a;--mut:#737373;--mut2:#a3a3a3;--gold:#D4AF37;--cream:#FFFBEB;--cream2:#FDE68A;--soft:#f5f5f4}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 Inter,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent}
input,textarea,select{outline:0}
::selection{background:rgba(212,175,55,.3)}
.sb::-webkit-scrollbar{width:5px;height:5px}.sb::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:10px}
.gold{background:linear-gradient(135deg,#D4AF37,#F9E79F,#D4AF37)}
.emerald-bg{background:radial-gradient(120% 120% at 50% 0%,#12372a 0%,#0a1f18 70%)}
.hdr{position:sticky;top:0;z-index:40;backdrop-filter:blur(24px);background:rgba(255,255,255,.85);border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:10px}
.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#5a4a12;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;padding:2px 8px;border-radius:99px}
.pill.dark{background:#111;color:#fff;font-weight:600;letter-spacing:.1em}
.pill.cream{background:#FFF6D6;color:#8a6d0f;border:1px solid #F3E5AB}
.btn-pub{height:36px;padding:0 16px;border-radius:99px;background:#111;color:#fff;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.btn-pub:hover{background:#000}
.layout{max-width:1600px;margin:auto;display:grid;grid-template-columns:300px 480px 1fr;min-height:100dvh}
.aside{border-right:1px solid var(--line);background:#fff;padding:16px;position:sticky;top:0;height:100dvh;overflow-y:auto}
.mainc{background:#fbfaf8;border-right:1px solid var(--line);overflow-y:auto;height:100dvh}
.prevc{background:#f5f5f0;position:sticky;top:0;height:100dvh;padding:16px;overflow-y:auto;display:flex;flex-direction:column;align-items:center}
.lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.evbtn{text-align:left;border-radius:16px;border:1px solid var(--line);padding:12px;background:#fbfaf8;transition:.15s;width:100%}
.evbtn:hover{background:#fff}
.evbtn.on{background:#111;color:#fff;border-color:#111;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.evbtn.on .sub{color:rgba(255,255,255,.6)}
.evbtn .sub{font-size:10px;color:var(--mut)}
.thbtn{width:100%;display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid var(--line);padding:10px;text-align:left;background:#fbfaf8;transition:.15s;margin-bottom:8px}
.thbtn:hover{background:#fff}
.thbtn.on{background:#111;color:#fff;border-color:#111}
.thbtn.on .sub{color:rgba(255,255,255,.6)}
.thbtn .sub{font-size:10px;color:var(--mut)}
.menubtn{width:100%;display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid var(--line);padding:12px;text-align:left;background:#fff;transition:.15s;margin-bottom:6px}
.menubtn:hover{background:#fbfaf8}
.menubtn.on{background:#111;color:#fff;border-color:#111}
.menubtn.on .sub{color:rgba(255,255,255,.6)}
.menubtn .sub{font-size:11px;color:var(--mut)}
.icbox{width:32px;height:32px;border-radius:12px;display:grid;place-items:center;font-size:14px;background:var(--soft)}
.menubtn.on .icbox{background:#fff;color:#000}
.tabbar{position:sticky;top:0;z-index:20;background:rgba(251,250,248,.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--line);padding:8px;display:flex;gap:6px;overflow-x:auto}
.tabbtn{white-space:nowrap;padding:8px 14px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid var(--line2);background:#fff}
.tabbtn.on{background:#111;color:#fff;border-color:#111}
.card{border-radius:20px;background:#fff;border:1px solid var(--line);padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.04)}
.card h4{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.f{font-size:11px;font-weight:500;display:block}
.f input,.f select,.f textarea{margin-top:4px;width:100%;border:1px solid var(--line2);border-radius:12px;padding:0 12px;height:40px;font-size:13px;background:#fff}
.f textarea{height:auto;padding:8px 12px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{box-shadow:0 0 0 2px rgba(212,175,55,.3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:span 2}
.chip{font-size:10px;padding:4px 8px;border-radius:99px;background:var(--soft)}
.sm-btn{font-size:11px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:#fbfaf8}
.sm-btn.dark{background:#111;color:#fff;border-color:#111}
.sm-btn.wa{background:#25D366;color:#fff;border-color:#25D366}
.togglerow{display:flex;align-items:center;justify-content:space-between;background:#fbfaf8;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:500;cursor:pointer;margin-bottom:8px}
.phone{width:340px;border-radius:2.5rem;background:#000;padding:8px;box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto}
.screen{border-radius:2rem;background:#fff;overflow:hidden;position:relative;min-height:680px;display:flex;flex-direction:column}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:90px;height:22px;background:#111;border-radius:0 0 14px 14px;z-index:5}
.urlbar{height:36px;background:var(--soft);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:8px}
.urlpill{flex:1;min-width:0;font-family:ui-monospace,monospace;font-size:10px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:99px;z-index:99;font-size:12px;font-weight:500;box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px}
.notice button{background:#fff;color:#111;border:0;border-radius:99px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;margin-top:6px}
.guestrow{border-radius:12px;border:1px solid var(--line);padding:10px;display:flex;align-items:center;gap:8px;background:#fbfaf8;margin-bottom:8px}
.guestrow.sel{border-color:var(--gold);background:var(--cream)}
.upload-dash{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;border:2px dashed rgba(212,175,55,.4);background:rgba(255,251,235,.5);cursor:pointer;font-size:13px;transition:.15s}
.upload-dash:hover{background:var(--cream)}
.dot{width:8px;height:8px;border-radius:99px}
@keyframes pulse{50%{opacity:.5}}.pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
/* ===== Animasi pratinjau undangan — diputar ulang hanya saat struktur
   berubah (ganti template / event / slide), bukan tiap ketik teks ===== */
@keyframes cUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes cZoom{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes cWord{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes cDeco{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes cPop{0%{opacity:0;transform:scale(.5)}60%{transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
.ap .a-up{animation:cUp .55s cubic-bezier(.22,.8,.36,1) both}
.ap .a-zoom{animation:cZoom .7s cubic-bezier(.22,.8,.36,1) both}
.ap .a-word{display:inline-block;animation:cWord .6s cubic-bezier(.22,.8,.36,1) both}
.ap .a-deco{transform-origin:center;animation:cDeco .8s cubic-bezier(.22,.8,.36,1) both}
.ap .a-pop{animation:cPop .6s cubic-bezier(.22,.8,.36,1) both}
/* ===== 10 efek animasi cover (pilihan state.anim.effect) ===== */
@keyframes cFade{from{opacity:0}to{opacity:1}}
@keyframes cRise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes cDrop{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
@keyframes cBlurIn{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:blur(0)}}
@keyframes cFlip{from{opacity:0;transform:perspective(700px) rotateX(24deg) translateY(18px)}to{opacity:1;transform:none}}
@keyframes cSlideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes cSwing{from{opacity:0;transform:rotate(-7deg) translateY(-14px)}to{opacity:1;transform:none}}
@keyframes cElastic{0%{opacity:0;transform:scale(.4)}55%{opacity:1;transform:scale(1.12)}75%{transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
@keyframes cShimmer{0%{opacity:0;filter:brightness(1.9) saturate(1.3)}60%{opacity:1;filter:brightness(1.15)}100%{opacity:1;filter:none}}
@keyframes cCurtain{0%{opacity:0;transform:scaleX(.55)}100%{opacity:1;transform:none}}
@keyframes cVipZoom{0%{opacity:0;transform:scale(1.28);filter:blur(6px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes cVipCurt{0%{clip-path:inset(0 50% 0 50%);opacity:.4}100%{clip-path:inset(0 0 0 0);opacity:1}}
.ap .fx-c-fade{animation:cFade .8s ease both}
.ap .fx-c-zoom{animation:cZoom .7s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-rise{animation:cRise .7s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-drop{animation:cDrop .7s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-blur{animation:cBlurIn .8s ease both}
.ap .fx-c-pop{animation:cPop .6s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-flip{animation:cFlip .75s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-slide{animation:cSlideIn .7s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-swing{animation:cSwing .7s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-elastic{animation:cElastic .8s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-shimmer{animation:cShimmer 1s ease both}
.ap .fx-c-curtain{animation:cCurtain .9s cubic-bezier(.22,.8,.36,1) both;transform-origin:50% 0}
.ap .fx-c-vip-zoom{animation:cVipZoom 1.4s cubic-bezier(.22,.8,.36,1) both}
.ap .fx-c-vip-curtain{animation:cVipCurt 1.2s cubic-bezier(.5,0,.3,1) both}
.fxbtn{text-align:left;border-radius:12px;padding:10px 12px;display:grid;gap:2px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:.15s;font-family:inherit}
.fxbtn b{font-size:11px;font-weight:600;color:#111}
.fxbtn span{font-size:10px;color:var(--mut);line-height:1.4}
.fxbtn:hover{background:#fbfaf8}
.fxbtn.on{border-color:#111;background:#111;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.fxbtn.on b{color:#fff}
.fxbtn.on span{color:rgba(255,255,255,.6)}
/* ===== Floating preview undangan (mini HP melayang, selalu tampil) ===== */
#floatPrev{position:fixed;right:16px;bottom:16px;z-index:60}
#floatPrev .fp-pill{height:44px;padding:0 16px;border-radius:99px;background:#111;color:#fff;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.15);box-shadow:0 12px 32px rgba(0,0,0,.3);cursor:pointer;display:flex;align-items:center;gap:8px}
#floatPrev .fp-pill:hover{background:#000}
#floatPrev .fp-box{width:180px;max-width:calc(100vw - 16px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
#floatPrev.fp-expanded .fp-box{width:360px}
#floatPrev.fp-expanded .fp-screen{height:min(680px,calc(100dvh - 100px))}
#floatPrev .fp-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;background:#111;color:#fff;font-size:10px;font-weight:600;cursor:grab;user-select:none;touch-action:none}
#floatPrev .fp-head:active{cursor:grabbing}
#floatPrev .fp-actions{display:flex;gap:4px}
#floatPrev .fp-actions button{width:22px;height:22px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-size:10px;cursor:pointer;display:grid;place-items:center;line-height:1}
#floatPrev .fp-actions button:hover{background:rgba(255,255,255,.15)}
#floatPrev .fp-screen{width:100%;height:min(318px,calc(100dvh - 100px));overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;background:#fff}
#floatPrev .fp-screen::-webkit-scrollbar{display:none}
#floatPrev .fp-scale{width:340px;zoom:0.5235294118;pointer-events:none}
#floatPrev .fp-hint{padding:6px 10px;background:var(--soft);border-top:1px solid var(--line);font-size:9px;color:var(--mut);text-align:center}
@media (max-width:760px){#floatPrev{right:8px;bottom:8px}}
.modebtn{text-align:left;border-radius:12px;padding:12px;display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid transparent;transition:.15s;width:100%}
.modebtn:hover{background:#fbfaf8}
.modebtn.on{background:#111;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.radio{margin-top:2px;width:20px;height:20px;border-radius:99px;border:2px solid #ddd;background:#fff;display:grid;place-items:center;flex:none}
.modebtn.on .radio{border-color:#fff}
.radio i{width:8px;height:8px;border-radius:99px;background:#000;display:block}
@media(max-width:1200px){.layout{grid-template-columns:260px 1fr}.prevc{display:none}}
@media(max-width:800px){.layout{grid-template-columns:1fr}.aside{position:static;height:auto}}

/* Mobile Studio: document scrolling, compact navigation, no fixed desktop columns. */
.layout>*{min-width:0}
.mainc div,.mainc label{min-width:0}
.card .tabbtn{min-width:0;white-space:normal;overflow-wrap:anywhere}
.f input,.f select,.f textarea{min-width:0;max-width:100%}
.card{min-width:0;overflow-wrap:anywhere}
.hdr-actions{flex-wrap:wrap;justify-content:flex-end}
.mobile-menu{display:none}
.master-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.master-actions button{min-height:44px;flex:1 1 140px}
@media(max-width:800px){
 .hdr{position:relative;height:auto;padding:12px;flex-wrap:wrap}
 .hdr>div{min-width:0;width:100%}
 .hdr-actions{display:grid!important;grid-template-columns:1fr 1fr;width:100%;gap:8px!important}
 .hdr-actions>*{min-width:0;justify-content:center;text-align:center;white-space:normal}
 .hdr-actions .btn-pub{height:auto;min-height:44px;padding:8px;font-size:11px}
 .mobile-menu{display:block;width:100%;min-height:44px;background:var(--soft);border:1px solid var(--line);border-radius:12px}
 .layout{display:block;min-height:0}
 .aside{display:none;height:auto;position:static;border-right:0}
 body.studio-nav-open .aside{display:block}
 .mainc{height:auto;min-height:60dvh;overflow:visible;border-right:0;padding-bottom:80px}
 .tabbar{top:0;max-width:100%;scrollbar-width:thin}
 .tabbtn{min-height:44px}
 .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .f input,.f select,.f textarea{font-size:16px}
 .notice{width:max-content;max-width:calc(100vw - 24px);border-radius:16px}
 #floatPrev{right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom))}
 #floatPrev:not(.fp-expanded) .fp-box{width:156px}
 #floatPrev:not(.fp-expanded) .fp-screen{height:min(220px,calc(100dvh - 120px))}
 #floatPrev .fp-head{padding:6px;gap:2px}
 #floatPrev .fp-actions button{width:28px;height:32px}
 #floatPrev .fp-hint{font-size:8px;padding:4px}
}
@media(max-width:360px){.grid2{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}

 padding:16px 12px!important;margin:0 0 14px!important;border-radius:18px;
 background:rgba(255,253,247,.92);border:1px solid rgba(255,255,255,.72);
 box-shadow:0 10px 28px rgba(25,35,27,.15)
}

<script>
(function(){
 var HASH='31282510d0c10140f7413a0573fdade727453ec37c3c386e4363e7e598090d8e',KEY='asproject_studio_auth';
 var ls=document.getElementById('lockscreen'),root=document.getElementById('root');
 function unlock(){ls.remove();root.style.visibility=''}
 root.style.visibility='hidden';
 try{if(localStorage.getItem(KEY)===HASH||sessionStorage.getItem(KEY)===HASH){unlock();return}}catch(e){}
 function sha256(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
 document.getElementById('lockform').addEventListener('submit',function(ev){
  ev.preventDefault();
  if(!(window.crypto&&crypto.subtle)){document.getElementById('lockerr').textContent='Browser butuh koneksi HTTPS untuk verifikasi sandi — buka via https://asproject.my.id/studio.html';return}
  var v=document.getElementById('lockpass').value||'';
  sha256(v).then(function(h){
   if(h===HASH){
    try{(document.getElementById('lockremember').checked?localStorage:sessionStorage).setItem(KEY,HASH)}catch(e){}
    unlock();
   }else{
    document.getElementById('lockerr').textContent='Sandi salah — coba lagi ya';
    document.getElementById('lockpass').value='';document.getElementById('lockpass').focus();
   }
  });
 });
 setTimeout(function(){var p=document.getElementById('lockpass');if(p)p.focus()},100);
})();
</script>

function checkinUrl(g){const q=new URLSearchParams({guest:g.nama,id:g.code,s:state.slug||'demo'});
 return hostBase()+'/checkin.html?'+q.toString()}
/* QR asli (pustaka qrcode-generator, MIT — lihat assets/qrcode.js). Modul QR digambar
   penuh dengan quiet zone 6 modul supaya benar-benar bisa dipindai; label emas
   nama/kode ditaruh di pita bawah di luar area QR. */
function qrTeks(teks,label){const cv=document.createElement('canvas');cv.width=300;cv.height=328;const x=cv.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,300,328);
 try{
  const q=window.qrcode(0,'M');q.addData(teks);q.make();
  const n=q.getModuleCount();
  /* Quiet zone 4 modul penuh di keempat sisi (standar QR) — inilah yang membuat
     scan lancar di HP lama/cahaya redup. Modul digambar bulat penuh (integer)
     supaya tidak ada celah piksel antar-modul. Label emas berada DI LUAR area QR. */
  const C=Math.max(1,Math.floor(300/(n+8))),ox=Math.floor((300-n*C)/2),oy=ox;
  x.fillStyle='#111';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(ox+c*C,oy+r*C,C,C);
 }catch(e){x.fillStyle='#b91c1c';x.font='bold 12px Inter';x.fillText('QR gagal dibuat',12,150)}
 x.fillStyle='#D4AF37';x.fillRect(0,304,300,20);x.fillStyle='#fff';x.font='bold 10px Inter';
 x.fillText(String(label||''),10,318);return cv.toDataURL()}
/* QR CHECK-IN: dipindai PANITIA di pintu masuk (halaman scan.html) */
function qrData(g){return qrTeks(checkinUrl(g),state.showNameQr?`${g.code} • ${g.nama.slice(0,14)}`:g.code)}
/* QR UNDANGAN (opsional): dipindai TAMU untuk membuka undangan miliknya */
function qrDataUndangan(g){return qrTeks(g.link,state.showNameQr?`${g.nama.slice(0,18)}`:'Buka Undangan')}

function audioExt(file){
 const map={'audio/mpeg':'mp3','audio/mp3':'mp3','audio/mp4':'m4a','audio/x-m4a':'m4a','audio/aac':'aac','audio/x-aac':'aac','audio/wav':'wav','audio/x-wav':'wav','audio/wave':'wav','audio/ogg':'ogg','audio/opus':'ogg','audio/webm':'webm','audio/flac':'flac','audio/x-flac':'flac'};
 const fromName=(String(file.name||'').match(/\.([a-z0-9]{2,5})$/i)||[])[1];
 return (fromName||map[file.type]||'mp3').toLowerCase()}
function audioMime(ext){const m={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',webm:'audio/webm',flac:'audio/flac'};return m[ext]||'audio/mpeg'}

/* Kolom snapshot "data" belum ada di tabel invitation_drafts (schema lama atau
   cache PostgREST basi) → error PGRST204/42703 yang menyebut kolom 'data'. */
function isMissingDataCol(e){const msg=String(e&&e.message||e||'').toLowerCase();const code=String(e&&e.code||'').toUpperCase();
 return (code==='PGRST204'||code==='42703')&&/data/.test(msg)&&/column|field|schema cache/.test(msg)}
/* SQL minimal perbaikan schema — bisa disalin sekali klik dari peringatan/toast. */
const FIX_SQL="alter table public.invitation_drafts add column if not exists data jsonb;";
function copyFixSql(){const done=()=>notifyWarn('SQL disalin — buka Supabase → SQL Editor, tempel, jalankan, lalu Publish ulang.',6000);
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(FIX_SQL).then(done).catch(()=>{window.prompt('Salin SQL perbaikan:',FIX_SQL)})}
 else{window.prompt('Salin SQL perbaikan:',FIX_SQL)}}
function isNetworkError(e){return /failed to fetch|networkerror|network request failed|load failed|fetch failed/i.test(String(e&&e.message||e||''))}
async function upsertInvitationDraft(payload){
 /* Gunakan client normal bila CDN Supabase berhasil dimuat. Bila diblokir/gagal,
    endpoint REST Supabase tetap bisa dipakai langsung — Publish tidak bergantung
    pada CDN pihak ketiga. Retry REST hanya untuk kegagalan jaringan, bukan error DB. */
 if(db){
  try{
   const {error}=await db.from('invitation_drafts').upsert(payload,{onConflict:'slug'});
   if(!error)return;
   if(!isNetworkError(error))throw error;
  }catch(e){if(!isNetworkError(e))throw e}
 }
 const response=await fetch(SUPABASE_URL+'/rest/v1/invitation_drafts?on_conflict=slug',{
  method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,
   'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
  body:JSON.stringify(payload)});
 if(response.ok)return;
 let raw='',detail='',code='';
 try{raw=await response.text()}catch(e){}
 if(raw){try{const body=JSON.parse(raw);detail=body.message||body.error_description||body.error||raw;code=body.code||''}catch(e){detail=raw}}
 const err=new Error(detail||('Supabase HTTP '+response.status));
 err.code=code;err.status=response.status;throw err;
}
function publishErrorHtml(e){
 const message=String(e&&e.message||e||'Kesalahan tidak diketahui');
 const code=String(e&&e.code||'');const status=e&&e.status?String(e.status):'';
 const detail=(status?'HTTP '+status+': ':'')+message;
 const text=(detail+' '+code).toLowerCase();
 let help='Periksa koneksi internet dan coba lagi. Undangan tetap tersimpan sebagai draft di perangkat ini.';
 if(/data.*(column|field)|column.*data|schema cache|pgrst204|42703/.test(text))
  help='Kolom snapshot belum tersedia. Buka Supabase → SQL Editor, jalankan file <b>supabase-schema.sql</b>, lalu coba Publish lagi.<br><button onclick="copyFixSql()">Salin SQL perbaikan</button>';
 else if(/row.?level security|rls|42501|permission denied|violates.*policy/.test(text))
  help='Supabase menolak izin simpan. Jalankan ulang <b>supabase-schema.sql</b> di SQL Editor untuk memperbaiki policy tabel <b>invitation_drafts</b>.';
 else if(/invalid api key|jwt expired|invalid jwt|unauthorized|\b401\b/.test(text))
  help='Kunci API Supabase tidak diterima. Periksa konfigurasi URL dan anon key Supabase di <b>studio.html</b>.';
 else if(/failed to fetch|networkerror|network request failed|load failed|fetch failed|\b(502|503|504)\b/.test(text))
  help='Browser tidak dapat menghubungi Supabase. Periksa koneksi, lalu pastikan proyek Supabase masih aktif.';
 return '<b>Publish gagal:</b> '+esc(detail)+(code?' ('+esc(code)+')':'')+'<br>'+help;
}
async function uploadMusic(input){
 const file=input.files&&input.files[0];if(!file)return;
 const okType=file.type.startsWith('audio/')||/\.(mp3|m4a|aac|ogg|wav|flac)$/i.test(file.name)||!/\./.test(file.name);
 if(!okType){notify('Pilih file audio (MP3/M4A)');input.value='';return}
 if(file.size>15*1024*1024){notify('Ukuran audio maksimal 15 MB');input.value='';return}
 const ext=audioExt(file);
 const base=String(file.name||'musik').replace(/\.[a-z0-9]{2,5}$/i,'').replace(/[^a-zA-Z0-9._-]/g,'-').replace(/-+/g,'-').replace(/^[-.]+|[-.]+$/g,'')||'musik';
 const displayNm=base.replace(/-/g,' ');
 const addLocal=showNotif=>{const rd=new FileReader();rd.onload=()=>{const item={id:'m'+Date.now(),name:displayNm,url:rd.result,dur:'—',local:true};
  state.musicDb=[item,...state.musicDb];state.music=item;state.playing=false;syncAudio();render();if(showNotif)notify('Musik siap diputar (lokal)')};
  rd.readAsDataURL(file)};
 if(db){notify('Mengupload musik ke Supabase...');
  try{
   const path=`${state.slug||'demo'}/${Date.now()}-${base}.${ext}`;
   const r=await db.storage.from('music').upload(path,file,{contentType:file.type&&file.type.startsWith('audio/')?file.type:audioMime(ext),cacheControl:'3600',upsert:false});
   if(!r.error){const pub=db.storage.from('music').getPublicUrl(path);
    const item={id:'m'+Date.now(),name:displayNm,url:pub.data.publicUrl,dur:'—'};
    state.musicDb=[item,...state.musicDb];state.music=item;state.playing=false;save();syncAudio();render();
    notify('Musik berhasil diupload ke Supabase ✓');return}
   console.error('Upload error:',r.error);
   addLocal(false);
   const em=String(r.error.message||r.error.error||'error');
   if(/security|policy|row.?level|unauthor|denied|violates|403|400/i.test(em)){
    setTimeout(()=>notifyErr('Upload ditolak Supabase ('+esc(em)+').<br><b>Perbaikan:</b> buka Dashboard Supabase → Storage → bucket <b>music</b> → Policies → buat policy <b>INSERT</b> &amp; <b>SELECT</b> untuk role <b>anon</b>. Sementara ini musik dipakai secara lokal dulu.',12000),400);
   }else if(/mime|content.?type|not.?supported/i.test(em)){
    setTimeout(()=>notifyErr('Format ditolak bucket ('+esc(em)+'). Cek setting bucket music → Allowed MIME types → kosongkan atau isi audio/*.',12000),400);
   }else{setTimeout(()=>notifyErr('Upload gagal: '+esc(em)+' — musik dipakai secara lokal dulu.',9000),400)}
   return;
  }catch(e){console.error(e);addLocal(false);setTimeout(()=>notifyErr('Koneksi Supabase bermasalah: '+esc(e.message||e)+' — musik dipakai secara lokal dulu.',9000),400);return}
 }
 addLocal(true)}

let _cvDrag=null;
function cvMulai(e){const el=e.currentTarget,im=el.querySelector('img');if(!im)return;
 e.preventDefault();const p=cvPos();
 _cvDrag={el:el,im:im,x0:e.clientX,y0:e.clientY,x:p.x,y:p.y,r:el.getBoundingClientRect(),
  iw:im.naturalWidth||im.width||1,ih:im.naturalHeight||im.height||1};
 el.style.cursor='grabbing';if(el.setPointerCapture)el.setPointerCapture(e.pointerId);
 window.addEventListener('pointermove',cvJalan);window.addEventListener('pointerup',cvLepas)}
function cvJalan(e){if(!_cvDrag)return;const d=_cvDrag,p=cvPos();
 const skala=Math.max(d.r.width/d.iw,d.r.height/d.ih)*p.z;
 const lx=Math.max(0,d.iw*skala-d.r.width),ly=Math.max(0,d.ih*skala-d.r.height);
 p.x=Math.max(0,Math.min(100,d.x-(lx?(e.clientX-d.x0)*100/lx:0)));

/* Kecilkan foto sampai maks 1200 px (JPEG 0.82 / PNG). Data URL asli langsung
   dipakai dulu agar tidak pernah menunggu; versi kecil menyusul menggantikan.
   Bila berkas bukan gambar / gagal didekode, alamat asli dibiarkan apa adanya. */
function kecilkanFoto(dataUrl,tipe){return new Promise(res=>{
 let selesai=false;const akhiri=v=>{if(!selesai){selesai=true;res(v)}};
 try{
  const im=new Image();
  im.onload=()=>{try{
    const M=1200;let w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;
    if(!w||!h)return akhiri(dataUrl);
    if(w<=M&&h<=M&&dataUrl.length<300000)return akhiri(dataUrl);
    const sk=Math.min(M/w,M/h,1);w=Math.max(1,Math.round(w*sk));h=Math.max(1,Math.round(h*sk));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(im,0,0,w,h);
    const keluar=(tipe==='image/png')?'image/png':'image/jpeg';
    const hasil=c.toDataURL(keluar,0.82);
    akhiri(hasil&&hasil.length&&hasil.length<dataUrl.length?hasil:dataUrl);
  }catch(e){akhiri(dataUrl)}};
  im.onerror=()=>akhiri(dataUrl);
  im.src=dataUrl;
 }catch(e){akhiri(dataUrl)}
})}

/* Simpan undangan jadi 1 file HTML mandiri (data ditanam di dalam file) →
   bisa disimpan di storage mana pun & dibuka offline di browser apa pun */
async function dlUndangan(){
 try{
  const r=await fetch('undangan.html');if(!r.ok)throw new Error('HTTP '+r.status);
  let html=await r.text();
  const data={form:JSON.parse(JSON.stringify(state.form)),event:state.event,tpl:state.tpl,doa:state.doa,
   accent:state.accent,fontTitle:state.fontTitle,fontBody:state.fontBody,border:state.border,
   amplop:JSON.parse(JSON.stringify(state.amplop)),slides:JSON.parse(JSON.stringify(state.slides)),anim:JSON.parse(JSON.stringify(state.anim)),
   videoLink:state.videoLink||'',
   music:(state.music&&!state.music.local)?{name:state.music.name,url:new URL(state.music.url,location.href).href}:{name:'',url:''},
   cover:state.cover||'',coverStyle:cvGayaAktif(),coverPos:Object.assign({},cvPos()),
   gallery:Array.isArray(state.gallery)?state.gallery.slice(0,12):[],publishedAt:new Date().toISOString()};
  if(JSON.stringify(data).length>1500000){data.gallery=[];
   if(JSON.stringify(data).length>1200000){data.cover='';
    if(JSON.stringify(data).length>900000){notifyErr('Data terlalu besar utk 1 file — kurangi/kompres foto dulu');return}}}
  const draft={slug:state.slug||'',name1:state.event==='pernikahan'?state.form.namaPria:state.form.namaAnak,
   name2:state.event==='pernikahan'?state.form.namaWanita:'',
   theme:Math.max(0,TPL.findIndex(t=>t.id===state.tpl)),data};
  /* Penyesuaian kontras tema (assets/theme-contrast.js) ikut disematkan supaya
     teks tetap terbaca saat file dibuka offline — aset di folder assets/ tidak
     terbawa saat file dipindah. Gagal mengambil aset tidak membatalkan simpan. */
  let tcSrc='',scrollFxCss='',scrollFxJs='';
  try{const tr=await fetch('assets/theme-contrast.js');if(tr.ok)tcSrc=await tr.text()}catch(e){}
  /* Efek gulir juga disematkan supaya reveal tetap bekerja pada HTML mandiri/offline. */
  try{const sr=await fetch('assets/scroll-effects.css');if(sr.ok)scrollFxCss=await sr.text()}catch(e){}
  try{const sj=await fetch('assets/scroll-effects.js');if(sj.ok)scrollFxJs=await sj.text()}catch(e){}
 let vipJs='';
 try{const vj=await fetch('assets/vip-4d.js');if(vj.ok)vipJs=await vj.text()}catch(e){}
  /* Artwork tema (termasuk kertas Batik & watercolor Sage) ikut disematkan bila ringan,
     supaya file HTML mandiri tetap mempertahankan tampilan tanpa folder assets/. */
  const tpUndang=TPL.find(t=>t.id===state.tpl)||null;
  const embedVisual=async path=>{if(!path)return'';try{const r=await fetch(path);if(!r.ok)return'';
   const bl=await r.blob();if(!bl.size||bl.size>=300000)return'';
   return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result||''));fr.onerror=()=>res('');fr.readAsDataURL(bl)})
  }catch(e){return''}};
  const artSrc=await embedVisual(tpUndang&&tpUndang.bg3d);
  const paperSrc=await embedVisual(tpUndang&&tpUndang.bgPaper);
  const artVars=(artSrc?`--cover-art:url(${artSrc}) !important;`:'')+
   (paperSrc?`--wedding-paper-art:url(${paperSrc}) !important;`:'');
  const artCss=artVars?`<style>html{${artVars}}</style>`:'';
  const scrollCss=scrollFxCss?`<style data-asproject-scroll-effects>${scrollFxCss}</style>`:'';
  const inj='<script>window.EMBEDDED_DATA='+JSON.stringify(draft).replace(/</g,'\\u003c')+';</scr'+'ipt>'+
   (scrollFxJs?'\n<script>'+scrollFxJs.replace(/<\/script/gi,'<\\/script')+'</scr'+'ipt>':'')+
   (tcSrc?'\n<script>'+tcSrc.replace(/<\/script/gi,'<\\/script')+'</scr'+'ipt>':'')+
   (vipJs?'\n<script>'+vipJs.replace(/<\/script/gi,'<\\/script')+'</scr'+'ipt>':'');
  if(artCss||scrollCss)html=html.replace('</head>',scrollCss+artCss+'\n</head>');
  const i=html.indexOf('</head>');
  const final=i>=0?html.slice(0,i)+inj+'\n'+html.slice(i):html.replace('</html>',inj+'\n</html>');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([final],{type:'text/html;charset=utf-8'}));
  a.download='undangan-'+(slugify(displayName())||state.slug||'undangan')+'.html';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
  notify('File HTML tersimpan! Bisa dibuka offline di browser mana pun (data & foto ikut; font web butuh internet)')
 }catch(e){notifyErr('Gagal simpan file: '+(e&&e.message||e))}
}

/* ============ RENDER ============ */
function render(){
 if(!state.started||(state.stage==='ready'&&linkReady())){
  clearScrollReveal($('floatPrev'));clearScrollReveal($('phoneWrap'));$('floatPrev').innerHTML='';
  $('root').innerHTML=!state.started?welcomeView():readyView();syncAudio();return;
 }
 $('root').innerHTML=header()+`<div class="layout">${sidebar()}
  <main class="mainc sb">${state.page==='editor'?editor():state.page==='katalog'?katalog():arsip()}</main>
  <aside class="prevc sb"><div id="phoneWrap" style="width:100%;max-width:360px;margin:auto">${phoneHtml()}</div></aside>
 </div>`;
 syncAudio();syncFloat()}
function renderPreview(){const w=$('phoneWrap');if(w)w.innerHTML=phoneHtml();syncFloat()}
/* ===== Floating preview — mini HP melayang berisi undangan yang sedang dibuat ===== */
let _fpExpanded=false,_fpDrag=null;
function syncFloat(){const w=$('floatPrev');if(!w)return;
 setupScrollReveal($('phoneWrap'),document.querySelector('.prevc'));
 clearScrollReveal(w); // Disconnect before replacing the floating DOM.
 const oldScreen=w.querySelector('.fp-screen');
 const scrollRatio=oldScreen&&oldScreen.scrollHeight?oldScreen.scrollTop/oldScreen.scrollHeight:0;
 w.classList.toggle('fp-expanded',_fpExpanded);
 if(!state.floatPrevOn){w.style.left='';w.style.top='';w.style.right='';w.style.bottom='';w.innerHTML=`<button class="fp-pill" onclick="setFloat(true)" title="Tampilkan floating preview">📱 Preview</button>`;return}
 const ph=document.querySelector('#phoneWrap .phone');
 // A non-interactive copy: no duplicate IDs, form focus, or source event handlers.
 const copy=ph?ph.cloneNode(true):null;
 if(copy){copy.querySelectorAll('.ap').forEach(el=>el.classList.remove('ap'));
  [copy,...copy.querySelectorAll('*')].forEach(el=>{el.removeAttribute('id');el.removeAttribute('autofocus');Array.from(el.attributes).filter(a=>a.name.startsWith('on')).forEach(a=>el.removeAttribute(a.name))})}
 w.innerHTML=`<div class="fp-box">
  <div class="fp-head" onpointerdown="fpDragStart(event)"><span>📱 Live Preview</span>
   <span class="fp-actions">
    <button title="${_fpExpanded?'Perkecil preview':'Perbesar preview'}" aria-label="${_fpExpanded?'Perkecil preview':'Perbesar preview'}" aria-expanded="${_fpExpanded}" onclick="floatGo()">${_fpExpanded?'⤡':'⤢'}</button>
    <button title="Sembunyikan preview" aria-label="Sembunyikan preview" onclick="setFloat(false)">–</button>
   </span></div>
  <div class="fp-screen" tabindex="0" role="region" aria-label="Pratinjau undangan, gulir untuk melihat isi"><div class="fp-scale" inert></div></div>
  <div class="fp-hint">geser judul • gulir layar • ⤢ perbesar</div>
 </div>`;
 if(copy)w.querySelector('.fp-scale').appendChild(copy);
 fitFloat();
 const screen=w.querySelector('.fp-screen');screen.scrollTop=scrollRatio*screen.scrollHeight;
 setupScrollReveal(w,screen);
}
function setFloat(v){state.floatPrevOn=v;save();syncFloat()}
function floatGo(){_fpExpanded=!_fpExpanded;syncFloat()}
function placeFloat(x,y){const w=$('floatPrev'),r=w.getBoundingClientRect(),gap=8;
 const pos={x:Math.max(gap,Math.min(Number.isFinite(x)?x:gap,window.innerWidth-r.width-gap)),y:Math.max(gap,Math.min(Number.isFinite(y)?y:gap,window.innerHeight-r.height-gap))};
 Object.assign(w.style,{left:pos.x+'px',top:pos.y+'px',right:'auto',bottom:'auto'});return pos;
}
function fitFloat(){const w=$('floatPrev');if(!w||!state.floatPrevOn)return;
 const screen=w.querySelector('.fp-screen'),scale=w.querySelector('.fp-scale');
 if(screen&&scale)scale.style.zoom=screen.clientWidth/340;
 if(state.floatPos){placeFloat(state.floatPos.x,state.floatPos.y)}
 else{w.style.left='';w.style.top='';w.style.right='';w.style.bottom=''}
}
function fpDragStart(e){if(e.button!==0||e.target.closest('button'))return;
 const w=$('floatPrev'),r=w.getBoundingClientRect(),head=e.currentTarget;
 _fpDrag={dx:e.clientX-r.left,dy:e.clientY-r.top};
 head.setPointerCapture(e.pointerId);
 const mv=ev=>{if(!_fpDrag||ev.pointerId!==e.pointerId)return;placeFloat(ev.clientX-_fpDrag.dx,ev.clientY-_fpDrag.dy)};
 const up=ev=>{if(ev.pointerId!==e.pointerId)return;
  const rect=w.getBoundingClientRect();state.floatPos=placeFloat(rect.left,rect.top);save();_fpDrag=null;
  head.removeEventListener('pointermove',mv);head.removeEventListener('pointerup',up);head.removeEventListener('pointercancel',up);head.removeEventListener('lostpointercapture',up);
  if(head.hasPointerCapture(e.pointerId))head.releasePointerCapture(e.pointerId);
 };
 head.addEventListener('pointermove',mv);head.addEventListener('pointerup',up);head.addEventListener('pointercancel',up);head.addEventListener('lostpointercapture',up);e.preventDefault();
}
window.addEventListener('resize',fitFloat);

if(paksaTier())save();
/* pratinjau ringan 4D: geser latar pratinjau mengikuti mouse saat tier VIP */
document.addEventListener('mousemove',function(e){if(typeof bolehVip!=='function'||!bolehVip())return;var ap=document.querySelector('.ap');if(!ap)return;var r=ap.getBoundingClientRect();if(!r.width)return;var dx=(e.clientX-r.left)/r.width*2-1,dy=(e.clientY-r.top)/r.height*2-1;if(dx<-1.2||dx>1.2||dy<-1.2||dy>1.2)return;ap.style.backgroundPosition=(50+dx*3).toFixed(1)+'% '+(50+dy*3).toFixed(1)+'%';},{passive:true});
render();
</script>
