<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in Tamu — AsProject</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-asproject.svg">
<style>
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f1a12;color:#f2efe9;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.box{max-width:440px;width:100%;background:#fff;color:#2b2b2b;border-radius:24px;padding:38px 28px;text-align:center;box-shadow:0 40px 80px rgba(0,0,0,.45)}
.ok{width:74px;height:74px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,#34d399,#10b981);display:grid;place-items:center;font-size:38px;color:#fff;box-shadow:0 14px 30px rgba(16,185,129,.4)}
h1{font-size:20px;margin:18px 0 4px}
.sub{font-size:13px;color:#6b6157;margin:0}
.guest{margin-top:20px;background:#f7faf8;border:1px solid #e3efe7;border-radius:16px;padding:16px}
.guest .l{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#4A6741}
.guest .n{margin-top:6px;font-size:22px;font-weight:700;font-family:Georgia,serif;color:#1c2b1e;word-break:break-word}
.meta{margin-top:12px;font-size:12px;color:#7a857c;line-height:1.7}
.code{margin-top:14px;font-family:ui-monospace,monospace;font-size:13px;background:#faf8f3;border:1px dashed #d8cfbc;border-radius:10px;padding:10px;color:#8a6d0f;letter-spacing:.06em}
.badge{margin-top:22px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#9a8f82}
a{color:#4A6741}
</style>
</head>
<body>
<div class="box">
 <div class="ok">✓</div>
 <h1>Check-in Tamu</h1>
 <p class="sub" id="sub">Data tamu terbaca dari QR.</p>
 <div class="guest">
  <div class="l">Nama Tamu</div>
  <div class="n" id="nama">—</div>
  <div class="meta" id="meta"></div>
 </div>
 <div class="code" id="code"></div>
 <div class="badge">AsProject • QR Check-in</div>
</div>
<script>
(function(){
 var q=new URLSearchParams(location.search);
 var nama=(q.get('guest')||'').trim()||'(tanpa nama)';
 var code=(q.get('id')||'').toUpperCase();
 var slug=(q.get('s')||'').toLowerCase();
 document.getElementById('nama').textContent=nama;
 document.getElementById('code').textContent='Kode: '+(code||'—');
 document.getElementById('meta').innerHTML=
  'Waktu scan: <b>'+new Date().toLocaleString('id-ID')+'</b><br>'+
  (slug?('Undangan: <b>'+slug.replace(/-/g,' ')+'</b>'):'');
 /* coba lengkapi nama acara dari Supabase (opsional, tetap tampil tanpa ini) */
 if(slug){
  fetch('https://aalrhvirqwjtbbxmteeg.supabase.co/rest/v1/invitation_drafts?slug=eq.'+encodeURIComponent(slug)+'&select=name1,name2,event_date',{
   headers:{apikey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhbHJodmlycXdqdGJieG10ZWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjg4NTUsImV4cCI6MjEwNjgwNDg1NX0.fQA5_bIQbuvHTS3f9AJy4k2SO4kycgG_SQIdbmo-EBw',
        Authorization:'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhbHJodmlycXdqdGJieG10ZWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjg4NTUsImV4cCI6MjEwNjgwNDg1NX0.fQA5_bIQbuvHTS3f9AJy4k2SO4kycgG_SQIdbmo-EBw'}
  }).then(function(r){return r.ok?r.json():null}).then(function(rows){
   if(rows&&rows.length){
    var nm=(rows[0].name1||'').trim()+(rows[0].name2?' & '+rows[0].name2:'');
    if(nm)document.getElementById('meta').innerHTML+='<br>Acara: <b>'+nm.replace(/</g,'&lt;')+'</b>';
   }
  }).catch(function(){});
 }
})();
</script>
</body>
</html>
