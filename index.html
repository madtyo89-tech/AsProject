const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}

function notify(msg){document.querySelectorAll('.notice').forEach(n=>n.remove());const n=document.createElement('div');n.className='notice';n.innerHTML='<span style="width:20px;height:20px;border-radius:99px;background:#10b981;display:grid;place-items:center;font-size:12px">✓</span>'+esc(msg);document.body.append(n);setTimeout(()=>n.remove(),3000)}

function qrData(g){const cv=document.createElement('canvas');cv.width=300;cv.height=300;const x=cv.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,300,300);let T=0;for(const ch of g.nama+g.code)T+=ch.charCodeAt(0);
 const rnd=n=>{T=(T*9301+49297)%233280;return T/233280*n};x.fillStyle='#111';const N=21,C=300/N;
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(c<2||r<2||c>N-3||r>N-3)continue;

  if(rnd(1)>.55)x.fillRect(c*C,r*C,C-1,C-1)}
 x.fillStyle='#D4AF37';x.fillRect(0,276,300,24);x.fillStyle='#fff';x.font='bold 10px Inter';
 x.fillText(state.showNameQr?`${g.code} • ${g.nama.slice(0,14)}`:g.code,10,291);return cv.toDataURL()}

async function uploadMusic(input){
 const file=input.files&&input.files[0];if(!file)return;
 const okType=file.type.startsWith('audio/')||/\.(mp3|m4a|aac|ogg|wav)$/i.test(file.name);
 if(!okType){notify('Pilih file audio (MP3/M4A)');input.value='';return}
 if(file.size>15*1024*1024){notify('Ukuran audio maksimal 15 MB');input.value='';return}
 if(db){notify('Mengupload musik ke Supabase...');
  const path=`${state.slug||'demo'}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'-')}`;
  const r=await db.storage.from('music').upload(path,file,{contentType:file.type||'audio/mpeg'});
  if(!r.error){const pub=db.storage.from('music').getPublicUrl(path);
   const item={id:'m'+Date.now(),name:file.name.replace(/\.[^/.]+$/,''),url:pub.data.publicUrl,dur:'—'};
   state.musicDb=[item,...state.musicDb];state.music=item;state.playing=false;save();syncAudio();render();
   notify('Musik berhasil diupload ke Supabase ✓');return}
  console.error('Upload error:',r.error);
  notify('Upload gagal: '+(r.error.message||'error')+' — pakai preview lokal')}
 const rd=new FileReader();rd.onload=()=>{const item={id:'m'+Date.now(),name:file.name.replace(/\.[^/.]+$/,''),url:rd.result,dur:'—',local:true};
  state.musicDb=[item,...state.musicDb];state.music=item;state.playing=false;syncAudio();render();notify('Musik siap diputar (lokal)')};
 rd.readAsDataURL(file)}

function syncAudio(){const p=$('player');if(!p)return;if(state.music&&p.src!==state.music.url)p.src=state.music.url;if(state.playing&&state.music){p.play().catch(()=>{})}else{p.pause()}}
function uploadCover(input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.cover=r.result;save();render()};r.readAsDataURL(f)}
