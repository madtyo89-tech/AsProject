<style>
/* Warm, paper-like styling for the catalog. */
#katalog.catalog-section {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  margin-block: 1.25rem;
  border: 1px solid rgba(131, 99, 68, 0.15);
  border-radius: 38px;
  background:
    radial-gradient(ellipse at 4% 8%, rgba(207, 174, 137, 0.22), transparent 34%),
    radial-gradient(ellipse at 96% 92%, rgba(191, 158, 124, 0.18), transparent 32%),
    linear-gradient(138deg, #f7eee2 0%, #fcf8f2 54%, #f3e8da 100%);
  box-shadow: 0 20px 60px rgba(89, 64, 42, 0.055);
}
#katalog.catalog-section::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image: repeating-linear-gradient(135deg, rgba(116, 86, 59, 0.025) 0 1px, transparent 1px 7px);
  opacity: 0.42;
}
#katalog.catalog-section > * {
  position: relative;
  z-index: 1;
}
#katalog .catalog-heading h2 {
  color: #46382d;
}
#katalog .catalog-heading p {
  color: #766656;
  opacity: 1;
}
#katalog .catalog-eyebrow {
  display: inline-flex;
  width: fit-content;
  align-items: center;
  padding: 0.42rem 0.78rem;
  border: 1px solid rgba(132, 98, 66, 0.17);
  border-radius: 999px;
  background: rgba(255, 251, 245, 0.82);
  color: #876a4f;
  opacity: 1;
}
#katalog .catalog-count {
  border-color: rgba(132, 98, 66, 0.18) !important;
  background: rgba(255, 251, 245, 0.86);
  color: #6d5948;
}
#katalog .catalog-filters {
  width: max-content;
  max-width: 100%;
  padding: 0.4rem;
  border: 1px solid rgba(132, 98, 66, 0.14);
  border-radius: 999px;
  background: rgba(255, 251, 245, 0.72);
  box-shadow: 0 8px 22px rgba(87, 62, 39, 0.045);
  scroll-padding-inline: 0.5rem;
}
#katalog .catalog-filters button {
  border-color: #eadfce;
  border-radius: 999px;
  background: #fffaf3;
  color: #725b46;
  transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
}
#katalog .catalog-filters button:not([aria-pressed="true"]):hover {
  border-color: #cdb79b;
  background: #f5ecdf;
  transform: translateY(-1px);
}
#katalog .catalog-filters button[aria-pressed="true"] {
  border-color: #604a37;
  background: #604a37;
  color: #fffaf2;
  box-shadow: 0 5px 13px rgba(96, 74, 55, 0.2);
}
#katalog .catalog-filters button:focus-visible,
#katalog .catalog-card button:focus-visible,
#katalog .catalog-card a:focus-visible {
  outline: 2px solid #8b7358;
  outline-offset: 3px;
}
#katalog .catalog-card {
  border-color: rgba(130, 99, 69, 0.17) !important;
  border-radius: 26px;
  background-color: #fffdf9 !important;
  box-shadow: 0 9px 25px rgba(91, 66, 43, 0.065) !important;
}
#katalog .catalog-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 20px 42px rgba(91, 66, 43, 0.13) !important;
}
#katalog .catalog-art {
  isolation: isolate;
}
#katalog .catalog-art::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 12% 8%, rgba(255, 255, 255, 0.38), transparent 44%),
    repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0 1px, transparent 1px 6px);
  opacity: 0.7;
}
#katalog .catalog-paper {
  border-color: rgba(255, 255, 255, 0.9) !important;
  border-radius: 18px;
  background: linear-gradient(150deg, #fffefb 0%, #f8f1e7 100%) !important;
  box-shadow: 0 15px 34px rgba(67, 48, 31, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.64) !important;
}
#katalog .catalog-art > div:first-child > span:nth-child(2) {
  background-color: #604a37;
}
#katalog .catalog-card > div:last-child > div:last-child button {
  border-color: #e8ddcd !important;
  background-color: #fffaf3;
  color: #674f3b;
}
#katalog .catalog-card > div:last-child > div:last-child button:hover {
  background-color: #f4ecdf;
}
#katalog .catalog-card > div:last-child > div:last-child a {
  background-color: #604a37;
  color: #fffaf2;
  box-shadow: 0 5px 12px rgba(96, 74, 55, 0.13);
}
#katalog .catalog-card > div:last-child > div:last-child a:hover {
  background-color: #4d3b2c;
}
#katalog .catalog-note {
  border-color: rgba(148, 116, 74, 0.24) !important;
  background: rgba(255, 249, 237, 0.9) !important;
  color: #796044 !important;
  box-shadow: 0 8px 20px rgba(87, 62, 39, 0.045);
}
@media (max-width: 640px) {
  #katalog.catalog-section {
    margin-inline: 10px;
    padding-inline: 14px;
    border-radius: 28px;
  }
  #katalog .catalog-filters {
    width: 100%;
    border-radius: 18px;
  }
  #katalog .catalog-art {
    height: 280px;
  }
}
@media (prefers-reduced-motion: reduce) {
  #katalog .catalog-card,
  #katalog .catalog-filters button {
    transition: none !important;
  }
  #katalog .catalog-card:hover,
  #katalog .catalog-filters button:not([aria-pressed="true"]):hover {
    transform: none;
  }
}

<a href="studio.html" style="position:fixed;bottom:16px;left:16px;z-index:9999;display:inline-flex;align-items:center;gap:6px;background:#111;color:#fff;font:600 11px Inter,system-ui,sans-serif;padding:8px 14px;border-radius:99px;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:.85;display:flex;align-items:center;gap:7px"><img src="assets/logo-asproject.svg" alt="" style="width:20px;height:20px"> Studio</a>
<!-- ===== AsProject · Katalog enhancement: floating WA + demo live (vanilla, di luar React bundle) ===== -->
<style>
  #aspWaFab{position:fixed;right:18px;bottom:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:9998;
    width:56px;height:56px;border-radius:99px;background:#25D366;display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 28px rgba(37,211,102,.42);text-decoration:none;
    opacity:0;transform:translateY(14px) scale(.85);pointer-events:none;
    transition:opacity .28s ease,transform .32s cubic-bezier(.34,1.56,.64,1)}
  #aspWaFab.is-on{opacity:1;transform:none;pointer-events:auto}
  #aspWaFab:hover{transform:translateY(-2px) scale(1.05)}
  #aspWaFab:active{transform:scale(.96)}
  #aspWaFab svg{width:28px;height:28px;fill:#fff;position:relative;z-index:1}
  #aspWaFab::before{content:"";position:absolute;inset:0;border-radius:99px;border:2px solid rgba(37,211,102,.55);
    animation:aspFabPulse 2.6s ease-out infinite}
  @keyframes aspFabPulse{0%{transform:scale(1);opacity:.7}70%{transform:scale(1.55);opacity:0}100%{opacity:0}}
  .asp-fab-tip{position:absolute;right:66px;white-space:nowrap;background:#1a1a1a;color:#fff;
    font:600 11px Inter,system-ui,sans-serif;padding:6px 10px;border-radius:8px;
    opacity:0;transform:translateX(6px);transition:opacity .2s ease,transform .2s ease;pointer-events:none}
  #aspWaFab:hover .asp-fab-tip{opacity:1;transform:none}
  @media (max-width:767px){.asp-fab-tip{display:none}#aspWaFab{width:52px;height:52px;right:14px}}
  @media (prefers-reduced-motion:reduce){#aspWaFab::before{animation:none}}

  .asp-demo{height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--border,#ede6de);
    background:var(--surface,#fff);color:var(--text,#2b2b2b);text-decoration:none;
    font:500 14px Inter,system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:background .2s ease,border-color .2s ease,transform .2s ease}
  .asp-demo:hover{background:var(--muted,#f9f5f0);border-color:#d9cfc2;transform:translateY(-1px)}
  .asp-demo svg{width:14px;height:14px;fill:currentColor;flex:none}
</style>
<script>
(function () {
  'use strict';

  /* ---- Konfigurasi ---- */
  var WA_NUMBER = '6285196755675';

  /* Peta demo per nama tema. Kalau nama tidak terdaftar, jatuh ke peta kategori.
     File harus ada di folder /demo/ — tombol hanya muncul kalau file-nya benar-benar ada. */
  var DEMO_BY_NAME = {
    'Adat Jawa Elegan': 'demo/wedding-premium.html',
    'Minimalist Sage': 'demo/wedding-premium.html',
    'Luxury Gold': 'demo/wedding-premium.html',
    'Floral Rustic': 'demo/wedding-premium.html',
    'Biru Ceria': 'demo/khitanan-basic.html',
    'Islamic Elegant': 'demo/khitanan-premium.html',
    'Islamic Neutral': 'demo/khitanan-premium.html',
    'Kids Party': 'demo/ultah-anak.pdf',
    'Sweet 17': 'demo/ice-blue.html',
    'Adult Elegant': 'demo/ice-blue.html',
    'Baby Boy': 'demo/ice-blue.html',
    'Baby Girl': 'demo/ice-blue.html'
  };
  var DEMO_BY_CATEGORY = {
    'Pernikahan': 'demo/wedding-premium.html',
    'Khitanan': 'demo/khitanan-premium.html',
    'Ulang Tahun': 'demo/ultah-anak.pdf',
    'Aqiqah': 'demo/ice-blue.html'
  };

  var WA_ICON = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C9.4 3 4 8.3 4 14.9c0 2.6.8 5.1 2.3 7.1L4.7 29l7.2-2.1c1.6.9 3.4 1.4 5.1 1.4 6.6 0 12-5.3 12-11.9S22.6 3 16 3zm0 21.6c-1.7 0-3.4-.5-4.8-1.4l-.3-.2-4.3 1.2 1.2-4.1-.2-.3c-1-1.5-1.5-3.2-1.5-5C6.1 9.4 10.5 5 16 5s9.9 4.4 9.9 9.9-4.4 9.7-9.9 9.7zm5.4-7.3c-.3-.1-1.8-.9-2-1s-.5-.1-.7.1-.8 1-1 1.2-.4.2-.7.1c-.3-.1-1.2-.5-2.3-1.5-.9-.8-1.4-1.7-1.6-2s0-.4.1-.6l.5-.6c.1-.2.2-.3.3-.5s0-.4 0-.5-.7-1.7-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4s-1 1-1 2.4 1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.2-.3-.2-.6-.3z"/></svg>';
  var PLAY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

  var fab = null;
  var lastTheme = null;
  var lastCategory = null;
  var katalogVisible = false;
  var demoOk = Object.create(null);
  var timer = null;

  function node(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function modalEl() { return document.querySelector('.fixed.inset-0.z-50'); }
  function textOf(n) { return n && n.textContent ? n.textContent.trim() : ''; }

  function cardInfo(card) {
    var name = textOf(card.querySelector('h3'));
    var cat = textOf(card.querySelector('.catalog-art span'));
    return { name: name, category: cat, path: DEMO_BY_NAME[name] || DEMO_BY_CATEGORY[cat] || null };
  }

  function probe(path, cb) {
    if (path in demoOk) { cb(demoOk[path]); return; }
    fetch(path, { method: 'HEAD' })
      .then(function (r) { demoOk[path] = !!r.ok; cb(demoOk[path]); })
      .catch(function () { demoOk[path] = false; cb(false); });
  }

  /* ---- Tombol WA mengambang ---- */
  function buildFab() {
    if (fab || !document.body) return;
    fab = node('a');
    fab.id = 'aspWaFab';
    fab.target = '_blank';
    fab.rel = 'noopener';
    fab.setAttribute('aria-label', 'Chat WhatsApp AsProject');
    fab.innerHTML = WA_ICON + '<span class="asp-fab-tip">Tanya tema ini</span>';
    document.body.appendChild(fab);
  }

  function currentTheme() {
    var m = modalEl();
    if (m) { var h = textOf(m.querySelector('h3')); if (h) return h; }
    return lastTheme;
  }

  function syncFab() {
    if (!fab) return;
    var name = currentTheme();
    var msg = name
      ? 'Halo AsProject.My.Id! Aku lihat tema *' + name + '* di katalog, masih tersedia? ✨'
      : 'Halo AsProject.My.Id! Aku lagi lihat katalog temanya, boleh minta rekomendasi yang cocok? ✨';
    fab.href = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg);
    fab.title = name ? 'Tanya soal tema ' + name : 'Chat admin AsProject';
  }

  function syncVisibility() {
    /* Sembunyi saat modal tema terbuka biar tidak menutupi tombol Demo Live / Pesan di dalamnya.
       lastTheme tetap tersimpan, jadi pesan WA-nya masih menyebut tema yang barusan dilihat. */
    if (fab) fab.classList.toggle('is-on', katalogVisible && !modalEl());
  }

  function watchKatalog(sec) {
    if (!('IntersectionObserver' in window)) { katalogVisible = true; syncVisibility(); return; }
    new IntersectionObserver(function (entries) {
      katalogVisible = entries.some(function (e) { return e.isIntersecting; });
      syncVisibility();
    }, { rootMargin: '-8% 0px -18% 0px' }).observe(sec);
  }

  /* ---- Demo live di dalam modal tema ---- */
  function enhanceModal() {
    var m = modalEl();
    if (!m) return;
    var row = m.querySelector('.mt-8.flex.gap-3');
    var name = textOf(m.querySelector('h3'));
    if (!row || !name || row.querySelector('.asp-demo')) return;
    var cat = (name === lastTheme) ? lastCategory : null;
    var path = DEMO_BY_NAME[name] || DEMO_BY_CATEGORY[cat] || null;
    if (!path) return;

    probe(path, function (ok) {
      if (!ok) return;
      var now = modalEl();
      if (!now) return;
      var rowNow = now.querySelector('.mt-8.flex.gap-3');
      if (!rowNow || rowNow.querySelector('.asp-demo')) return;
      var a = node('a', 'asp-demo', PLAY_ICON + '<span>Demo Live</span>');
      a.href = path;
      a.target = '_blank';
      a.rel = 'noopener';
      rowNow.insertBefore(a, rowNow.firstChild);

      var divs = now.querySelectorAll('div');
      for (var i = 0; i < divs.length; i++) {
        if (textOf(divs[i]).indexOf('Demo ini preview statis') === 0 && divs[i].getAttribute('data-asp-note') !== '1') {
          divs[i].setAttribute('data-asp-note', '1');
          divs[i].textContent = 'Preview di atas statis — klik “Demo Live” buat lihat versi full interaktif + custom nama tamu, Kak.';
          break;
        }
      }
    });
  }

  function enhance() { syncFab(); syncVisibility(); enhanceModal(); }
  function schedule() {
    if (timer) return;
    timer = setTimeout(function () { timer = null; enhance(); }, 120);
  }

  function boot() {
    buildFab();
    syncFab();

    document.addEventListener('click', function (e) {
      var t = e.target;
      var card = t && t.closest ? t.closest('.catalog-card') : null;
      if (card) {
        var info = cardInfo(card);
        if (info.name) { lastTheme = info.name; lastCategory = info.category; }
      }
      schedule();
    }, true);

    if ('MutationObserver' in window) {
      new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
    }

    var tries = 0;
    (function find() {
      var sec = document.getElementById('katalog');
      if (sec) { watchKatalog(sec); enhance(); return; }
      if (++tries > 60) { enhance(); return; }
      setTimeout(find, 100);
    })();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
