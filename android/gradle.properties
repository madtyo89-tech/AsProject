# Build tanpa AndroidX / Jetifier: aplikasi ini murni memakai API framework.
android.useAndroidX=false
android.enableJetifier=false
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Tanda tangan rilis TIDAK ditulis di berkas ini. Isi lewat variabel lingkungan
# (ASPROJECT_KEYSTORE_FILE, ASPROJECT_KEYSTORE_PASSWORD, ASPROJECT_KEY_ALIAS,
# ASPROJECT_KEY_PASSWORD) atau lewat ~/.gradle/gradle.properties di komputer Anda
# sendiri — jangan pernah commit keystore atau kata sandinya ke Git.
