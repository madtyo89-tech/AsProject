<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanvas Template — AsProject</title>
<meta name="description" content="Kanvas kosong untuk merancang template undangan digital: susun teks, bentuk, ornamen bunga/batik, lalu ekspor jadi tema AsProject.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600;700&family=Bebas+Neue&family=Oswald:wght@400;500;600&family=EB+Garamond:wght@500;600&family=Merriweather:wght@400;700&family=Work+Sans:wght@400;500;600&family=Pacifico&family=Dancing+Script:wght@600;700&family=Caveat:wght@600;700&family=Sacramento&family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/button-help.css">
<style>
:root{--bg:#fafaf8;--card:#fff;--line:#eee;--line2:#e9e9e9;--ink:#1a1a1a;--mut:#737373;--mut2:#a3a3a3;--gold:#D4AF37;--cream:#FFFBEB;--soft:#f5f5f4;--bad:#b91c1c;--ok:#15803d;--warn:#b45309;--pj:#ec4899}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent}
input,textarea,select{outline:0}
::selection{background:rgba(212,175,55,.3)}
.hidden{display:none!important}
.sb::-webkit-scrollbar{width:8px;height:8px}.sb::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:10px}.sb::-webkit-scrollbar-track{background:transparent}

/* ---------- kepala ---------- */
.hdr{position:sticky;top:0;z-index:60;backdrop-filter:blur(24px);background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);height:62px;display:flex;align-items:center;gap:10px;padding:0 14px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#5a4a12;font-size:12px;background:linear-gradient(135deg,#D4AF37,#F9E79F,#D4AF37);box-shadow:0 1px 2px rgba(0,0,0,.08);flex:none}
.hdr h1{font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap}
.hdr .sub{font-size:11px;color:var(--mut);white-space:nowrap}
.sp{flex:1}
.tb{height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);background:#fff;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:inherit}
.tb:hover{background:#fbfaf8}
.tb.dark{background:#111;color:#fff;border-color:#111;font-weight:600}
.tb.dark:hover{background:#000}
.tb.on{background:#111;color:#fff;border-color:#111}
.tb[disabled]{opacity:.4;cursor:not-allowed}
.zoom{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line2);background:#fff;border-radius:99px;height:34px;padding:0 4px}
.zoom button{width:26px;height:26px;border-radius:50%;font-size:14px;color:var(--mut)}
.zoom button:hover{background:var(--soft)}
.zoom span{font-size:11px;min-width:42px;text-align:center;color:var(--mut);font-variant-numeric:tabular-nums}
@media(max-width:1180px){.hdr .sub{display:none}.tb .lbl{display:none}}

/* ---------- tata letak ---------- */
.kvk{display:flex;height:calc(100dvh - 62px);min-height:520px}
.rail{width:66px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:8px 0;align-items:center;z-index:5}
.railb{width:56px;padding:8px 2px;border-radius:12px;font-size:10px;line-height:1.25;display:grid;justify-items:center;gap:3px;color:var(--mut);text-align:center}
.railb i{font-style:normal;font-size:17px}
.railb:hover{background:var(--soft)}
.railb.on{background:#111;color:#fff}
.lib{width:242px;flex:none;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:12px 12px 40px}
.stage{flex:1;position:relative;overflow:auto;background:#f1f1ec;padding:26px;display:flex;align-items:flex-start;justify-content:center;background-image:radial-gradient(#dcdcd4 1px,transparent 1px);background-size:18px 18px}
.panel{width:272px;flex:none;background:#fff;border-left:1px solid var(--line);overflow-y:auto;padding:12px 12px 60px}
@media(max-width:1080px){.lkecil .lib{display:none}.panel{width:250px}}
@media(max-width:820px){.kvk{flex-direction:column;height:auto}.stage{min-height:56vh}.lib,.panel{width:100%;border:0;border-top:1px solid var(--line)}.rail{width:100%;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;gap:6px}.railb{width:auto;min-width:64px;padding:6px 10px}}

/* ---------- komponen samping ---------- */
h4.j{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);margin:14px 2px 7px}
h4.j:first-child{margin-top:2px}
button.aksi{width:100%;text-align:left;padding:9px 11px;border-radius:11px;border:1px solid var(--line2);background:#fff;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:9px;margin-bottom:6px}
button.aksi:hover{background:#fbfaf8;border-color:#ddd}
button.aksi i{font-style:normal;font-size:15px;width:18px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.u{aspect-ratio:1;border:1px solid var(--line2);border-radius:10px;background:#fff;display:grid;place-items:center;color:#8a6e4b;overflow:hidden;padding:6px}
.u:hover{border-color:var(--gold);background:var(--cream)}
.u.on{border-color:#111;background:#f7f7f5}
.u svg{width:100%;height:100%;display:block}
.u.pola{padding:0;background-repeat:repeat;background-size:34px;border-radius:9px}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2)}
.f{display:block;margin-bottom:9px}
.f>span.kt{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px}
input[type=text],input[type=number],select,textarea{width:100%;height:32px;padding:0 9px;border:1px solid var(--line2);border-radius:9px;background:#fff;font-size:12.5px}
textarea{height:auto;padding:8px 9px;resize:vertical;line-height:1.45}
input[type=range]{width:100%;accent-color:#111}
input[type=color]{width:34px;height:32px;padding:2px;border:1px solid var(--line2);border-radius:9px;background:#fff;flex:none}
.baris{display:flex;gap:6px;align-items:center}
.baris input[type=text]{flex:1;min-width:0}
.btn-k{height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line2);background:#fff;font-size:11.5px}
.btn-k:hover{background:var(--soft)}
.btn-k.on{background:#111;color:#fff;border-color:#111}
.btn-k.warn{color:var(--bad);border-color:#f3d6d6}
.tile{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile button{height:44px;border:1px solid var(--line2);border-radius:10px;font-size:11.5px;display:grid;place-items:center;gap:1px;background:#fff}
.tile button:hover{background:#fbfaf8}
.tile button i{font-style:normal;font-size:15px}
.catatan{font-size:11px;color:var(--mut);line-height:1.5;background:var(--soft);border-radius:10px;padding:9px 10px;margin-top:8px}
.catatan b{color:#444}

/* ---------- panggung ---------- */
.bungkus{position:relative;transform-origin:top left;flex:none}
#kanvas{position:relative;overflow:hidden;background:#fff;box-shadow:0 14px 46px rgba(0,0,0,.17);border-radius:2px}
#kanvas .el{position:absolute;cursor:move}
#kanvas .el.tek{white-space:pre-wrap;word-break:break-word}
#kanvas .el.kunci{cursor:not-allowed}
#kanvas .el img{pointer-events:none}
#lapis{position:absolute;inset:0;pointer-events:none;z-index:20}
#lapis .bingkai{position:absolute;border:1.5px solid var(--pj);}
#lapis .peg{position:absolute;width:11px;height:11px;background:#fff;border:1.5px solid var(--pj);border-radius:3px;pointer-events:auto;cursor:pointer}
#lapis .peg.nw{left:-6px;top:-6px;cursor:nwse-resize}#lapis .peg.n{left:calc(50% - 5.5px);top:-6px;cursor:ns-resize}#lapis .peg.ne{right:-6px;top:-6px;cursor:nesw-resize}
#lapis .peg.e{right:-6px;top:calc(50% - 5.5px);cursor:ew-resize}#lapis .peg.se{right:-6px;bottom:-6px;cursor:nwse-resize}#lapis .peg.s{left:calc(50% - 5.5px);bottom:-6px;cursor:ns-resize}
#lapis .peg.sw{left:-6px;bottom:-6px;cursor:nesw-resize}#lapis .peg.w{left:-6px;top:calc(50% - 5.5px);cursor:ew-resize}
#lapis .peg.putar{left:calc(50% - 6px);top:-30px;border-radius:50%;cursor:grab;font-size:9px;display:grid;place-items:center;color:var(--pj)}
#pandu{position:absolute;inset:0;pointer-events:none;z-index:30}
#pandu i{position:absolute;background:var(--pj)}
#pandu i.v{top:-2000px;height:9000px;width:1px}
#pandu i.h{left:-2000px;width:9000px;height:1px}
#petunjuk{position:absolute;left:12px;top:12px;z-index:40;font-size:11px;color:var(--mut);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:9px;padding:5px 9px;pointer-events:none}
#petunjuk b{color:#333}

/* ---------- lapisan ---------- */
.lapis{border:1px solid var(--line2);border-radius:11px;overflow:hidden}
.lapis .baris-l{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:#fff;font-size:12px}
.lapis .baris-l:last-child{border-bottom:0}
.lapis .baris-l.on{background:var(--cream)}
.lapis .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.lapis .ic{width:24px;height:24px;border-radius:7px;font-size:12px;color:var(--mut);display:grid;place-items:center}
.lapis .ic:hover{background:var(--soft)}
.lapis .ic.off{opacity:.35}

/* ---------- modal ---------- */
.tirai{position:fixed;inset:0;background:rgba(17,17,17,.5);backdrop-filter:blur(3px);z-index:80;display:grid;place-items:center;padding:20px}
.lembar{background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.3);width:100%;max-width:820px;max-height:88dvh;overflow:auto;padding:18px}
.lembar h2{font-size:16px;font-weight:600;margin-bottom:3px}
.lembar .ket{font-size:12px;color:var(--mut);margin-bottom:12px}
.lembar .kaki{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.doc{display:flex;gap:11px;align-items:center;border:1px solid var(--line2);border-radius:12px;padding:9px;margin-bottom:8px}
.doc.on{border-color:#111;background:#fcfcfa}
.doc img{width:56px;height:74px;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:#fff;flex:none}
.doc .info{flex:1;min-width:0}
.doc .info b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .info span{font-size:11px;color:var(--mut)}
pre.kode{background:#0f172a;color:#e2e8f0;border-radius:11px;padding:12px;font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-all}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,26px);background:#111;color:#fff;font-size:12.5px;padding:10px 16px;border-radius:99px;opacity:0;transition:.22s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:#14532d}#toast.bad{background:#7f1d1d}#toast.warn{background:#78350f}
#cetak{display:none}
</style>
</head>
<body class="sb">

<header class="hdr">
  <div class="logo">KV</div>
  <div><h1>Kanvas Template</h1><div class="sub">Kanvas kosong: susun teks, bentuk, bunga &amp; batik sesuka hati — lalu jadikan tema</div></div>
  <div class="sp"></div>
  <button class="tb" id="bUndo" onclick="undo()" title="Ctrl+Z" data-help="Kembalikan satu langkah.">↶<span class="lbl"> Undo</span></button>
  <button class="tb" id="bRedo" onclick="redo()" title="Ctrl+Y" data-help="Ulangi langkah yang dibatalkan.">↷<span class="lbl"> Redo</span></button>
  <span class="zoom">
    <button onclick="zoomKe(-1)" data-help="Perkecil tampilan.">−</button>
    <span id="zLabel">100%</span>
    <button onclick="zoomKe(1)" data-help="Perbesar tampilan.">+</button>
    <button onclick="pasHalaman()" title="Sesuaikan layar" data-help="Sesuaikan kanvas dengan ukuran layar.">⤢</button>
  </span>
  <button class="tb" id="bSnap" onclick="toggleSnap()" data-help="Tempelkan elemen ke tengah/tepi kanvas dan ke elemen lain.">🧲<span class="lbl"> Snap</span></button>
  <button class="tb" onclick="bukaBerkas()" data-help="Daftar kanvas, kanvas baru, impor/ekspor JSON.">📄<span class="lbl"> Berkas</span></button>
  <button class="tb dark" onclick="bukaEkspor()" data-help="HTML mandiri, SVG, JSON, cetak/PDF, atau jadikan tema katalog.">⤓<span class="lbl"> Ekspor</span></button>
  <a class="tb" href="template-studio.html" data-help="Studio Template: tambah palet, kontras, animasi, lalu pasang ke katalog.">🎨<span class="lbl"> Studio Template</span></a>
  <a class="tb" href="studio.html" data-help="Studio undangan: tempat tema ini dipakai untuk satu undangan.">✎<span class="lbl"> Studio Undangan</span></a>
  <button class="tb" onclick="bukaPanduan()" data-help="Cara pakai kanvas dalam 6 langkah.">📘<span class="lbl"> Panduan</span></button>
</header>

<div class="kvk" id="kvk">
  <nav class="rail" id="rail">
    <button class="railb on" data-lib="elemen" onclick="pilihLib('elemen')"><i>＋</i>Elemen</button>
    <button class="railb" data-lib="teks" onclick="pilihLib('teks')"><i>T</i>Teks</button>
    <button class="railb" data-lib="latar" onclick="pilihLib('latar')"><i>❖</i>Latar</button>
    <button class="railb" data-lib="ornamen" onclick="pilihLib('ornamen')"><i>✿</i>Ornamen</button>
    <button class="railb" data-lib="unggah" onclick="pilihLib('unggah')"><i>⬆</i>Gambar</button>
  </nav>

  <aside class="lib sb" id="lib"></aside>

  <main class="stage sb" id="stage">
    <div class="sizer" id="sizer" style="width:900px;height:1200px">
      <div class="bungkus" id="bungkus" style="width:900px">
        <div id="kanvas" style="width:900px;height:1200px"></div>
        <div id="lapis"></div>
        <div id="pandu"></div>
      </div>
    </div>
    <div id="petunjuk">Klik kanvas untuk mulai · <b>dobel klik</b> teks untuk menulis · <b>Ctrl+Z</b> undo · <b>Del</b> hapus</div>
  </main>

  <aside class="panel sb" id="panel"></aside>
</div>

<div id="toast" class=""></div>
<div id="cetak"></div>

<script src="assets/theme-contrast.js"></script>
<script src="assets/button-help.js"></script>
<script>
/* ====================== MESIN (SALINAN PERSIS dari studio.html) ======================
   Daftar font, bagian undangan, motif latar, bentuk ornamen, hiasan sudut, dan
   pembatas disalin apa adanya supaya rancangan di kanvas ini bisa langsung
   dijadikan tema katalog. Jangan ubah manual — sinkronkan dengan:
   python3 tools/sinkron-studio-template.py
   ============================================================================ */
const FONTS=[
 {id:'cormorant',name:'Cormorant Garamond',fam:'"Cormorant Garamond",serif'},
 {id:'playfair',name:'Playfair Display',fam:'"Playfair Display",serif'},
 {id:'poppins',name:'Poppins Bold',fam:'"Poppins",sans-serif'},
 {id:'inter',name:'Inter',fam:'"Inter",sans-serif'},
 {id:'lora',name:'Lora',fam:'"Lora",serif'},
 /* 10 font baru */
 {id:'montserrat',name:'Montserrat',fam:'"Montserrat",sans-serif'},
 {id:'bebas',name:'Bebas Neue (display)',fam:'"Bebas Neue",sans-serif'},
 {id:'oswald',name:'Oswald (condensed)',fam:'"Oswald",sans-serif'},
 {id:'ebgaramond',name:'EB Garamond (klasik)',fam:'"EB Garamond",serif'},
 {id:'merriweather',name:'Merriweather (serif)',fam:'"Merriweather",serif'},
 {id:'work-sans',name:'Work Sans',fam:'"Work Sans",sans-serif'},
 {id:'pacifico',name:'Pacifico (script)',fam:'"Pacifico",cursive'},
 {id:'dancing',name:'Dancing Script',fam:'"Dancing Script",cursive'},
 {id:'caveat',name:'Caveat (tulis tangan)',fam:'"Caveat",cursive'},
 {id:'sacramento',name:'Sacramento (elegan)',fam:'"Sacramento",cursive'},
 {id:'cinzel',name:'Cinzel Imperial 🔒',fam:'"Cinzel",serif',ex:1},
 {id:'marcellus',name:'Marcellus Royal 🔒',fam:'"Marcellus",serif',ex:1}]
const SLIDES=[
 {id:'timeline',ic:'⏱️',nm:'Timeline Acara',ds:'Urutan sesi acara (jam — judul)',type:'list',ph:'08:00 — Akad Nikah\n11:00 — Resepsi'},
 {id:'story',ic:'💞',nm:'Cerita Kami',ds:'Kisah singkat di balik acara ini',type:'area',ph:'Kami bertemu di ...'},
 {id:'quote',ic:'❝',nm:'Quote / Ayat',ds:'Kutipan atau ayat — bawaan per acara bila dikosongkan',type:'quote'},
 {id:'menu',ic:'🍽️',nm:'Menu Acara',ds:'Daftar menu (nama — deskripsi)',type:'list',ph:'Sup Iga — Bawang Bakar\nAyam Panggang — Timun'},
 {id:'party',ic:'🎩',nm:'Panitia / Bridal Party',ds:'Nama — peran',type:'list',ph:'Budi — Groomsman\nSari — Bridesmaid'},
 {id:'dresscode',ic:'👗',nm:'Dress Code',ds:'Pemanduan busana + palet warna',type:'dress'},
 {id:'gift',ic:'🎁',nm:'Alamat Kado',ds:'Informasi kado fisik / kartu ucapan',type:'area',ph:'Jl. Contoh No. 1 ...'},
 {id:'map',ic:'🗺️',nm:'Peta Lokasi',ds:'Embed peta dari alamat/mapsLink di Info Acara',type:'none'},
 {id:'rsvp',ic:'✉️',nm:'Form RSVP',ds:'Tamu konfirmasi kehadiran langsung ke WhatsApp',type:'none'},
 {id:'closing',ic:'🤍',nm:'Pesan Penutup',ds:'Ucapan penutup dari penyelenggara',type:'area',ph:'Terima kasih ...'}]
function patCss(t){
 const tile=(svg,size)=>`background-image:url(data:image/svg+xml,${encodeURIComponent(svg)});background-size:${size};background-repeat:repeat;`;
 if(t.pat==='batik'){
  const c=t.accent||'#8b653d';
  return tile(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><g fill="none" stroke="${c}" stroke-opacity=".24" stroke-width="1.5"><path d="M48 4C65 17 65 27 48 41 31 27 31 17 48 4ZM92 48C79 65 69 65 55 48 69 31 79 31 92 48ZM48 92C31 79 31 69 48 55 65 69 65 79 48 92ZM4 48C17 31 27 31 41 48 27 65 17 65 4 48Z"/><path d="M48 31 65 48 48 65 31 48Z"/><circle cx="48" cy="48" r="4"/></g></svg>`, '48px 48px');
 }
 if(t.pat==='botanical'){
  const c=t.accent||'#66816a';
  return tile(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><g fill="none" stroke="${c}" stroke-opacity=".17" stroke-width="1.5" stroke-linecap="round"><path d="M14 108C42 87 65 56 106 13"/><path d="M34 92C17 89 15 73 16 67 31 65 42 75 34 92ZM52 73C36 71 34 57 35 51 51 49 60 59 52 73ZM72 51C57 48 56 34 58 28 73 28 81 39 72 51ZM39 89C42 73 56 69 63 70 64 85 53 95 39 89ZM59 66C62 51 76 47 83 49 83 64 73 73 59 66ZM81 42C84 29 96 24 102 26 103 39 94 48 81 42Z"/></g></svg>`, '120px 120px');
 }
 if(t.pat==='frost'){
  const c=t.accent||'#38BDF8';
  return tile(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><g fill="none" stroke="${c}" stroke-opacity=".2" stroke-width="1.35" stroke-linecap="round"><path d="M24 12v28M12 19l24 14M36 19 12 33M70 52v32M56 61l28 15M84 61 56 76M48 48l7 7-7 7-7-7Z"/><path d="m20 17 4 4 4-4m-16 12 5-1 1 5m16-5-5-1-1 5m28 30 4 5 4-5m-16 13 5-1 1 5m16-5-5-1-1 5"/></g></svg>`, '96px 96px');
 }
 if(t.pat==='rose'){
  const c=t.accent||'#C2708A';
  const mawar=(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="none" stroke="${c}" stroke-opacity=".22" stroke-width="1.3" stroke-linecap="round"><path d="M2 3a6 6 0 1 0-6-6 12 12 0 1 0 12 12 18 18 0 1 0-18-18"/><path d="M13 17c6 3 12 1 14-4-6-2-12 0-14 4"/></g>`;
  return tile(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">${mawar(26,28,1)}${mawar(72,74,.8)}</svg>`, '96px 96px');
 }
 if(t.pat==='sakura'){

function ukuranBaru(e, h, dxs, dys) {
  const th = angka(e.rot, 0) * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);

}
function tambahTeks(id) {
  const t = TEKS_PRESET.filter(x => x.id === id)[0]; if (!t) return;
  tambah('teks', { isi: t.isi, font: t.font, ukuran: t.ukuran, bobot: t.bobot, spasi: t.spasi, tinggi: t.tinggi, rata: t.rata, warna: t.warna, kapital: !!t.kapital, w: Math.min(cur.w - 80, 620), h: Math.round(t.ukuran * t.tinggi * (t.isi.split('\n').length) + 20), x: 60, y: 80 });
}
function ukurUlang(w, h) {
  if (!cur) return;
  cur.w = w; cur.h = h;
  cur.els.forEach(e => { e.x = Math.min(e.x, Math.max(0, w - 40)); e.y = Math.min(e.y, Math.max(0, h - 30)); });
  gambarPanggung(); renderPanel(); catat(); notify('Ukuran kanvas diubah ke ' + w + '×' + h + '.', 'ok');
}
function pakaiPalet(id) {
  const p = PALET.filter(x => x.id === id)[0]; if (!p || !cur) return;
  cur.bg = bakuBg({ mode: 'gradasi', warna: p.a, warna2: p.b, aksen: p.aksen });
  gambarPanggung(); renderPanel(); catat();
}
function pakaiMotif(p) {

  cur.bg = bakuBg(Object.assign({}, cur.bg, { mode: p ? 'motif' : 'polos', motif: p, aksen: cur.bg.aksen }));

}
function pakaiContoh(f) { tambah('gambar', { src: f }); }
function unggah(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  if (f.size > 2.5 * 1024 * 1024) notify('Gambar lebih dari 2,5 MB — penyimpanan perangkat bisa penuh.', 'warn');
  const r = new FileReader();
  r.onload = () => { tambah('gambar', { src: srcAman(r.result) }); inp.value = ''; };
  r.readAsDataURL(f);
}

/* ------------------------------------------------------------ panel kanan */
function kartuF(judul, isi) { return '<h4 class="j">' + esc(judul) + '</h4>' + isi; }
function fAngka(at, label, nilai, o) {

function fWarna(at, label, nilai) {

function fPilih(at, label, daftar, nilai) {

}
function fRange(at, label, nilai, min, max, step) {

}
function fCek(at, label, nilai) {
  return '<label class="f baris" style="gap:8px"><input type="checkbox" data-at="' + at + '"' + (nilai ? ' checked' : '') + '><span style="font-size:12.5px">' + esc(label) + '</span></label>';
}
function renderPanel() {
  const el = $('#panel'); if (!el) return;
  const e = elPilih();

    h += '<h4 class="j">Kanvas</h4>';

    h += kartuF('Latar', fPilih('mode', 'Jenis latar', [['polos', 'Warna polos'], ['gradasi', 'Gradasi'], ['motif', 'Motif bunga/batik']], cur ? cur.bg.mode : 'polos')

    h += kartuF('Berkas', '<button class="aksi" onclick="dokBaruUI()"><i>＋</i>Kanvas baru (kosong)</button>'

    h += '<h4 class="j">Lapisan</h4><div class="lapis" data-lapisan></div>';

  const namaTipe = { teks: 'Teks', kotak: 'Kotak', bulat: 'Bulat', garis: 'Garis', gambar: 'Gambar', ornamen: 'Ornamen', hias: 'Hiasan sudut' }[e.tipe] || e.tipe;
  h += '<h4 class="j">' + esc(namaTipe) + '</h4>';
  h += '<div class="baris" style="margin-bottom:8px"><button class="btn-k" onclick="geserLapisan(1)">↑ Naik</button><button class="btn-k" onclick="geserLapisan(-1)">↓ Turun</button>'

  if (e.tipe === 'teks') {

      + '<button class="btn-k' + (e.kapital ? ' on' : '') + '" data-at="kapital" data-v="' + (!e.kapital) + '" onclick="setAt(this)">AA</button></div>';
    h += fWarna('warna', 'Warna teks', e.warna);

  h += kartuF('Posisi & ukuran', '<div class="baris" style="margin-bottom:9px">' + fAngka('x', 'X', e.x).replace('<label class="f">', '<label class="f" style="flex:1;margin:0">') + fAngka('y', 'Y', e.y).replace('<label class="f">', '<label class="f" style="flex:1;margin:0">') + '</div>'

    + fAngka('rot', 'Putar (°)', e.rot, { step: 1, min: -360, max: 360 }) + fRange('op', 'Transparansi', e.op, .05, 1, .05));

    + '<button class="btn-k' + (e.sembunyi ? ' on' : '') + '" data-at="sembunyi" data-v="' + (!e.sembunyi) + '" onclick="setAt(this)">👁 Sembunyikan</button></div>';

function setAt(t) {
  const at = t.getAttribute('data-at'); let v = t.getAttribute('data-v');
  if (v === 'true') v = true; else if (v === 'false') v = false;
  terapkan(at, v, false);
}
function terapkan(at, v, ringan) {
  const e = elPilih();
  if (e) {
    const b = bakuEl(Object.assign({}, e, { [at]: v }));
    Object.assign(e, b);
  } else if (cur) {
    if (at === 'nama') cur.nama = String(v == null ? '' : v).slice(0, 80) || 'Kanvas tanpa judul';
    else if (at === 'w' || at === 'h') cur[at] = Math.max(120, angka(v, cur[at]));
    else cur.bg = bakuBg(Object.assign({}, cur.bg, { [at]: v }));
  }
  gambarPanggung();
  if (!ringan) { renderLapisan(); catat(); }
}
function ubahPanel(ev) {
  const t = ev.target;
  if (!t || !t.getAttribute) return;
  const at = t.getAttribute('data-at'); if (!at) return;
  let v = t.type === 'checkbox' ? t.checked : t.value;
  terapkan(at, v, t.tagName !== 'SELECT');
  if (t.tagName === 'SELECT' || at === 'mode' || at === 'kunci' || at === 'sembunyikan') renderPanel();
}
function unggahGanti(inp) {
  const f = inp.files && inp.files[0], e = elPilih(); if (!f || !e) return;
  const r = new FileReader();
  r.onload = () => { terapkan('src', srcAman(r.result), true); renderPanel(); catat(); inp.value = ''; };
  r.readAsDataURL(f);
}
function renderLapisan() {
  const el = $('[data-lapisan]'); if (!el || !cur) return;
  if (!cur.els.length) { el.innerHTML = '<div style="padding:9px;font-size:11.5px;color:var(--mut2)">Belum ada elemen.</div>'; return; }
  const nama = e => e.tipe === 'teks' ? (e.isi || 'Teks').split('\n')[0].slice(0, 26) : ({ kotak: 'Kotak', bulat: 'Bulat', garis: 'Garis', gambar: 'Gambar', ornamen: 'Ornamen ' + e.bentuk, hias: 'Hias ' + e.jenis }[e.tipe] || e.tipe);
  el.innerHTML = cur.els.slice().reverse().map(e =>
    '<div class="baris-l' + (e.id === pilih ? ' on' : '') + '"><button class="ic" title="Urutkan naik" onclick="pilihElOne(\'' + e.id + '\');geserLapisan(1)">↑</button>'
    + '<span class="nm" onclick="pilihElOne(\'' + e.id + '\')" title="' + esc(nama(e)) + '">' + esc(nama(e)) + '</span>'
    + '<button class="ic' + (e.kunci ? '' : ' off') + '" title="Kunci" onclick="pilihElOne(\'' + e.id + '\');setAt({getAttribute:()=>null});toggleKunci()">🔒</button>'
    + '<button class="ic' + (e.sembunyi ? ' off' : '') + '" title="Sembunyikan" onclick="pilihElOne(\'' + e.id + '\');toggleSembunyi()">👁</button>'
    + '<button class="ic" title="Hapus" onclick="hapusEl(\'' + e.id + '\')">🗑</button></div>').join('');
}
function pilihElOne(id) { pilihEl(id); }
function toggleKunci() { const e = elPilih(); if (!e) return; terapkan('kunci', !e.kunci, true); renderPanel(); renderLapisan(); }
function toggleSembunyi() { const e = elPilih(); if (!e) return; terapkan('sembunyi', !e.sembunyi, true); renderPanel(); renderLapisan(); }

/* ------------------------------------------------------------- bersih-bersih */
function hapusSemua() {
  if (!cur) return;
  if (!cur.els.length) return notify('Kanvas sudah kosong.', 'warn');
  cur.els = []; pilih = '';
  gambarPanggung(); renderPanel(); catat(); notify('Kanvas dikosongkan.', 'ok');
}
function dokBaruUI(nama, w, h) {
  const d = dokBaru(nama, w || 900, h || 1200);
  dok.push(d); bukaDok(d.id);
  catat(); notify('Kanvas kosong baru dibuat.', 'ok');
}
function bukaDok(id) {
  const d = dok.filter(x => x.id === id)[0]; if (!d) return;
  cur = d; pilih = ''; riw = [jepret()]; rpos = 0; dokIdTerakhir = d.id;
  $('#bungkus').style.width = px(d.w);
  gambarPanggung(); renderPanel(); renderLapisan(); tombolRiwayat(); simpan();
  const a = $('#aNama'); if (a) a.textContent = d.nama;
}
function hapusDok(id) {
  const d = dok.filter(x => x.id === id)[0]; if (!d) return;
  if (!window.confirm('Hapus kanvas "' + d.nama + '"? Tindakan ini tidak bisa dibatalkan.')) return;
  dok = dok.filter(x => x.id !== id);
  if (cur && cur.id === id) { if (!dok.length) dok.push(dokBaru()); bukaDok(dok[0].id); } else simpan();
  renderBerkas(); notify('Kanvas dihapus.', 'ok');
}
function dublikatDok(id) {
  const d = dok.filter(x => x.id === id)[0]; if (!d) return;
  const b = bakuDok(JSON.parse(JSON.stringify(d)));
  b.id = dokBaru().id; b.nama = d.nama + ' (salinan)';
  dok.push(b); bukaDok(b.id); renderBerkas();
}
function gantiNamaUI(id) {
  const d = dok.filter(x => x.id === id)[0]; if (!d) return;
  const n = window.prompt('Nama kanvas:', d.nama);
  if (n == null) return;
  d.nama = String(n).slice(0, 80) || d.nama;
  if (cur && cur.id === id) { renderPanel(); }
  simpan(); renderBerkas();
}

/* ------------------------------------------------------------------ modal */
function modal(judul, ket, isi, lebar) {
  tutupModal();
  const t = document.createElement('div');
  t.className = 'tirai'; t.id = 'tirai';
  t.innerHTML = '<div class="lembar" role="dialog" aria-modal="true"' + (lebar ? ' style="max-width:' + esc(lebar) + '"' : '') + '><h2>' + esc(judul) + '</h2><div class="ket">' + esc(ket) + '</div><div id="modalIsi">' + isi + '</div></div>';
  t.addEventListener('click', ev => { if (ev.target === t) tutupModal(); });
  document.body.appendChild(t);
  return t;
}
function tutupModal() { const t = $('#tirai'); if (t) t.remove(); }

/* ---------------------------------------------------------------- berkas */
function renderBerkas() {
  const el = $('#berkasIsi'); if (!el) return;

  if (e.tipe === 'gambar') return e.src ? buka + '<image href="' + esc(e.src) + '" width="' + angka(e.w, 1) + '" height="' + angka(e.h, 1) + '" preserveAspectRatio="xMidYMid slice"/>' + tutup : '';

function dekoPeta(motif, jenis) {
  /* Motif lebih dulu (batik/bunga), lalu jenis hiasan; hasilnya SELALU id yang ada di

  const benang = ['rose', 'sakura', 'daisy', 'vine', 'botanical'].indexOf(motif) >= 0 || ['floral', 'vine'].indexOf(jenis) >= 0;
  const batik = ['batik', 'parang', 'mendung'].indexOf(motif) >= 0 || jenis === 'batik';
  let d;
  if (batik) d = { dko: 'batik', flt: 'dust', dvd: 'batik' };
  else if (benang) d = { dko: 'floral', flt: motif === 'sakura' ? 'sakura' : 'petal', dvd: 'flower' };
  else if (jenis === 'line') d = { dko: 'gold', flt: 'leaf', dvd: 'line' };
  else if (jenis === 'diamond') d = { dko: 'gold', flt: 'leaf', dvd: 'diamond' };
  else if (motif === 'frost' || jenis === 'lace') d = { dko: 'lace', flt: 'snow', dvd: 'diamond' };
  else if (motif === 'confetti') d = { dko: 'gold', flt: 'bubble', dvd: 'diamond' };
  else if (jenis === 'gold' || jenis === 'ribbon') d = { dko: jenis, flt: 'dust', dvd: 'diamond' };
  else d = { dko: 'gold', flt: 'leaf', dvd: 'diamond' };
  ['dko', 'flt', 'dvd'].forEach(k => { if (DEKO_SAH[k].indexOf(d[k]) < 0) d[k] = DEKO_SAH[k][0]; });
  return d;
}
function jadikanTema(d) {

  const lain = {};
  teks.forEach(e => { if (judul && e.id === judul.id) return; lain[e.font] = (lain[e.font] || 0) + 1 });
  const body = Object.keys(lain).sort((a, b) => lain[b] - lain[a])[0] || 'inter';
  const hias = el.filter(e => e.tipe === 'hias')[0] || null;
  const orn = el.filter(e => e.tipe === 'ornamen')[0] || null;
  const pakai = {};
  el.forEach(e => { const c = warnaAman(e.warna, ''); if (!c || c === 'transparent') return; if (kontras(c, '#ffffff') < 1.6 || kontras(c, '#000000') < 1.4) return; pakai[c] = (pakai[c] || 0) + 1 });

  const dasar = warnaAman(d.bg.warna, '#F7F3EC');
  const kedua = bakuBg(d.bg).mode === 'gradasi' ? bakuBg(d.bg).warna2 : terang(dasar, .12);
  const g = [dasar, kedua, campur(kedua, accent, .3)];
  const ink = inkAman(kontras('#2B2118', dasar) >= 4.5 ? '#2B2118' : gelap(accent, .55), g);
  const jenisHias = hias ? hias.jenis : (orn && ['flower', 'batik', 'vine', 'gold', 'lace', 'ribbon'].indexOf(orn.bentuk) >= 0 ? orn.bentuk : '');
  const { dko, flt, dvd } = dekoPeta(bakuBg(d.bg).mode === 'motif' ? bakuBg(d.bg).motif : '', jenisHias);
  return {
    id: slugify(d.nama || 'kanvas-baru'), nama: String(d.nama || 'Kanvas tanpa judul').slice(0, 60), ev: 'pernikahan', harga: 75000,
    g: g, accent: accent, ink: ink, badge: '', deco: '❀ ❁ ❀',
    pat: bakuBg(d.bg).mode === 'motif' ? bakuBg(d.bg).motif : '', ft: judul ? judul.font : 'cormorant', body: body,
    char: 'KANVAS', desc: 'Rancangan dari Kanvas AsProject.', dko: dko, flt: flt, dvd: dvd,
    rec: { border: hias ? (BORDER_HIAS[hias.jenis] || 'double') : 'double', cover: 'zoom', scroll: 'fade-up', mix: true, slides: SLIDE_BAWAAN.filter(id => SLIDES.some(s => s.id === id)) },
    sumber: 'kanvas', meta: { dibuat: Date.now(), diubah: Date.now() }

}

/* -------------------------------------------------------------- papan tik */
function diKetik(e) {
  const t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
}
function tombolTik(e) {
  if (diKetik(e)) { if (e.key === 'Escape' && e.target.isContentEditable) e.target.blur(); return; }
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (ctrl && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (ctrl && e.key.toLowerCase() === 'd') { e.preventDefault(); duplikatEl(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { if (elPilih()) { e.preventDefault(); hapusEl(); } return; }
  const e2 = elPilih();
  if (e2 && e.key.indexOf('Arrow') === 0) {
    e.preventDefault();
    const lompat = e.shiftKey ? 10 : 1;
    if (e.key === 'ArrowLeft') e2.x -= lompat;
    if (e.key === 'ArrowRight') e2.x += lompat;
    if (e.key === 'ArrowUp') e2.y -= lompat;
    if (e.key === 'ArrowDown') e2.y += lompat;
    gambarPanggung(); renderPanel(); catat();
  }
  if (e.key === 'Escape' && pilih) pilihEl('');
}

function pasangPeristiwa() {

  const k = $('#bungkus');
  ['mousedown', 'touchstart'].forEach(n => k.addEventListener(n, mulai, { passive: false }));
  ['mousemove', 'touchmove'].forEach(n => document.addEventListener(n, gerak, { passive: false }));
  ['mouseup', 'touchend', 'touchcancel'].forEach(n => document.addEventListener(n, lepas));
  $('#kanvas').addEventListener('dblclick', ev => {
    const t = ev.target && ev.target.closest ? ev.target.closest('.el') : null; if (!t) return;
    const e = elDari(t.getAttribute('data-id'));
    if (!e || e.tipe !== 'teks' || e.kunci) return;
    pilihEl(e.id);
    t.setAttribute('contenteditable', 'true'); t.focus();
    const selesai = () => {
      t.removeAttribute('contenteditable');
      const isi = String(t.innerText || t.textContent || '').replace(/\u00a0/g, ' ').replace(/\n{3,}/g, '\n\n');
      e.isi = isi.slice(0, 3000);
      catat(); renderPanel(); renderLapisan();
    };
    t.addEventListener('blur', selesai, { once: true });
    t.addEventListener('keydown', ev2 => { if (ev2.key === 'Escape') t.blur(); });
  });
  const p = $('#panel');
  p.addEventListener('input', ubahPanel);

  document.addEventListener('keydown', tombolTik);
  const st = $('#stage');
  st.addEventListener('wheel', ev => { if (!(ev.ctrlKey || ev.metaKey)) return; ev.preventDefault(); zoomKe(ev.deltaY < 0 ? 1 : -1); }, { passive: false });
  st.addEventListener('click', ev => { if (ev.target === st || ev.target === $('#bungkus') || ev.target === $('#sizer')) pilihEl(''); });

  window.addEventListener('resize', () => { if (cur) terapkanZoom(); });
}
function init() {

  const awal = dok.filter(x => x.id === dokIdTerakhir)[0] || dok[dok.length - 1];
  pasangPeristiwa();
  bukaDok(awal.id);
  gambarPanggung(); renderLib(); renderPanel(); renderLapisan();
  const st = $('#stage');
  if (st && st.clientWidth > 200 && cur && cur.w > st.clientWidth - 60) pasHalaman();
  if (!awal.els.length) notify('Kanvas kosong siap — tambah teks dari panel kiri.', 'ok');
  const j = $('#jmlKanvas'); if (j) j.textContent = dok.length;
  simpan();
}
if (typeof document !== 'undefined' && document.getElementById) init();
