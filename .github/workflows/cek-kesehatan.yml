name: Cek Kesehatan Repo (halaman & uji offline)

# Menjalankan pemeriksa repo + seluruh uji offline pada setiap push/PR.
# Tujuannya: regresi seperti ikon tab yang hilang, nama tamu ber-apostrof yang
# merusak tombol, atau berkas yang tiba-tiba diambil dari CDN langsung ketahuan
# tanpa harus menunggu ada yang membuka GitHub Pages.
#
# Uji yang butuh Chromium sungguhan (playwright-core + @sparticuz/chromium) dan
# server lokal :8080 tidak dijalankan di sini — jalankan manual di mesin lokal:
#   python3 tools/serve.py &
#   LD_LIBRARY_PATH=… node tools/test-mobile-browser.cjs
#   LD_LIBRARY_PATH=… node tools/test-button-help.cjs
#   LD_LIBRARY_PATH=… node tools/test-template-custom-browser.cjs

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'assets/**'
      - 'tools/**'
      - '*.sql'
      - '.github/workflows/cek-kesehatan.yml'
  pull_request:
    paths:
      - '**.html'
      - 'assets/**'
      - 'tools/**'
      - '*.sql'
      - '.github/workflows/cek-kesehatan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cek:
    name: Pemeriksa kesehatan + uji offline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pasang pustaka uji (tidak disimpan ke repo)
        run: npm install --no-save --package-lock=false --no-audit --no-fund jsdom jsqr qrcode-generator

      - name: Pemeriksa kesehatan repo
        run: python3 tools/cek-kesehatan.py

      - name: Seluruh uji offline (kecuali uji yang butuh browser sungguhan)
        run: |
          set -euo pipefail
          gagal=0
          for t in tools/test-*.cjs; do
            case "$t" in
              *test-button-help.cjs|*test-mobile-browser.cjs|*test-template-custom-browser.cjs)
                echo "== lompati (butuh Chromium + server lokal): $t"; continue;;
            esac
            echo "== $t"
            if ! node "$t"; then gagal=1; fi
          done
          exit "$gagal"
