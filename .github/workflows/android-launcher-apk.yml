name: Android APK (AsProject Launcher)

# Membangun APK launcher beranda (my.id.asproject.launcher).
#
# Jalur utama memakai skrip tanpa Gradle — sama dengan yang menghasilkan APK
# di launcher/releases/. Setelah build, APK diperiksa oleh
# launcher/tools/verify_apk.py: build GAGAL bila ada izin di luar 6 izin resmi
# fitur opsional Spidometer mengambang (lihat Accent.java/SpeedometerService),
# bila kategori HOME hilang, atau bila tanda tangan tidak sah.
#
# Rahasia opsional untuk APK rilis bertanda tangan Anda:
#   LAUNCHER_KEYSTORE_BASE64, LAUNCHER_KEYSTORE_PASSWORD,
#   LAUNCHER_KEY_ALIAS, LAUNCHER_KEY_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/android-launcher-apk.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/android-launcher-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.9'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  apk-offline:
    name: Build + verifikasi APK launcher (tanpa Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pastikan Android SDK (android.jar, aapt2, d8, apksigner)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ] && [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-${ANDROID_COMPILE_SDK}" \
                       "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null || true
          fi
          if [ -n "$SDK_ROOT" ] && [ -f "$SDK_ROOT/platforms/android-${ANDROID_COMPILE_SDK}/android.jar" ]; then
            echo "SDK siap: $SDK_ROOT"
          else
            echo "::warning::Android SDK tidak lengkap — build akan mengunduh perkakas yang dipatok (FETCH_TOOLS=1)."
          fi

      - name: Pakai ulang debug keystore antar-run (tanda tangan tetap sama)
        uses: actions/cache@v4
        with:
          path: android/.tools/tools/debug.keystore
          key: asproject-debug-keystore-v1

      - name: Bangun APK debug launcher
        run: |
          set -uo pipefail
          LOG=/tmp/build-launcher.log
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK_ROOT" ] && [ -f "$SDK_ROOT/platforms/android-${ANDROID_COMPILE_SDK}/android.jar" ]; then
            CMD=(bash launcher/buildkit/build-apk.sh)
          else
            CMD=(env FETCH_TOOLS=1 bash launcher/buildkit/build-apk.sh)
          fi
          echo "Perintah: ${CMD[*]}"
          if ! "${CMD[@]}" > "$LOG" 2>&1; then
            tail -n 10 "$LOG" | while IFS= read -r baris; do
              echo "::error::${baris//%/%25}"
            done
            exit 1
          fi
          tail -n 12 "$LOG"

      - name: Periksa APK (izin spidometer, kategori HOME, tanda tangan)
        run: |
          set -euo pipefail
          APK="launcher/out/asproject-launcher-1.0.0-debug.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$(ls -d "$SDK_ROOT"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)"
          APKSIGNER_JAR="$(ls "$SDK_ROOT"/build-tools/*/lib/apksigner.jar 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$AAPT2" ]; then export AAPT2; fi
          if [ -n "$APKSIGNER_JAR" ]; then export APKSIGNER_JAR; fi
          python3 launcher/tools/verify_apk.py "$APK"

      - name: Siapkan artefak
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp launcher/out/asproject-launcher-1.0.0-debug.apk artifacts/
          ( cd artifacts && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Bangun APK rilis dengan keystore Anda (bila rahasia diisi)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: /tmp/launcher-release.jks
          KEYSTORE_BASE64: ${{ secrets.LAUNCHER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LAUNCHER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LAUNCHER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LAUNCHER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::notice::Rahasia keystore belum diisi — APK rilis dilewati."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          cd launcher && BUILD_TYPE=release bash buildkit/build-apk.sh
          cp out/*-release.apk ../artifacts/
          ( cd ../artifacts && sha256sum ./*.apk > SHA256SUMS.txt )

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: asproject-launcher-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Lampirkan ke GitHub Release (khusus tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "AsProject Launcher ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*.apk artifacts/SHA256SUMS.txt

  # Jalur Android Studio: memastikan proyek Gradle di launcher/ tetap bisa dibuka.
  apk-gradle:
    name: Build APK (Gradle/Android Studio)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Bangun APK debug dengan Gradle
        working-directory: launcher
        run: gradle --no-daemon :app:assembleDebug

      - name: Unggah artefak Gradle
        uses: actions/upload-artifact@v4
        with:
          name: asproject-launcher-apk-gradle
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
