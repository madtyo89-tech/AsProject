<style>
:root{
  --g0:#F0F9FF; --g1:#BAE6FD; --g2:#7DD3FC;
  --accent:#0EA5E9; --ink:#0c4a6e; --gold:#D4AF37;
  --cream:#FAF6F1; --card:#fff;
  --ft:"Cormorant Garamond",serif; --fb:"Inter",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--cream);color:#2b2b2b;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font-family:inherit;cursor:pointer}

/* ---------- LAYER SAMAR (loading / error) ---------- */
.scrim{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--cream)}
.scrim .box{max-width:420px;width:100%;background:var(--card);border:1px solid #eee2d0;border-radius:24px;padding:36px 28px;text-align:center;box-shadow:0 30px 60px rgba(90,70,30,.12)}
.scrim h2{font-family:var(--ft);font-size:26px;font-weight:600;color:var(--ink);margin:14px 0 8px}
.scrim p{font-size:13px;line-height:1.7;color:#6b6157}
.spin{width:44px;height:44px;margin:0 auto;border-radius:50%;border:3px solid #f0e6d6;border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn-gold{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;height:46px;padding:0 26px;border:0;border-radius:99px;background:linear-gradient(135deg,#e8c96a,var(--gold));color:#3a2f0b;font-size:14px;font-weight:600;box-shadow:0 10px 24px rgba(212,175,55,.35)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;border:1px solid #e5d9c4;border-radius:99px;background:transparent;color:#6b6157;font-size:13px;font-weight:500;text-decoration:none}
.logo-badge{width:52px;height:52px;margin:0 auto;border-radius:16px;background:#0a0a0a;display:grid;place-items:center}
.logo-badge img{width:38px;height:38px}

/* ---------- COVER ---------- */
#cover{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 26px;
  background:linear-gradient(165deg,var(--g0),var(--g1) 55%,var(--g2));
  transition:opacity .7s ease,visibility .7s;}
#cover .pat{position:absolute;inset:0;pointer-events:none;opacity:.5}
#cover .veil{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(255,255,255,.25)}
#cover .inner{position:relative;max-width:400px;width:100%}
#cover .bdfr{position:relative;width:100%;max-width:440px;padding:30px 18px}
#cover .bdc{position:absolute;width:22px;height:22px;pointer-events:none;z-index:2;display:block}
#cover .orn{font-size:20px;letter-spacing:14px;color:var(--accent);opacity:.85}
#cover .kicker{margin-top:26px;font-size:11px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--ink);opacity:.85}
#cover .chara{font-size:52px;line-height:1;margin-top:18px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
#cover h1{font-family:var(--ft);font-weight:700;color:var(--ink);font-size:clamp(40px,11vw,58px);line-height:1.04;margin-top:14px}
#cover .amp{font-family:var(--ft);font-style:italic;font-size:24px;color:var(--accent);margin:6px 0}
#cover .date{margin-top:22px;display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border:1px solid rgba(255,255,255,.55);border-radius:99px;background:rgba(255,255,255,.35);backdrop-filter:blur(6px);font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--ink)}
#cover .host{margin-top:14px;font-size:12px;color:var(--ink);opacity:.75;letter-spacing:.06em}
#cover .open{position:relative;margin-top:44px;display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 34px;border:0;border-radius:99px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;letter-spacing:.04em;box-shadow:0 18px 40px rgba(0,0,0,.22);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
#cover .open .env{font-size:18px}
#cover .brand{position:absolute;bottom:22px;left:0;right:0;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink);opacity:.55}
body.opened #cover{opacity:0;visibility:hidden}

/* ---------- CONTENT ---------- */
#content{opacity:0;transition:opacity .8s ease .15s}
body.opened #content{opacity:1}
.wrap{max-width:470px;margin:0 auto;padding:34px 20px 90px;background:
  radial-gradient(rgba(212,175,55,.06) 1.5px,transparent 1.8px);background-size:26px 26px;}
.card{background:var(--card);border:1px solid #f0e6d6;border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 16px 40px rgba(90,70,30,.07);margin-bottom:18px}
.kicker{font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);opacity:.9}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0;color:var(--gold)}
.divider::before,.divider::after{content:"";height:1px;width:56px;background:linear-gradient(90deg,transparent,#e2cf9f)}
.divider::after{background:linear-gradient(90deg,#e2cf9f,transparent)}
h2.sec{font-family:var(--ft);font-size:27px;font-weight:700;color:var(--ink);line-height:1.15}
.muted{font-size:12.5px;line-height:1.75;color:#7a7065}
.name-big{font-family:var(--ft);font-size:34px;font-weight:700;color:var(--ink);line-height:1.12;margin-top:10px}
.role{margin-top:10px;font-size:12px;line-height:1.7;color:#7a7065}
.role b{color:var(--ink);font-weight:600}

/* doa */
.doa-ar{font-size:26px;line-height:2.1;color:var(--ink);direction:rtl;margin-top:16px}
.doa-la{margin-top:10px;font-size:13px;font-style:italic;color:#8a7f72}
.doa-arti{margin-top:10px;font-size:12px;color:#9a8f82}

/* acara */
.acara-grid{display:grid;gap:14px;margin-top:18px;text-align:left}
.acara{border:1px solid #f0e6d6;border-radius:18px;padding:18px 16px;background:linear-gradient(170deg,#fffdf9,#fbf6ee)}
.acara .lbl{font-size:10px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--accent)}
.acara .tgl{font-family:var(--ft);font-size:24px;font-weight:700;color:var(--ink);margin-top:8px}
.acara .jam{margin-top:4px;font-size:13px;font-weight:600;color:#6b6157}
.acara .vt{margin-top:10px;font-size:12.5px;line-height:1.6;color:#7a7065}
.acara .vt b{color:var(--ink)}
.mapbtn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;height:38px;padding:0 16px;border-radius:99px;background:var(--ink);color:#fff;font-size:12px;font-weight:600;text-decoration:none}

/* countdown */
.cdw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.cdw .u{background:linear-gradient(170deg,#fffdf9,#faf3e6);border:1px solid #f0e6d6;border-radius:14px;padding:12px 4px}
.cdw .n{font-family:var(--ft);font-size:26px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.cdw .l{margin-top:2px;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#9a8f82}

/* galeri */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:1px solid #f0e6d6}
.gal img:first-child{grid-column:1/-1;aspect-ratio:4/3}

/* amplop */
.amp-card{margin-top:18px;text-align:left}
.amp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid #f0e6d6;border-radius:14px;margin-top:10px;background:#fffdf9}
.amp-row .nm{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.amp-row .no{margin-top:2px;font-family:ui-monospace,monospace;font-size:14px;font-weight:600;color:var(--ink);word-break:break-all}
.amp-row .ow{font-size:11px;color:#8a7f72;margin-top:1px}
.copy{flex:none;height:34px;padding:0 14px;border:1px solid #e2cf9f;border-radius:99px;background:#fff8e6;color:#8a6d0f;font-size:11px;font-weight:700}

/* tamu */
.guest{margin-top:6px}
.guest .to{font-family:var(--ft);font-size:26px;font-weight:700;color:var(--ink);line-height:1.2;margin-top:8px}
.guest .ya{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#9a8f82;font-weight:700}

/* musik */
#musikBtn{position:fixed;left:14px;bottom:16px;z-index:120;display:none;align-items:center;gap:8px;height:42px;padding:0 16px;border:0;border-radius:99px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:0 10px 26px rgba(90,70,30,.18);color:var(--ink);font-size:11px;font-weight:600;max-width:220px}
#musikBtn .disc{width:18px;height:18px;flex:none;border-radius:50%;background:conic-gradient(var(--gold),#f6e2a5,var(--gold));animation:sp 3s linear infinite;display:grid;place-items:center}
#musikBtn .disc::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
#musikBtn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- ANIMASI ---------- */
@keyframes uUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes uZoom{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes uWord{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes uDeco{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes uPop{0%{opacity:0;transform:scale(.5)}60%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
.cov .anim-up{animation:uUp .8s cubic-bezier(.22,.8,.36,1) both}
.cov .anim-zoom{animation:uZoom .9s cubic-bezier(.22,.8,.36,1) both}
.cov .anim-word{display:inline-block;animation:uWord .7s cubic-bezier(.22,.8,.36,1) both}
.cov .anim-deco{transform-origin:center;animation:uDeco .9s cubic-bezier(.22,.8,.36,1) both}
.cov .anim-pop{animation:uPop .7s cubic-bezier(.22,.8,.36,1) both}
/* 10 efek animasi cover (pilihan state.anim.effect) */
@keyframes uFade{from{opacity:0}to{opacity:1}}
@keyframes uRise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes uDrop{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
@keyframes uBlurIn{from{opacity:0;filter:blur(12px)}to{opacity:1;filter:blur(0)}}
@keyframes uFlip{from{opacity:0;transform:perspective(800px) rotateX(24deg) translateY(20px)}to{opacity:1;transform:none}}
@keyframes uSlideIn{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes uSwing{from{opacity:0;transform:rotate(-7deg) translateY(-16px)}to{opacity:1;transform:none}}
@keyframes uElastic{0%{opacity:0;transform:scale(.4)}55%{opacity:1;transform:scale(1.12)}75%{transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
.cov .fx-c-fade{animation:uFade .9s ease both}
.cov .fx-c-zoom{animation:uZoom .9s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-rise{animation:uRise .8s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-drop{animation:uDrop .8s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-blur{animation:uBlurIn .9s ease both}
.cov .fx-c-pop{animation:uPop .7s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-flip{animation:uFlip .85s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-slide{animation:uSlideIn .8s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-swing{animation:uSwing .8s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-elastic{animation:uElastic .9s cubic-bezier(.22,.8,.36,1) both}
@media (prefers-reduced-motion:reduce){
 .cov .anim-up,.cov .anim-zoom,.cov .anim-word,.cov .anim-deco,.cov .anim-pop{animation:none}
 #cover .open{animation:none}
}

/* footer */
.footer{margin-top:34px;text-align:center}
.footer .orn{font-size:15px;letter-spacing:10px;color:var(--gold)}
.footer p{margin-top:10px;font-size:11px;line-height:1.7;color:#9a8f82}
.footer a{color:var(--accent);font-weight:600;text-decoration:none}
.couple{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:18px}
.couple .heart{font-size:20px;color:var(--gold)}

.couple .c .rl{margin-top:8px;font-size:10.5px;line-height:1.6;color:#8a7f72}
@media (max-width:380px){.couple .c .nm{font-size:18px}}

const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function parseDate(s){if(!s)return null;const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return null;return new Date(+m[1],+m[2]-1,+m[3])}
function fmtDate(s){const d=parseDate(s);if(!d)return String(s||'');return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`}
function fmtDateShort(s){const d=parseDate(s);if(!d)return String(s||'');return `${String(d.getDate()).padStart(2,'0')} . ${String(d.getMonth()+1).padStart(2,'0')} . ${d.getFullYear()}`}
function targetTime(draft,form){const ds=(form&&form.tanggalAcara)||draft.event_date;if(!ds)return null;const t=((form&&form.jamAcara)||draft.event_time||'').slice(0,5);const d=parseDate(ds);if(!d)return null;if(t){const p=t.split(':');d.setHours(+p[0]||0,+p[1]||0,0,0)}return d}

function setupMusic(url,name){
 const a=$('musik');if(!url)return;
 try{a.src=new URL(url,location.href).href}catch(e){a.src=url}
 $('musikNama').textContent=name||'Musik Acara';
 $('musikBtn').style.display='inline-flex';
 let on=false;
 $('musikBtn').addEventListener('click',()=>{
  if(!on){a.play().then(()=>{on=true}).catch(()=>{})}
  else{a.pause();on=false}
 });
 return ()=>{a.play().catch(()=>{})}}

function startCountdown(tt){
 const el=id=>$(id);
 const tick=()=>{
  let ms=tt-Date.now();if(ms<0)ms=0;
  const s=Math.floor(ms/1000);
  const pad=n=>String(n).padStart(2,'0');
  if(el('cdH'))el('cdH').textContent=pad(Math.floor(s/86400));
  if(el('cdM'))el('cdM').textContent=pad(Math.floor(s%86400/3600));
  if(el('cdS'))el('cdS').textContent=pad(Math.floor(s%3600/60));
  if(el('cdD'))el('cdD').textContent=pad(s%60);
 };
 tick();setInterval(tick,1000);
}

else if(DEMO){loading();setTimeout(()=>boot(DEMO_DRAFT),350)}
else if(!SLUG){notFound()}
else{
 loading();
 fetch(SUPABASE_URL+'/rest/v1/invitation_drafts?slug=eq.'+encodeURIComponent(SLUG)+'&select=*',{
  headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}
 }).then(async r=>{
   if(r.status===404)throw{nf:1};
   if(!r.ok)throw{err:r.status};
   const rows=await r.json();
   if(!Array.isArray(rows)||!rows.length)throw{nf:1};
   boot(rows[0]);
 }).catch(e=>{if(e&&e.nf)notFound();else netError()});
}
</script>
