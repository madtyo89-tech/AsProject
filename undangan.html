<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undangan — AsProject</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Undangan Digital Premium">
<meta property="og:description" content="Undangan digital dari AsProject">
<link rel="icon" type="image/svg+xml" href="assets/logo-asproject.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600;700&family=Bebas+Neue&family=Oswald:wght@400;500;600&family=EB+Garamond:wght@500;600&family=Merriweather:wght@400;700&family=Work+Sans:wght@400;500;600&family=Pacifico&family=Dancing+Script:wght@600;700&family=Caveat:wght@600;700&family=Sacramento&family=Cinzel:wght@400;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  --g0:#F0F9FF; --g1:#BAE6FD; --g2:#7DD3FC;
  --accent:#0EA5E9; --ink:#0c4a6e; --gold:#D4AF37;
  --cream:#FAF6F1; --card:#fff;
  /* Turunan kontras tema — dihitung ulang oleh boot() lewat assets/theme-contrast.js.
     Nilai di bawah hanya cadangan supaya tampilan awal tetap terbaca. */
  --ink-body:#2b2b2b; --ink-body-fg:#fff; --ink-fg:#fff;
  --accent-body:#0c4a6e; --accent-cover:#0EA5E9;
  --ft:"Cormorant Garamond",serif; --fb:"Inter",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--cream);color:#2b2b2b;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font-family:inherit;cursor:pointer}

/* ---------- LAYER SAMAR (loading / error) ---------- */
.scrim{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--cream)}
.scrim .box{max-width:420px;width:100%;background:var(--card);border:1px solid #eee2d0;border-radius:24px;padding:36px 28px;text-align:center;box-shadow:0 30px 60px rgba(90,70,30,.12)}
.scrim h2{font-family:var(--ft);font-size:26px;font-weight:600;color:var(--ink-body);margin:14px 0 8px}
.scrim p{font-size:13px;line-height:1.7;color:#6b6157}
.spin{width:44px;height:44px;margin:0 auto;border-radius:50%;border:3px solid #f0e6d6;border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn-gold{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;height:46px;padding:0 26px;border:0;border-radius:99px;background:linear-gradient(135deg,#e8c96a,var(--gold));color:#3a2f0b;font-size:14px;font-weight:600;box-shadow:0 10px 24px rgba(212,175,55,.35)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;border:1px solid #e5d9c4;border-radius:99px;background:transparent;color:#6b6157;font-size:13px;font-weight:500;text-decoration:none}
.logo-badge{width:52px;height:52px;margin:0 auto;border-radius:16px;background:#0a0a0a;display:grid;place-items:center}
.logo-badge img{width:38px;height:38px}

/* ---------- COVER ---------- */
#cover{position:fixed;inset:0;height:100vh;height:100dvh;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 26px;
  background:linear-gradient(165deg,var(--g0),var(--g1) 55%,var(--g2));
  transition:opacity .7s ease,visibility .7s;}
#cover .pat{position:absolute;inset:0;pointer-events:none;opacity:.5}
#cover .veil{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(255,255,255,.25)}
#cover .inner{position:relative;max-width:400px;width:100%;margin-left:auto;margin-right:auto}
#cover .bdfr{position:relative;width:100%;max-width:440px;padding:30px 18px}
#cover .bdc{position:absolute;width:22px;height:22px;pointer-events:none;z-index:2;display:block}
#cover .orn{font-size:20px;letter-spacing:14px;color:var(--accent-cover);opacity:.85}
#cover .kicker{margin-top:26px;font-size:11px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--ink);opacity:.85}
#cover .chara{font-size:52px;line-height:1;margin-top:18px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
#cover h1{font-family:var(--ft);font-weight:700;color:var(--ink);font-size:clamp(33px,8.8vw,48px);line-height:1.04;margin-top:14px}
#cover .amp{font-family:var(--ft);font-style:italic;font-size:24px;color:var(--accent-cover);margin:6px 0}
#cover .date{margin-top:22px;display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border:1px solid rgba(255,255,255,.55);border-radius:99px;background:rgba(255,255,255,.35);backdrop-filter:blur(6px);font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--ink)}
#cover .host{margin-top:14px;font-size:12px;color:var(--ink);opacity:.75;letter-spacing:.06em}
#cover .open{position:relative;margin-top:44px;display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 34px;border:0;border-radius:99px;background:var(--ink);color:var(--ink-fg);font-size:14px;font-weight:600;letter-spacing:.04em;box-shadow:0 18px 40px rgba(0,0,0,.22);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
#cover .open .env{font-size:18px}
#cover .brand{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink);opacity:.55}
/* Label nama template (kicker hijau, kata besar seperti "ISLAMI", deretan bintang/ornamen teks)
   tidak ditampilkan di cover. Nama & detail acara tetap tampil seperti biasa. */
#cover .inner>.kicker,#cover .inner>.chara,#cover .inner>.orn{display:none!important}
/* ---------- TEMA 3D (artwork realistis) ----------
   Tema ulang tahun ber-artwork memakai gambar 3D sebagai latar cover. Teks cover
   tetap terbaca karena diberi lapisan gelap tipis; warna teks diatur di boot(). */
body.art3d #cover{background:linear-gradient(180deg,rgba(12,10,8,.55),rgba(12,10,8,.24) 30%,rgba(12,10,8,.34) 62%,rgba(12,10,8,.72)),var(--cover-art,none) center/cover no-repeat}
body.art3d #cover .pat,body.art3d #cover .veil{display:none}
body.art3d #cover .date{background:rgba(18,14,10,.45);border-color:rgba(255,255,255,.35)}
/* ---------- FOTO COVER (9 gaya, posisi & zoom diatur pemilik di Studio) ----------
   Berlaku semua jenis acara (pernikahan, khitanan, aqiqah, ulang tahun).
   Gaya dari data.coverStyle, posisi/zoom dari data.coverPos (object-position). */
#cover{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#cover .bdfr{margin-top:auto;margin-bottom:auto}
#cover .cvf{box-sizing:border-box;position:relative;overflow:hidden;margin:18px auto 0;width:min(46vw,170px);aspect-ratio:3/4;box-shadow:0 20px 44px rgba(0,0,0,.42)}
#cover .cvf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#cover .cvf-kotak{border-radius:18px;padding:7px;background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,255,255,.45));border:1px solid rgba(255,255,255,.6)}
#cover .cvf-kotak img{border-radius:12px}
#cover .cvf-oval{border-radius:50%;padding:6px;background:linear-gradient(160deg,#FBF0D2,#C9A548)}
#cover .cvf-oval img{border-radius:50%}
#cover .cvf-lingkaran{aspect-ratio:1/1;width:min(40vw,148px);border-radius:50%;padding:6px;background:linear-gradient(160deg,#FBF0D2,#B9903A)}
#cover .cvf-lingkaran img{border-radius:50%}
#cover .cvf-arch{border-radius:999px 999px 20px 20px;padding:7px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.5))}
#cover .cvf-arch img{border-radius:999px 999px 14px 14px}
#cover .cvf-polaroid{background:#fffdf9;padding:8px 8px 30px;border-radius:6px;transform:rotate(-2deg);box-shadow:0 22px 44px rgba(0,0,0,.45)}
#cover .cvf-polaroid img{border-radius:3px}
#cover .cvf-emas{padding:9px;border-radius:14px;background:#fffdf9;box-shadow:0 0 0 2px #C9A548,0 0 0 5px rgba(255,255,255,.4),0 20px 44px rgba(0,0,0,.45)}
#cover .cvf-emas img{border-radius:9px}
#cover .cvf-kapsul{aspect-ratio:9/16;width:min(32vw,116px);border-radius:999px;padding:6px;background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,255,255,.45))}
#cover .cvf-kapsul img{border-radius:999px}
@media (max-height:700px){#cover .cvf{width:min(38vw,132px)}#cover .cvf-lingkaran{width:min(32vw,112px)}#cover .cvf-kapsul{width:min(26vw,92px)}}

/* Gaya "Foto Penuh": foto jadi latar seluruh cover + lapisan gelap, teks masuk
   panel kaca gelap supaya tetap terbaca (dijaga >=4.5:1 walau fotonya putih). */
body.foto-full #cover{background:#0b0908;justify-content:flex-end;padding:0}
body.foto-full #cover .pat,body.foto-full #cover .veil{display:none}
body.foto-full #cover .cvlatar{position:absolute;inset:0;overflow:hidden}
body.foto-full #cover .cvlatar img{width:100%;height:100%;object-fit:cover;display:block}
body.foto-full #cover::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,6,5,.55) 0%,rgba(8,6,5,.1) 28%,rgba(8,6,5,.34) 52%,rgba(8,6,5,.86) 76%,rgba(8,6,5,.97) 100%)}
/* Mode foto penuh: TANPA panel — foto tampil utuh dari tepi ke tepi, teks
   langsung di atas foto. Gradient bawah yang pekat + text-shadow menjaga
   keterbacaan teks putih (>=4.5:1) walau fotonya terang. */
body.foto-full #cover .bdfr{position:relative;z-index:2;margin:0 auto 28px;width:calc(100% - 28px);padding:0;background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
body.foto-full #cover .inner{padding:0 4px}
body.foto-full #cover .inner h1,body.foto-full #cover .inner .amp,body.foto-full #cover .inner .date,body.foto-full #cover .inner .orn,body.foto-full #cover .inner .wedding-subtitle,body.foto-full #cover .inner .wedding-meta,body.foto-full #cover .inner .wedding-note,body.foto-full #cover .inner .host{color:#fff}
body.foto-full #cover .inner .kicker,body.foto-full #cover .inner .wedding-meta .wi-icon{color:var(--accent-cover,#EAD7A8)}
body.foto-full #cover .inner h1,body.foto-full #cover .inner .amp{text-shadow:0 3px 24px rgba(0,0,0,.68),0 1px 5px rgba(0,0,0,.5)}
body.foto-full #cover .inner .wedding-subtitle,body.foto-full #cover .inner .wedding-meta,body.foto-full #cover .inner .wedding-note,body.foto-full #cover .inner .host,body.foto-full #cover .inner .date,body.foto-full #cover .inner .orn,body.foto-full #cover .inner .kicker{text-shadow:0 1px 12px rgba(0,0,0,.62)}
body.foto-full #cover .date{background:rgba(18,14,10,.52);border-color:rgba(255,255,255,.32)}
/* Cover full = gerbang foto: cukup nama + tanggal + tombol. Rincian
   (judul acara, waktu, venue, paragraf sambutan) tetap ada di dalam
   undangan — di cover disederhanakan supaya fotonya tampil leluasa. */
body.foto-full #cover .wedding-subtitle,body.foto-full #cover .wedding-meta,body.foto-full #cover .host,body.foto-full #cover .wedding-note,body.foto-full #cover .wedding-hint,body.foto-full #cover .brand{display:none!important}
body.foto-full #cover .inner h1{margin-top:10px}
body.foto-full #cover .date{margin-top:16px}
body.foto-full #cover .open{margin-top:22px}
/* Blok teks + amplop duduk lebih rendah (bawah-tengah), foto bagian atas lebih leluasa */
body.wedding-cover.foto-full #cover,body.foto-full #cover{justify-content:flex-end;padding:0 0 8px}
body.wedding-cover.foto-full #cover .bdfr,body.foto-full #cover .bdfr{margin:0 auto clamp(36px,10vh,88px)}
.couple-foto{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 18px}
.couple-foto.tunggal{margin-bottom:14px}
.couple-foto .cf{width:min(112px,30vw);aspect-ratio:3/4;overflow:hidden;border-radius:999px 999px 16px 16px;
  border:2px solid var(--accent);box-shadow:0 12px 26px rgba(60,40,15,.16);background:#f3ead9}
.couple-foto .cf img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.couple-foto .cf-amp{font-family:var(--ft);font-size:24px;color:var(--accent);flex:none;transform:translateY(8px)}
@media (max-width:380px){.couple-foto .cf{width:min(96px,28vw)}.couple-foto{gap:12px}}
body.foto-full #cover .brand{opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.65)}
body.foto-full #cover .bdfr .bd-c,body.foto-full #cover .bdfr .orn-c{opacity:.92}
/* Blur halus di keempat sudut foto penuh — sudut tampak lembut/dreamy,
   bagian tengah tetap tajam. Mask radial memudarkan blur ke arah tengah. */
body.foto-full #cover .cvlatar .cvbl{position:absolute;width:62%;height:52%;pointer-events:none;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
body.foto-full #cover .cvlatar .cvbl.tl{top:0;left:0;
  -webkit-mask-image:radial-gradient(115% 115% at 0% 0%,#000 34%,transparent 72%);mask-image:radial-gradient(115% 115% at 0% 0%,#000 34%,transparent 72%)}
body.foto-full #cover .cvlatar .cvbl.tr{top:0;right:0;
  -webkit-mask-image:radial-gradient(115% 115% at 100% 0%,#000 34%,transparent 72%);mask-image:radial-gradient(115% 115% at 100% 0%,#000 34%,transparent 72%)}
body.foto-full #cover .cvlatar .cvbl.bl{bottom:0;left:0;
  -webkit-mask-image:radial-gradient(115% 115% at 0% 100%,#000 34%,transparent 72%);mask-image:radial-gradient(115% 115% at 0% 100%,#000 34%,transparent 72%)}
body.foto-full #cover .cvlatar .cvbl.br{bottom:0;right:0;
  -webkit-mask-image:radial-gradient(115% 115% at 100% 100%,#000 34%,transparent 72%);mask-image:radial-gradient(115% 115% at 100% 100%,#000 34%,transparent 72%)}
@media (prefers-reduced-motion:reduce){body.foto-full #cover .cvlatar .cvbl{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}}

/* ---------- SKIN PERNIKAHAN: editorial paper card seperti stationery premium ---------- */
body.wedding-cover #cover{
 --ink:var(--ink-body,#344238);--accent-cover:var(--accent);
 justify-content:center;padding:22px 18px 48px;
 background:linear-gradient(160deg,var(--g0),var(--g1) 58%,var(--g2));
}
body.wedding-cover.art3d #cover{background:linear-gradient(180deg,rgba(12,10,8,.34),rgba(12,10,8,.2) 42%,rgba(12,10,8,.48)),var(--cover-art,none) center/cover no-repeat}
body.wedding-cover #cover .pat{opacity:.28}
body.wedding-cover #cover .veil{box-shadow:inset 0 0 100px rgba(255,255,255,.18)}
body.wedding-cover #cover .wedding-invite-card{
 width:min(100%,430px);max-width:430px;margin:auto;padding:24px 20px 22px;
 border:1px solid rgba(255,255,255,.72);border-radius:24px;
 background:rgba(255,253,247,.94);box-shadow:0 22px 58px rgba(20,25,20,.2);
 -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)
}
body.wedding-cover #cover .inner{max-width:360px}
body.wedding-cover #cover .chara{display:none}
body.wedding-cover #cover .orn{font-size:13px;letter-spacing:8px;margin-bottom:5px;color:var(--accent);opacity:.85}
body.wedding-cover #cover .kicker{margin-top:0;font-family:'Sacramento','Dancing Script',var(--ft),cursive;font-size:clamp(25px,7vw,34px);font-weight:400;letter-spacing:.02em;text-transform:none;color:var(--accent);opacity:1}
body.wedding-cover #cover h1{margin-top:7px;font-size:clamp(27px,7.6vw,39px);line-height:1.02;letter-spacing:-.025em;color:var(--ink-body,#344238)}
body.wedding-cover #cover .amp{font-size:20px;margin:3px 0;color:var(--accent)}
body.wedding-cover #cover .wedding-subtitle{margin:6px 0 -3px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-body,#344238);opacity:.72}
body.wedding-cover #cover .cvf{width:min(35vw,122px);margin:8px auto 11px;box-shadow:0 8px 22px rgba(26,38,30,.18)}
body.wedding-cover #cover .kicker+.chara{display:none}
body.wedding-cover #cover .date{margin-top:16px;padding:9px 16px;border-radius:12px;background:rgba(255,255,255,.78);border-color:rgba(60,80,65,.18);color:var(--ink-body,#344238);font-size:12px}
body.wedding-cover #cover .wedding-meta{display:flex;align-items:center;justify-content:center;gap:9px;margin:11px auto 0;font-size:13px;font-weight:600;color:var(--ink-body,#344238)}
body.wedding-cover #cover .wedding-meta .wi-icon{font-size:18px;color:var(--accent);line-height:1}
body.wedding-cover #cover .host{display:flex;align-items:flex-start;justify-content:center;gap:8px;max-width:340px;margin:10px auto 0;font-size:12px;line-height:1.55;color:var(--ink-body,#344238);opacity:.9;letter-spacing:0}
body.wedding-cover #cover .host .wi-icon{flex:none;color:var(--accent);font-size:16px;line-height:1.2}
body.wedding-cover #cover .wedding-note{max-width:310px;margin:13px auto 0;padding-top:11px;border-top:1px solid rgba(80,90,75,.2);font-family:var(--fb);font-size:11.5px;line-height:1.65;color:#555d54}
body.wedding-cover #cover .open{height:48px;min-width:min(250px,85%);justify-content:center;margin-top:16px;padding:0 25px;border-radius:99px;background:var(--ink-body,#344238);color:var(--ink-body-fg,#fff);box-shadow:0 9px 22px rgba(30,45,35,.2);font-size:13px}
body.wedding-cover #cover .wedding-hint{margin-top:8px;font-size:10px;letter-spacing:.08em;color:var(--accent);opacity:.8}
body.wedding-cover #cover .brand{color:#fff;opacity:.8;bottom:16px}
/* Luxury Gold: black-marble glass, double foil frame, ivory typography, and a metallic CTA. */
/* PREMIUM — Champagne Royale: kartu satin ivory, bingkai ganda foil emas, tombol emas */
/* PREMIUM — Violet Imperial: kartu beludru ungu transparan + emas majestik */
/* EKSKLUSIF universal — kartu kaca gelap (Aurora Celestial, Emerald Royale, Onyx Platinum) */
/* EKSKLUSIF universal — kartu mutiara terang (Ivory Pearl, Rose Gold Blush) */
/* PREMIUM batch baru — skin kartu pernikahan (5 tema) */
/* ---------- VIP 4D: lapisan parallax, partikel, entrance sinematik ---------- */
body.vip4d #cover{background:linear-gradient(160deg,var(--g0),var(--g1) 58%,var(--g2))!important}
.vip-bg{position:absolute;inset:-6%;z-index:0;background:center/cover no-repeat;will-change:transform}
.vip-mid{position:absolute;inset:0;z-index:1;display:grid;place-items:center;font-size:60px;letter-spacing:16px;opacity:.26;pointer-events:none;text-shadow:0 0 30px rgba(0,0,0,.45);will-change:transform}
.vip-fg{position:absolute;inset:0;z-index:2;pointer-events:none;will-change:transform}
body.vip4d #cover>.bdfr,body.vip4d #cover>.pat,body.vip4d #cover>.veil,body.vip4d #cover>.brand{position:relative;z-index:3}
#cover.vip-scene-curtain::before,#cover.vip-scene-curtain::after{content:'';position:absolute;top:0;bottom:0;width:51%;z-index:6;pointer-events:none;background:linear-gradient(180deg,#0b0906,#221a10 60%,#0b0906)}
#cover.vip-scene-curtain::before{left:0;animation:vipCurtL 1.15s cubic-bezier(.5,0,.3,1) .2s both}
#cover.vip-scene-curtain::after{right:0;animation:vipCurtR 1.15s cubic-bezier(.5,0,.3,1) .2s both}
@keyframes vipCurtL{from{transform:none}to{transform:translateX(-103%)}}
@keyframes vipCurtR{from{transform:none}to{transform:translateX(103%)}}
#cover.vip-scene-zoom>.bdfr{animation:vipZoom 1.15s cubic-bezier(.22,.8,.36,1) both}
@keyframes vipZoom{0%{opacity:0;transform:scale(1.22)}100%{opacity:1;transform:scale(1)}}
#cover.vip-scene-rise>.bdfr{animation:vipRise 1.05s cubic-bezier(.22,.8,.36,1) both}
@keyframes vipRise{0%{opacity:0;transform:translateY(46px)}100%{opacity:1;transform:none}}
.vip-btn{position:absolute;z-index:7;right:12px;bottom:12px;border:1px solid rgba(255,255,255,.4);background:rgba(10,8,6,.55);color:#ffe9b8;font-size:11px;font-weight:600;border-radius:99px;padding:8px 14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* VIP skin: kartu kaca gelap + aksen per tema */
/* fx cover terpilih khusus VIP (dikunci tier VIP di Studio) */
.cov .fx-c-vip-zoom{animation:uVipZoom 1.4s cubic-bezier(.22,.8,.36,1) both}
@keyframes uVipZoom{0%{opacity:0;transform:scale(1.28);filter:blur(6px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
.cov .fx-c-vip-curtain{animation:uVipCurt 1.2s cubic-bezier(.5,0,.3,1) both}
@keyframes uVipCurt{0%{clip-path:inset(0 50% 0 50%);opacity:.4}100%{clip-path:inset(0 0 0 0);opacity:1}}

/* Peta: pratinjau yang digambar sendiri (ubin OpenStreetMap/CARTO) + lapisan
   Google "Peta interaktif" yang HANYA dipasang kalau tamu menekannya.
   Kenapa: embed Google (output=embed) di sebagian ponsel tamu berhenti di
   bidang biru dengan kotak galat milik Google sendiri — isinya lintas-asal,
   jadi dari sisi kita tidak bisa diperiksa atau dipulihkan. Ubin peta biasa
   adalah gambar: kalau satu CDN diblokir jaringan tamu, ubin itu dicoba ke
   CDN berikutnya (lihat PETA_SUMBER), bukan ditinggal biru. */
.mapwrap{position:relative;height:210px;background:#e9eff2;overflow:hidden}
.mapwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;z-index:2}
.mapwrap:not(.live) iframe{display:none}
.mapstat{position:absolute;inset:0;overflow:hidden;background:linear-gradient(170deg,#f7f9fa,#e9eff1)}
.mapstat .ubin{position:absolute;left:0;top:0;transform-origin:0 0}
.mapstat .ubin img{position:absolute;width:256px;height:256px;max-width:none;display:block;background:#eef2f4}
.mapstat .bayang{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 50%,rgba(0,0,0,0) 42%,rgba(0,0,0,.16) 100%),linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.06))}
.mapstat .pin2{position:absolute;left:50%;top:50%;width:28px;height:38px;margin:-38px 0 0 -14px;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.mapstat .pin2 svg{display:block;animation:mapPin 2.6s ease-in-out infinite}
.mapattr{position:absolute;right:6px;bottom:4px;z-index:1;display:none;font-size:9px;line-height:1.5;color:#3f3a33;background:rgba(255,255,255,.82);padding:2px 6px;border-radius:6px;text-decoration:none}
.mapwrap.map-tampil:not(.peta-gagal) .mapattr{display:block}
.mapph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;color:#7a7065;font-size:12px;background:linear-gradient(170deg,#f6f8f9,#e7edef);transition:opacity .35s ease}
.mapph .pin{font-size:26px;line-height:1;animation:mapPin 1.2s ease-in-out infinite}
.mapwrap.map-tampil .mapph{opacity:0;pointer-events:none}
.mapfallback{position:absolute;inset:0;z-index:3;display:none}
.mapwrap.peta-gagal .mapfallback{display:block}
.mapwrap.live .mapfallback{display:none}
.mapwrap.peta-gagal .mapph{opacity:1;pointer-events:auto}
.mapwrap.peta-gagal .mapph .pin{animation:none}
@keyframes mapPin{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.mapph .pin{animation:none}.mapstat .pin2 svg{animation:none}}

/* Kartu tamu: QR check-in ditampilkan DI DALAM undangan (lihat qrPanelHtml).

.qrcard{margin-top:16px;padding:14px 12px 12px;border:1px dashed #e5d9c4;border-radius:16px;background:linear-gradient(170deg,#fffdf9,#fbf6ee);text-align:center}

.qrsvg svg{display:block;width:100%;height:100%}
.qrload{display:flex;align-items:center;justify-content:center;height:100%;padding:0 6px;font-size:10.5px;line-height:1.5;color:#b3a894}

.qrscan-nm{margin-top:4px;font-size:20px;font-weight:700;color:#111;word-break:break-word}

.qrbadge{margin-top:10px;display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:5px 12px;border-radius:99px;background:#eaf7ee;border:1px solid #cfe9d8;color:#256b3e;font-size:11.5px;font-weight:600}

/* countdown */
.cdw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}

/* tamu */

/* musik */
#musikBtn{position:fixed;left:14px;bottom:16px;z-index:120;display:none;align-items:center;gap:8px;height:42px;padding:0 16px;border:0;border-radius:99px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:0 10px 26px rgba(90,70,30,.18);color:var(--ink-body);font-size:11px;font-weight:600;max-width:220px}

body.embed-buka #coverBack{display:none}

/* ---------- ANIMASI ---------- */
@keyframes uUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes uZoom{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes uWord{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes uDeco{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes uPop{0%{opacity:0;transform:scale(.5)}60%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
.cov .anim-up{animation:uUp .8s cubic-bezier(.22,.8,.36,1) both}
.cov .anim-zoom{animation:uZoom .9s cubic-bezier(.22,.8,.36,1) both}
.cov .anim-word{display:inline-block;animation:uWord .7s cubic-bezier(.22,.8,.36,1) both}
.cov .anim-deco{transform-origin:center;animation:uDeco .9s cubic-bezier(.22,.8,.36,1) both}
.cov .anim-pop{animation:uPop .7s cubic-bezier(.22,.8,.36,1) both}
/* 10 efek animasi cover (pilihan state.anim.effect) */
@keyframes uFade{from{opacity:0}to{opacity:1}}
@keyframes uRise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes uDrop{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
@keyframes uBlurIn{from{opacity:0;filter:blur(12px)}to{opacity:1;filter:blur(0)}}
@keyframes uFlip{from{opacity:0;transform:perspective(800px) rotateX(24deg) translateY(20px)}to{opacity:1;transform:none}}
@keyframes uSlideIn{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes uSwing{from{opacity:0;transform:rotate(-7deg) translateY(-16px)}to{opacity:1;transform:none}}
@keyframes uElastic{0%{opacity:0;transform:scale(.4)}55%{opacity:1;transform:scale(1.12)}75%{transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
@keyframes uShimmer{0%{opacity:0;filter:brightness(1.9) saturate(1.3)}60%{opacity:1;filter:brightness(1.15)}100%{opacity:1;filter:none}}
@keyframes uCurtain{0%{opacity:0;transform:scaleX(.55)}100%{opacity:1;transform:none}}
.cov .fx-c-fade{animation:uFade .9s ease both}
.cov .fx-c-zoom{animation:uZoom .9s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-rise{animation:uRise .8s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-drop{animation:uDrop .8s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-blur{animation:uBlurIn .9s ease both}
.cov .fx-c-pop{animation:uPop .7s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-flip{animation:uFlip .85s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-slide{animation:uSlideIn .8s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-swing{animation:uSwing .8s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-elastic{animation:uElastic .9s cubic-bezier(.22,.8,.36,1) both}
.cov .fx-c-shimmer{animation:uShimmer 1s ease both}
.cov .fx-c-curtain{animation:uCurtain .9s cubic-bezier(.22,.8,.36,1) both;transform-origin:50% 0}
@media (prefers-reduced-motion:reduce){
 .cov .anim-up,.cov .anim-zoom,.cov .anim-word,.cov .anim-deco,.cov .anim-pop{animation:none}
 #cover .open{animation:none}
}

/* ---------- mode navigasi slide (diatur di Studio: anim.navMode) ---------- */
body.navpager #content{position:fixed;inset:0;z-index:1}

body.navpager .pslide-multi.pact{gap:16px}
body.navpager .pslide.nv-anim{animation-duration:.55s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,.8,.36,1)}
body.nv-slide .pslide.nv-anim{animation-name:nvSlide}
body.nv-fade .pslide.nv-anim{animation-name:nvFade}
body.nv-flip .pslide.nv-anim{animation-name:nvFlip}
body.nv-zoom .pslide.nv-anim{animation-name:nvZoom}
body.nv-up .pslide.nv-anim{animation-name:nvUp}
body.nv-cube .pslide.nv-anim{animation-name:nvCube}
body.nv-blur .pslide.nv-anim{animation-name:nvBlur}
@keyframes nvSlide{from{opacity:0;transform:translateX(calc(var(--nvdir,1)*60px))}to{opacity:1;transform:none}}
@keyframes nvFade{from{opacity:0}to{opacity:1}}
@keyframes nvFlip{from{opacity:0;transform:perspective(1400px) rotateY(calc(var(--nvdir,1)*-80deg))}to{opacity:1;transform:none}}
@keyframes nvZoom{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes nvUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes nvCube{from{opacity:0;transform:perspective(1400px) rotateX(calc(var(--nvdir,1)*-70deg))}to{opacity:1;transform:none}}
@keyframes nvBlur{from{opacity:0;filter:blur(12px)}to{opacity:1;filter:none}}
.nv-bar{position:fixed;left:0;right:0;bottom:14px;z-index:60;display:flex;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.nv-bar button,.nv-bar .nv-dots{pointer-events:auto}
body:not(.opened) .nv-bar{display:none}
.nv-btn{width:44px;height:44px;border-radius:99px;border:1px solid rgba(255,255,255,.5);background:rgba(20,20,20,.45);color:#fff;font-size:24px;line-height:1;cursor:pointer;backdrop-filter:blur(6px)}
.nv-btn:disabled{opacity:.3;cursor:default}
.nv-dots{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:rgba(20,20,20,.35)}
.nv-dots i{display:block;width:6px;height:6px;border-radius:99px;background:#fff;opacity:.4;transition:.2s;cursor:pointer}
.nv-dots i.on{width:18px;opacity:1}

/* ===== Rombakan dinamis: kinetic · galeri · countdown · ambient · interaksi ===== */
.kn-w{display:inline-block;white-space:nowrap}
.kn-l{display:inline-block;opacity:0;animation:knIn .62s cubic-bezier(.22,.8,.36,1) both}
@keyframes knIn{from{opacity:0;transform:translateY(.42em) rotate(1.6deg)}to{opacity:1;transform:none}}
.kn-l::after{content:"";position:absolute;inset:-2px -5px;pointer-events:none;mix-blend-mode:overlay;
  background:linear-gradient(115deg,transparent 42%,rgba(255,228,160,.85) 50%,transparent 58%);
  transform:translateX(-130%);animation:knShine 1.05s ease-in-out both;animation-delay:var(--sh,0ms)}
@keyframes knShine{0%{opacity:0}18%{opacity:1}100%{transform:translateX(130%);opacity:0}}

.cdw-head{grid-column:1/-1;text-align:center;font:600 10px 'Inter',system-ui,sans-serif;letter-spacing:.22em;
  text-transform:uppercase;color:var(--accent-body);margin-top:6px}
.cdw .n.tick{animation:cdPulse 1s ease-in-out infinite}
@keyframes cdPulse{0%,100%{transform:scale(1)}16%{transform:scale(1.13)}42%{transform:scale(1)}}
.cdw.past .n{color:var(--accent-body)}

.cvcue{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;
  align-items:center;gap:3px;font:600 8.5px 'Inter',system-ui,sans-serif;letter-spacing:.26em;
  text-transform:uppercase;color:var(--ink);opacity:.62;animation:cvcueBob 2.3s ease-in-out infinite;pointer-events:none}
.cvcue i{width:14px;height:14px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;
  transform:rotate(45deg);animation:cvcueArr 1.7s ease-in-out infinite}
@keyframes cvcueBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,6px)}}
@keyframes cvcueArr{0%,100%{opacity:.35}50%{opacity:1}}

/* Galeri tampil sebagai grid rapi (bukan geser) supaya halaman tidak terlihat kosong. */
.gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.gal-cell{position:relative;border:0;padding:0;background:none;cursor:zoom-in;border-radius:14px;overflow:hidden}
.gal-cell img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;border:1px solid #f0e6d6}
.gal-cell.besar{grid-column:1/-1}
.gal-cell.besar img{aspect-ratio:4/3}
.gal-more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(24,18,10,.5);color:#fff;font-size:15px;font-weight:700;letter-spacing:.04em;border-radius:14px}
/* Slide mode: beberapa bagian pendek digabung per slide agar tidak ada ruang kosong besar. */
.pslide-multi{display:flex;flex-direction:column;gap:16px}
.pslide-multi>*{margin-top:0!important}
.gal-hint{margin-top:2px;font:500 9px 'Inter',system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;
  color:color-mix(in srgb,var(--ink-body) 55%,#fff);text-align:center}

.gal-lb{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;
  background:rgba(12,10,8,.88);opacity:0;pointer-events:none;transition:opacity .3s ease}
.gal-lb.on{opacity:1;pointer-events:auto}
.gal-lb img{max-width:92vw;max-height:80vh;border-radius:14px;box-shadow:0 40px 90px rgba(0,0,0,.6);
  transform:scale(.94);transition:transform .3s cubic-bezier(.22,.9,.34,1)}
.gal-lb.on img{transform:none}
.gl-btn{position:absolute;width:46px;height:46px;border-radius:99px;border:1px solid rgba(255,255,255,.35);
  background:rgba(20,16,12,.55);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.gl-prev{left:12px;top:50%;transform:translateY(-50%)}
.gl-next{right:12px;top:50%;transform:translateY(-50%)}
.gl-x{top:14px;right:14px;font-size:15px}
.gl-idx{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font:600 10px 'Inter',system-ui,sans-serif;
  letter-spacing:.24em;color:rgba(255,255,255,.75)}

.mini-acts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.mini-acts a,.mini-acts button{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;
  border-radius:99px;border:1px solid color-mix(in srgb,var(--accent-body) 35%,#fff);
  background:color-mix(in srgb,var(--g1) 20%,#fff);color:var(--accent-body);font:700 11.5px 'Inter',system-ui,sans-serif;
  letter-spacing:.03em;cursor:pointer;text-decoration:none;transition:transform .25s ease,filter .25s ease}
.mini-acts a:hover,.mini-acts button:hover{transform:translateY(-2px);filter:brightness(1.04)}

.copy{transition:transform .3s cubic-bezier(.22,.9,.34,1),background .3s ease,color .3s ease}
.copy.ok{transform:scale(1.08);background:color-mix(in srgb,var(--accent-body) 82%,#2f7a4f);color:#fff}
[data-rsvpb]{transition:transform .3s ease}
[data-rsvpb].sent{animation:rsvpPop .55s cubic-bezier(.22,.9,.34,1)}
@keyframes rsvpPop{0%{transform:scale(1)}45%{transform:scale(1.13)}100%{transform:scale(1)}}

.viz{display:inline-flex;align-items:flex-end;gap:2.5px;height:14px;margin-left:8px;opacity:.25;transition:opacity .3s ease}
.viz.on{opacity:1}
.viz i{width:2.5px;border-radius:2px;background:var(--accent-body);height:3px;transition:height .12s linear}

#aspAmbient{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40;opacity:.58}
body:not(.opened) #aspAmbient{opacity:.42}
@media (prefers-reduced-motion:reduce){
  #aspAmbient{display:none}
  .kn-l,.kn-l::after{animation:none;opacity:1}
  .cvcue,.cdw .n.tick{animation:none}
  .livebtn i{animation:none}
}

/* ==== Salam pembuka/penutup ==== */
.salam{margin-top:18px;text-align:center;font-family:'Cormorant Garamond',Georgia,serif;
  font-style:italic;font-size:17px;letter-spacing:.05em;color:var(--accent-body)}
.salam-tutup{margin:4px 0 2px;font-family:'Cormorant Garamond',Georgia,serif;
  font-style:italic;font-size:16px;letter-spacing:.05em;color:var(--ink-body)}

/* ==== Cerita berfoto (timeline kisah) ==== */
.st-list{margin-top:18px;display:flex;flex-direction:column;gap:22px}
.st-item{display:flex;gap:14px}
.st-rail{display:flex;flex-direction:column;align-items:center;flex:none}
.st-dot{width:11px;height:11px;border-radius:99px;background:var(--accent-body);margin-top:6px;
  box-shadow:0 0 0 4px rgba(255,255,255,.75)}
.st-line{flex:1;width:2px;background:var(--accent-body);opacity:.3;margin:5px 0}
.st-body{flex:1;min-width:0}
.st-tgl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--accent-body)}
.st-judul{margin-top:3px;font-size:15px;font-weight:700;color:var(--ink-body)}
.st-teks{margin-top:6px;font-size:13px;line-height:1.8;color:#57503f}
.st-foto{margin-top:10px;position:relative;border-radius:16px;overflow:hidden;
  border:1px solid rgba(0,0,0,.08);box-shadow:0 16px 32px -18px rgba(0,0,0,.35)}
.st-foto img{display:block;width:100%;height:190px;object-fit:cover}
.st-foto::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  box-shadow:inset 0 0 0 5px rgba(255,255,255,.4),inset 0 0 0 6px rgba(0,0,0,.06)}
.st-foto .st-cap{position:absolute;left:0;right:0;bottom:0;padding:20px 12px 9px;
  background:linear-gradient(180deg,transparent,rgba(22,15,8,.6));color:#fff;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}

/* ==== Tombol Join Live ==== */
.livebtn{display:inline-flex;align-items:center;gap:7px;margin:10px 8px 0 0;padding:9px 16px;
  border-radius:99px;background:var(--accent-body);color:var(--ink-body-fg,#fff);
  font-size:11.5px;font-weight:700;letter-spacing:.03em;text-decoration:none}
.livebtn i{width:8px;height:8px;border-radius:99px;background:#ff3b3b;flex:none;
  animation:livePulse 1.6s ease-out infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(255,59,59,.55)}70%{box-shadow:0 0 0 8px rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}

/* ==== Buku tamu publik ==== */
.bt-list{margin-top:14px;display:flex;flex-direction:column;gap:10px;text-align:left}
.bt-item{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.06)}
.bt-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bt-nm{font-size:12.5px;font-weight:700;color:var(--ink-body)}
.bt-st{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:99px;font-weight:700}
.bt-st.hadir{background:#e6f4ea;color:#2e7d4f}
.bt-st.ragu{background:#fdf3d7;color:#9a6b00}
.bt-st.tidak{background:#f4e9e9;color:#9b4545}
.bt-wk{margin-left:auto;font-size:9.5px;color:#a19684}
.bt-msg{margin-top:6px;font-size:12.5px;line-height:1.7;color:#57503f;font-style:italic;font-family:Georgia,serif}
.bt-memuat{font-size:11.5px;color:#a19684;text-align:center;padding:10px 0}

/* ==== Ornamen sudut (ranting emas) ==== */
.orn-c{position:absolute;width:74px;height:74px;color:var(--accent-cover);opacity:.5;pointer-events:none;z-index:2}
.orn-c svg{width:100%;height:100%;display:block}
.orn-c.tl{top:10px;left:10px}
.orn-c.tr{top:10px;right:10px;transform:scaleX(-1)}
.orn-c.bl{bottom:10px;left:10px;transform:scaleY(-1)}
.orn-c.br{bottom:10px;right:10px;transform:scale(-1,-1)}
#cover .bdfr,.card.guest{position:relative}
/* Bunga 3D/4D: tiga lapis kelopak + bayangan lembut → kesan kedalaman */
.orn-c.orn-bunga3d,.orn-c.orn-bunga4d{width:106px;height:106px;opacity:.9}
.orn-c svg{filter:drop-shadow(1px 1.2px 0 rgba(255,255,255,.6)) drop-shadow(-1px -1.1px 0 rgba(43,28,8,.34)) drop-shadow(0 3px 5px rgba(60,40,10,.22))}
.orn-c.orn-deco,.orn-c.orn-filigree,.orn-c.orn-girih,.orn-c.orn-damask,.orn-c.orn-mendung{width:92px;height:92px;opacity:.92}
.orn-c .orn-l{transform-box:fill-box;transform-origin:50% 50%}
@media (max-width:420px){.orn-c{width:54px;height:54px}.orn-c.orn-bunga3d,.orn-c.orn-bunga4d{width:78px;height:78px}.orn-c.orn-deco,.orn-c.orn-filigree,.orn-c.orn-girih,.orn-c.orn-damask,.orn-c.orn-mendung{width:64px;height:64px}}

/* ---------- BINGKAI LAYAR: ornamen sudut menempel di pojok viewport ----------
   Lapisan fixed di atas isi tetapi di bawah popup/scrim. Tidak menangkap
   sentuhan sama sekali, dan hanya muncul setelah undangan dibuka supaya
   sampul tidak berhias dobel. Bayangan dibuat bertingkat (emboss + bayangan
   ambien dalam) supaya ornamen terasa melayang nyata di atas halaman. */
.scr-frame{position:fixed;inset:0;pointer-events:none;z-index:150;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s}
body.opened .scr-frame{opacity:1;visibility:visible}
.scr-frame .orn-c{top:8px;left:8px;right:auto;bottom:auto;width:clamp(58px,15vw,92px);height:clamp(58px,15vw,92px);opacity:.95;color:var(--accent-body)}
.scr-frame .orn-c.tr{top:8px;right:8px;left:auto}
.scr-frame .orn-c.bl{top:auto;bottom:8px;left:8px;right:auto}
.scr-frame .orn-c.br{top:auto;bottom:8px;right:8px;left:auto}
.scr-frame .orn-c svg{filter:drop-shadow(1px 1.2px 0 rgba(255,255,255,.6)) drop-shadow(-1px -1.1px 0 rgba(43,28,8,.34)) drop-shadow(0 2px 2px rgba(40,26,6,.3)) drop-shadow(0 7px 12px rgba(40,26,6,.26)) drop-shadow(0 16px 26px rgba(40,26,6,.16))}
@media print{.scr-frame{display:none!important}}
/* 4D: tiap sudut berayun pelan berbeda fase, lapisan kelopak melayang berbeda arah */
body.orn-bunga4d .orn-c{animation:ornAyun 7s ease-in-out infinite}
body.orn-bunga4d .orn-c.tr{animation-delay:-1.6s}
body.orn-bunga4d .orn-c.bl{animation-delay:-3.2s}
body.orn-bunga4d .orn-c.br{animation-delay:-4.8s}
body.orn-bunga4d .orn-c .l-back{animation:ornLapis 8s ease-in-out infinite}
body.orn-bunga4d .orn-c .l-mid{animation:ornLapis 8s ease-in-out infinite reverse}
body.orn-bunga4d .orn-c .l-front{animation:ornLapis2 6.5s ease-in-out infinite}
@keyframes ornAyun{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -7px;rotate:1.3deg}}
@keyframes ornLapis{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(1.2px,-1.8px) scale(1.035)}}
@keyframes ornLapis2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-1.4px,1.2px) scale(1.05)}}
@media (prefers-reduced-motion:reduce){body.orn-bunga4d .orn-c,body.orn-bunga4d .orn-c .orn-l{animation:none!important}}

/* ==== Tombol "Buka Undangan" bentuk amplop kertas + segel lilin ==== */
body.wedding-cover #cover .open,body.foto-full #cover .open,#cover .open{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-end;
  width:min(300px,84%);height:auto;min-height:120px;padding:58px 18px 17px;border-radius:13px;border:1px solid rgba(168,130,63,.48);
  background:linear-gradient(172deg,#FFFCF5 0%,#F7EBD2 100%);
  box-shadow:0 22px 42px rgba(20,12,4,.32),inset 0 1px 0 rgba(255,255,255,.85);
  color:#5C4222;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
/* kertas amplop menyesuaikan aksen tema masing-masing */
body.wedding-cover #cover .open,body.foto-full #cover .open,#cover .open{
  border-color:color-mix(in srgb,var(--accent-cover,#A8823F) 52%,transparent);
  background:linear-gradient(172deg,color-mix(in srgb,var(--accent-cover,#C9A25B) 9%,#FFFCF5) 0%,color-mix(in srgb,var(--accent-cover,#C9A25B) 24%,#F4E6C8) 100%);
  color:color-mix(in srgb,var(--ink-body,#4B4237) 88%,#2E2114)}
body.wedding-cover #cover .open::before,body.foto-full #cover .open::before,#cover .open::before{content:'';position:absolute;left:0;right:0;top:0;height:56%;border-radius:12px 12px 0 0;
  background:linear-gradient(180deg,#FDF5E3 0%,#F0E1BC 100%);
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent-cover,#C9A25B) 7%,#FDF5E3) 0%,color-mix(in srgb,var(--accent-cover,#C9A25B) 28%,#EEDFBA) 100%);
  clip-path:polygon(0 0,100% 0,50% 100%);pointer-events:none}
body.wedding-cover #cover .open::after,body.foto-full #cover .open::after,#cover .open::after{content:'';position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 33% 28%,#EFCF88 0%,#C9A25B 55%,#A8823F 100%);
  background:radial-gradient(circle at 33% 28%,color-mix(in srgb,var(--accent-cover,#EFCF88) 62%,#fff) 0%,var(--accent-cover,#C9A25B) 52%,color-mix(in srgb,var(--accent,#A8823F) 72%,#2A1E0C) 100%);
  border:1px solid rgba(255,255,255,.42);
  box-shadow:0 7px 16px rgba(20,12,4,.32),inset 0 1px 2px rgba(255,255,255,.5);pointer-events:none;
  animation:sealNapas 2.9s ease-in-out infinite}
@keyframes sealNapas{0%,100%{box-shadow:0 7px 16px rgba(20,12,4,.32),inset 0 1px 2px rgba(255,255,255,.5)}
  55%{box-shadow:0 8px 26px color-mix(in srgb,var(--accent-cover,#C9A25B) 60%,transparent),inset 0 1px 2px rgba(255,255,255,.55)}}
body.wedding-cover #cover .open .env,body.foto-full #cover .open .env,#cover .open .env{position:absolute;left:50%;top:56%;transform:translate(-50%,-54%);z-index:2;margin:0;font-size:15px;line-height:1;
  filter:drop-shadow(0 1px 2px rgba(60,40,10,.45))}
body.wedding-cover #cover .open:active,body.foto-full #cover .open:active,#cover .open:active{transform:translateY(2px) scale(.98)}

/* ==== Tombol musik mungil ==== */
#musikBtn{height:32px;padding:0 11px;gap:6px;font-size:10px;max-width:150px}
#musikBtn .disc{width:14px;height:14px}
#musikBtn .disc::after{width:4px;height:4px}

/* ==== Animasi buka amplop: flap terangkat, segel jatuh, cover fade perlahan ==== */
#cover .open::before{transform-origin:50% 0;transition:transform .55s cubic-bezier(.34,0,.2,1)}
#cover .open::after,#cover .open .env{transition:transform .45s ease .16s,opacity .38s ease .22s}
body.opened #cover{opacity:0;visibility:hidden;pointer-events:none;transform-origin:0% 50%;
  transition:transform .85s cubic-bezier(.5,0,.24,1) .55s,opacity .6s ease .78s,visibility 0s linear 1.35s}
body.buka-gilir.opened #cover{transform:perspective(1300px) rotateY(-15deg) translateX(-38%)}
body.buka-geser.opened #cover{transform:translateX(-105%)}
body.buka-lipat.opened #cover{transform-origin:50% 0;transform:perspective(1200px) rotateX(-24deg) translateY(-42%)}
body.buka-turun.opened #cover{transform:translateY(36%) scale(.96)}
body.buka-zoom.opened #cover{transform:scale(1.14)}
body.buka-fade.opened #cover{transform:none}
body.buka-kanan.opened #cover{transform:translateX(105%)}
body.buka-naik.opened #cover{transform:translateY(-105%)}
body.buka-putar.opened #cover{transform:rotate(7deg) scale(1.18)}
body.buka-balik.opened #cover{transform-origin:100% 50%;transform:perspective(1300px) rotateY(16deg) translateX(38%)}
body.buka-menyusut.opened #cover{transform-origin:50% 50%;transform:scale(.8)}
body.buka-miring.opened #cover{transform:rotate(-6deg) translate(-58%,16%)}
body.buka-tirai.opened #cover{transform-origin:50% 50%;transform:scaleX(.68)}

/* ---------- GAYA BUKA BARU: sampul buku / daun pintu / kotak kado ----------
   Memperluas sistem FX_BUKA yang sudah ada. Panel .bkl (kiri/kanan) dan .bkt
   (atas/bawah) memakai gradasi yang sama dengan cover lalu beranimasi saat
   dibuka: dua daun pintu berayun dari tengah, tutup kotak kado terangkat
   disertai letupan kelip, dan sampul buku membalik dari tepi kiri sampai
   punggungnya menghilang (backface-visibility). */
#cover .bkl{position:absolute;top:0;bottom:0;width:50.6%;display:none;opacity:0;pointer-events:none;background-image:var(--bukaImg,none),linear-gradient(165deg,var(--g0),var(--g1) 55%,var(--g2));background-size:200% 100%,200% 100%;background-repeat:no-repeat,no-repeat;backface-visibility:hidden}
#cover .bkl.l{left:0;background-position:0 0;transform-origin:left center}
#cover .bkl.r{right:0;background-position:100% 0;transform-origin:right center}
#cover .bkt{position:absolute;left:0;right:0;height:50.6%;display:none;opacity:0;pointer-events:none;background-image:var(--bukaImg,none),linear-gradient(165deg,var(--g0),var(--g1) 55%,var(--g2));background-size:100% 200%,100% 200%;background-repeat:no-repeat,no-repeat;backface-visibility:hidden}
#cover .bkt.t{top:0;background-position:0 0;transform-origin:center top}

/* Reveal elegan bingkai layar: tiap sudut tersibak dari pojok layarnya lewat
   clip-path (bukan transform, supaya mirror .orn-c tetap utuh), berjenjang
   dari kiri-atas, lalu ornamen "bernapas" pelan tanpa henti. */
.scr-frame .orn-c{clip-path:inset(0 100% 100% 0);transition:clip-path 1.1s cubic-bezier(.22,.85,.25,1),opacity .9s ease}
.scr-frame .orn-c.tr{transition-delay:.25s,.25s}
.scr-frame .orn-c.bl{transition-delay:.45s,.45s}
.scr-frame .orn-c.br{transition-delay:.65s,.65s}
body.opened .scr-frame .orn-c{clip-path:inset(0 0 0 0)}
@keyframes scrNapas{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.78}}
body.opened .scr-frame .orn-c svg{animation:scrNapas 7.5s ease-in-out 1.7s infinite}
body.opened .scr-frame .orn-c.tr svg{animation-delay:2s}
body.opened .scr-frame .orn-c.bl svg{animation-delay:2.3s}
body.opened .scr-frame .orn-c.br svg{animation-delay:2.6s}
@media (prefers-reduced-motion:reduce){
 .scr-frame .orn-c{transition:none!important}
 body.opened .scr-frame .orn-c svg{animation:none!important}
 #cover .bkl,#cover .bkt,.kt-burst i{animation:none!important;opacity:0!important}
 body.buka-buku.opened #cover,body.buka-pintu.opened #cover,body.buka-kotak.opened #cover{opacity:0;visibility:hidden;transform:none;transition:opacity .3s ease,visibility 0s .3s}
}

/* ---------- SKIN BUKA TAMBAHAN: struktur beda-beda, full layar, sadar foto ----------
   iris   : cover tersibak diagonal lewat clip-path polygon (tanpa panel).
   lubang : cover tersedot mengecil ke tengah lewat clip-path circle.
   blinds : empat lajur horizontal meluncur berselang-seling (multi-panel).
   jungkit: cover terjungkit ke belakang seperti drawbridge (rotateX bawah).
   Semua panel/lajur memakai --bukaImg bila cover berfoto penuh, sehingga
   potongan foto ikut tersibak dan efeknya tetap full layar & menyatu. */
#cover .bld{position:absolute;left:0;right:0;height:25.6%;display:none;opacity:0;pointer-events:none;background-image:var(--bukaImg,none),linear-gradient(165deg,var(--g0),var(--g1) 55%,var(--g2));background-size:100% 400%,100% 400%;background-repeat:no-repeat,no-repeat;backface-visibility:hidden}
#cover .bld.b1{top:0;background-position:0 0,0 0}
#cover .bld.b2{top:25%;background-position:0 33.33%,0 33.33%}
#cover .bld.b3{top:50%;background-position:0 66.66%,0 66.66%}
#cover .bld.b4{top:75%;background-position:0 100%,0 100%}
body.buka-blinds #cover .bld{display:block}
body.buka-iris #cover{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
body.buka-lubang #cover{clip-path:circle(150% at 50% 50%)}
body.buka-blinds.opened #cover .bdfr,body.buka-blinds.opened #cover .pat,body.buka-blinds.opened #cover .veil{opacity:0;transition:opacity .25s ease}
body.buka-pintu.opened #cover .cvlatar,body.buka-kotak.opened #cover .cvlatar,body.buka-blinds.opened #cover .cvlatar{opacity:0;transition:opacity .25s ease}
body.buka-blinds.opened #cover,body.buka-iris.opened #cover,body.buka-lubang.opened #cover,body.buka-jungkit.opened #cover{opacity:1;visibility:visible;pointer-events:none;transition:visibility 0s 1.15s}
body.buka-blinds.opened #cover .bld.b1{animation:blindsL .8s cubic-bezier(.65,.05,.3,.95) .05s both}
body.buka-blinds.opened #cover .bld.b2{animation:blindsR .8s cubic-bezier(.65,.05,.3,.95) .15s both}
body.buka-blinds.opened #cover .bld.b3{animation:blindsL .8s cubic-bezier(.65,.05,.3,.95) .25s both}
body.buka-blinds.opened #cover .bld.b4{animation:blindsR .8s cubic-bezier(.65,.05,.3,.95) .35s both}
body.buka-iris.opened #cover{clip-path:polygon(0 0,0 0,0 0,0 0);transition:clip-path 1s cubic-bezier(.7,.05,.3,1),visibility 0s 1.05s}
body.buka-lubang.opened #cover{clip-path:circle(0% at 50% 50%);transition:clip-path .95s cubic-bezier(.6,.05,.3,1),visibility 0s 1s}
body.buka-jungkit.opened #cover{transform-origin:50% 100%;transform:perspective(1200px) rotateX(94deg);transition:transform .95s cubic-bezier(.55,.08,.3,1),visibility 0s 1s}
@keyframes blindsL{0%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(-102%)}}
@keyframes blindsR{0%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(102%)}}
@media (prefers-reduced-motion:reduce){
 #cover .bld{animation:none!important;opacity:0!important}
 body.buka-iris #cover,body.buka-lubang #cover{clip-path:none}
 body.buka-iris.opened #cover,body.buka-lubang.opened #cover,body.buka-jungkit.opened #cover,body.buka-blinds.opened #cover{opacity:0;visibility:hidden;transform:none;clip-path:none;transition:opacity .3s ease,visibility 0s .3s}
}

/* ==========================================================================
   KERANGKA LAYOUT — 9 shell + 6 bagian eksklusif (2026-10-15)
   Dipasang lewat kelas body `lay-<shell>` oleh layoutOf(tplF) dan pembungkus
   `.lay-slot.lay-slot-<kunci>` oleh susunBagian(). Preset `klasik` sengaja
   TIDAK punya aturan di sini: output-nya harus tetap persis seperti lama.

   Aturan main yang dipegang semua shell:
   - latar .card tetap TERANG. Banyak warna teks di liveSlides() di-hardcode
     (#57503f, #4a4436, #8a7f72, ...) sehingga kartu gelap akan membuat teks
     tak terbaca. Yang didramatisir adalah ruang ANTAR bagian, bukan kartunya.
   - mobile-first. Lebar dasar .wrap 470px; shell yang butuh kolom lebih
     (split) baru melebar di >=900px.
   - tidak mengubah #cover: kerangka cover tetap diatur tema + CVL + arch.
   ========================================================================== */

/* ---------- bagian eksklusif: bentuk dasarnya (semua shell) ---------- */
.lay-slot{position:relative}
.lay-navdot{position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:40;
  display:flex;flex-direction:column;gap:9px;padding:9px 6px;border-radius:99px;
  background:color-mix(in srgb,var(--g1) 72%,#fff);border:1px solid color-mix(in srgb,var(--accent) 22%,#fff);
  box-shadow:0 8px 22px rgba(60,45,20,.16);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.lay-navdot a{display:block;width:9px;height:9px;padding:0;text-decoration:none}
.lay-navdot a i{display:block;width:9px;height:9px;border-radius:99px;
  background:color-mix(in srgb,var(--accent) 34%,#fff);transition:transform .25s,background .25s}
.lay-navdot a:hover i,.lay-navdot a:focus-visible i{transform:scale(1.55);background:var(--accent-body)}
.lay-bab{display:block;font-family:var(--ft);font-size:12px;letter-spacing:.34em;color:var(--accent-body);
  opacity:.75;text-align:center;margin:0 0 -6px}

   Satu preset menentukan EMPAT hal sekaligus:
     shell  → kelas body `lay-<shell>`: bentuk & tata letak bagian (10 shell)

     ekstra → bagian eksklusif yang hanya lahir di preset itu
     vip    → mount mesin 4D (parallax 3 lapis + partikel + entrance sinematik)

/* Bagian eksklusif: lahir dari data yang SUDAH ada di snapshot, jadi undangan
   lama ikut dapat tanpa pemiliknya mengisi apa pun. */
function htmlKutipBesar(ev,S){
 const q=(S&&S.quote&&S.quote.custom)?{text:S.quote.text,author:S.quote.author}:(QUOTES[ev]||QUOTES.pernikahan);
 if(!q||!q.text)return'';
 return`<div class="lay-kutip"><span class="lay-kutip-t" aria-hidden="true">❝</span>
  <p>${esc(q.text)}</p>${q.author?`<cite>— ${esc(q.author)}</cite>`:''}</div>`}
function htmlHeroFoto(d){
 const g=(d&&Array.isArray(d.gallery))?d.gallery.filter(Boolean):[];
 if(!g.length)return'';
 return`<figure class="lay-hero"><img src="${esc(g[0])}" alt="" loading="lazy"
  onerror="this.closest('.lay-hero').style.display='none'"><figcaption>${esc(g.length)} momen</figcaption></figure>`}

/* Susun bagian menurut preset. `polos` = preset klasik: bagian dilepas apa
   adanya tanpa pembungkus, sehingga output-nya identik byte-per-byte dengan
   renderer sebelum rombakan. Preset lain membungkus tiap bagian jadi
   `.lay-slot.lay-slot-<kunci>` supaya shell CSS bisa menata per bagian. */
function susunBagian(SEC,LX,d,ev){
 const ur=URUTAN[LX.urutan]||URUTAN.A,x=LX.ekstra||[];
 const polos=LX.shell==='klasik'&&!x.length;
 const aktif=ur.filter(k=>String(SEC[k]||'').trim());
 const out=[];let bab=0;
 if(!polos&&x.includes('navDot'))
  out.push(`<nav class="lay-navdot" aria-label="Navigasi bagian">`+
   aktif.map((k,i)=>`<a href="#bagian-${i+1}" data-ke="${esc(k)}" title="Bagian ${i+1}"><i></i></a>`).join('')+`</nav>`);
 aktif.forEach((k,i)=>{
  const html=SEC[k];
  if(polos){out.push(html);return}
  let cls='lay-slot lay-slot-'+k;
  if(x.includes('galeriStrip')&&k==='galeri')cls+=' lay-strip';
  if(x.includes('jamFlip')&&k==='acara')cls+=' lay-flip';
  let sisip='';
  if(x.includes('babAngka')){bab++;sisip+=`<i class="lay-bab" aria-hidden="true">${ROMAWI[bab]||bab}</i>`}
  if(x.includes('kutipBesar')&&k==='profil')sisip+=htmlKutipBesar(ev,d&&d.slides);
  if(x.includes('heroFoto')&&k==='acara')sisip+=htmlHeroFoto(d);
  out.push(`<div class="${cls}" id="bagian-${i+1}">${sisip}${html}</div>`)});
 return out.join('')}

/* ===== Ornamen SVG per tema =====
   Deretan simbol Unicode di field deco (mis. "X . X") diganti motif yang
   benar-benar digambar untuk divider dan footer. Field deco TETAP diisi dan
   tetap dipakai sebagai fallback, jadi undangan lama yang belum menyimpan
   orn tampil persis seperti sebelumnya -- tidak ada yang rusak.
   Semua motif memakai currentColor supaya otomatis ikut warna divider tema. */

/* Kelopak/daun tunggal: ellipse yang diputar mengelilingi titik jangkar. */
function ornDaun(cx,cy,rx,ry,rot,op){
 return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="currentColor"'+
  ' transform="rotate('+rot+' '+cx+' '+cy+')" opacity="'+(op==null?.8:op)+'"/>';
}
/* Roset: n kelopak tersebar merata mengelilingi pusat -- dijamin simetris. */
function ornRoset(cx,cy,n,rx,ry,jarak,op){
 let s='';
 for(let i=0;i<n;i++){
  const a=i*360/n, rad=a*Math.PI/180;
  const px=cx+Math.cos(rad)*jarak, py=cy+Math.sin(rad)*jarak;
  s+=ornDaun(px.toFixed(1),py.toFixed(1),rx,ry,a.toFixed(1),op);
 }
 return s;
}
/* Sinar memancar dari pusat, untuk motif art-deco dan bintang. */
function ornSinar(cx,cy,n,r1,r2,w,op){
 let s='';
 for(let i=0;i<n;i++){
  const a=i*360/n, rad=a*Math.PI/180;
  s+='<line x1="'+(cx+Math.cos(rad)*r1).toFixed(1)+'" y1="'+(cy+Math.sin(rad)*r1).toFixed(1)+
     '" x2="'+(cx+Math.cos(rad)*r2).toFixed(1)+'" y2="'+(cy+Math.sin(rad)*r2).toFixed(1)+
     '" stroke="currentColor" stroke-width="'+w+'" stroke-linecap="round" opacity="'+op+'"/>';
 }
 return s;
}
const ORN_GARIS=(d,w,op)=>'<path d="'+d+'" fill="none" stroke="currentColor" stroke-width="'+
 (w==null?1.3:w)+'" stroke-linecap="round" opacity="'+(op==null?.9:op)+'"/>';
function ornBungkus(isi){
 /* Ukuran lewat ATRIBUT, bukan inline style, supaya bisa ditimpa CSS.
    Picker ornamen di Studio butuh pratinjau kecil; inline style akan menang
    atas aturan CSS mana pun sehingga pratinjau tak bisa dikecilkan. */
 return '<svg viewBox="0 0 168 28" width="132" height="22" fill="none" aria-hidden="true" '+
  'style="display:block;max-width:100%">'+isi+'</svg>';
}

/* Motif ornamen yang dipakai. Pilihan pemilik di snapshot (d.orn) menang atas

   deco lama -- aman untuk snapshot terbitan lama yang belum menyimpan orn. */
function ornMotif(d,tplF){
 const pilih=(d&&d.orn)||'';
 const id=ornIdValid(pilih)?pilih:(tplF&&tplF.orn);
 if(id&&ORNAMEN[id]){try{return ORNAMEN[id]()}catch(e){/* motif gagal digambar */}}
 return null;
}
/* ===== Bingkai ornamen per pilihan border =====

   Keluhan: 32 pilihan border semuanya persegi, dan yang namanya mewah
   (Laurel Emas, Filigree, Mahkota Mutiara, Crown VIP) isinya cuma variasi
   border + box-shadow -- tidak ada ornamennya sama sekali.

   Di sini tiap border berhias mendapat motif yang benar-benar digambar:
   empat sudut + empat tepi, dipasang sebagai LAPISAN BACKGROUND.

   Kenapa background, bukan border-image atau pseudo-element:
   - border-image mengabaikan border-radius, padahal hampir semua model cover
     (cvl-glass, cvl-sakura, cvl-batik, ...) menetapkan radius. Sudut ornamen
     akan mencuat keluar melewati lengkungan.
   - .bdfr::before dan ::after sudah dipakai 9 aturan cvl-*, jadi tidak tersedia.
   Background ikut ter-clip oleh border-radius dan tidak merebut apa pun.

   Warna memakai aksen tema (A) yang sudah diterima fungsi s(A) di BORDERS. */

const BK_K = 46;   // ukuran kotak sudut, px
const BK_E = 40;   // panjang satu unit tepi yang diulang, px

/* Enkoding SVG ke data URI. encodeURIComponent menangani '#' pada warna heks
   dan tanda kutip, jadi aman diselipkan ke dalam fungsi url() milik CSS. */
function bkUri(isi, w, h) {
  const svg = "<svg xmlns=\"http://www.w3.org/2000/svg\" width='" + w + "' height='" + h +
    "' viewBox='0 0 " + w + ' ' + h + "'>" + isi + '</svg>';
  /* Pembatas url() harus KUTIP TUNGGAL. Keluaran ini diselipkan ke atribut HTML
     berkutip ganda (style="${bdStyle}"), jadi kutip ganda di sini akan menutup
     atributnya lebih awal dan memotong seluruh ornamen -- gejalanya bingkai
     tetap polos walaupun fungsinya mengembalikan ribuan karakter.
     encodeURIComponent tidak mengemas apostrof, jadi diganti manual ke %27
     agar tidak ada kutip tunggal liar di dalam URI. */
  return "url('data:image/svg+xml," + encodeURIComponent(svg).replace(/'/g, '%27') + "')";
}

  const K = BK_K, E = BK_E, T = BK_T;
  const sTL = bkUri(sd(A), K, K);
  const sTR = bkUri(bkCerminX(sd(A), K, K), K, K);
  const sBR = bkUri(bkCerminXY(sd(A), K, K), K, K);
  const sBL = bkUri(bkCerminY(sd(A), K, K), K, K);
  const tT = bkUri(tp(A), E, T);
  const tB = bkUri(bkCerminY(tp(A), E, T), E, T);
  /* Tepi kiri/kanan = desain tepi atas yang diputar 90 derajat.
     rotate(-90) memetakan (x,y) ke (y,-x), lalu translate(0,E) mengangkatnya
     kembali ke kuadran positif sehingga pas di kotak T x E.
     rotate(90) memetakan (x,y) ke (-y,x), lalu translate(T,0) melakukan hal sama. */
  const tL = bkUri("<g transform='translate(0," + E + ") rotate(-90)'>" + tp(A) + '</g>', T, E);
  const tR = bkUri("<g transform='translate(" + T + ",0) rotate(90)'>" + tp(A) + "</g>", T, E);
  return [
    'background-image:' + [sTL, sTR, sBR, sBL, tT, tB, tL, tR].join(','),
    'background-size:' + [K + 'px ' + K + 'px', K + 'px ' + K + 'px', K + 'px ' + K + 'px', K + 'px ' + K + 'px',
      E + 'px ' + T + 'px', E + 'px ' + T + 'px', T + 'px ' + E + 'px', T + 'px ' + E + 'px'].join(','),
    'background-position:' + ['top left', 'top right', 'bottom right', 'bottom left',
      'top ' + (K - T / 2) + 'px left ' + K + 'px', 'bottom ' + (K - T / 2) + 'px left ' + K + 'px',
      'left ' + (K - T / 2) + 'px top ' + K + 'px', 'right ' + (K - T / 2) + 'px top ' + K + 'px'].join(','),
    'background-repeat:' + ['no-repeat', 'no-repeat', 'no-repeat', 'no-repeat',
      'repeat-x', 'repeat-x', 'repeat-y', 'repeat-y'].join(','),
    'background-origin:border-box'
  ].join(';');
}

/* CSS agar ornamen sudut juga hadir di SEMUA lapisan kartu, bukan hanya
   sampul dan kartu tamu. Dipasang sebagai lapisan background (ikut ter-clip
   border-radius, tidak merebut pseudo-element) lewat <style> yang disuntik
   saat boot karena warnanya mengikuti aksen tema. */
function ornSudutCssDariSvg(svg, A) {
  if (!svg) return '';
  const m = String(svg).match(/viewBox=["']([^"']+)["']/);
  if (!m) return '';
  const vb = m[1].trim().split(/\s+/);
  const W = vb[2], H = vb[3];
  /* Buang pembungkus <svg> supaya pencerminan bekerja pada isinya, bukan
     menyarangkan <svg> di dalam <svg>. */
  const isi = String(svg).replace(/^<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
  const K = 54, uri = (inner) => "url('data:image/svg+xml," +
    encodeURIComponent("<svg xmlns=\"http://www.w3.org/2000/svg\" width='" + W + "' height='" + H +
      "' viewBox='" + vb.join(' ') + "'>" + inner + "</svg>").replace(/'/g, '%27') + "')";
  const satu = isi;
  const tl = uri(satu), tr = uri(bkCerminX(satu, W, H)),
    br = uri(bkCerminXY(satu, W, H)), bl = uri(bkCerminY(satu, W, H));
  return '.card{background-image:' + [tl, tr, br, bl].join(',') + ';' +
    'background-position:left 7px top 7px,right 7px top 7px,right 7px bottom 7px,left 7px bottom 7px;' +
    'background-repeat:no-repeat,no-repeat,no-repeat,no-repeat;' +
    'background-size:' + K + 'px ' + K + 'px,' + K + 'px ' + K + 'px,' + K + 'px ' + K + 'px,' + K + 'px ' + K + 'px}';
}

function fitCoverPhoto(im,frame,p){
 const b=frame.getBoundingClientRect(),w=frame.clientWidth||b.width,h=frame.clientHeight||b.height;
 const iw=im.naturalWidth||0,ih=im.naturalHeight||0;
 if(!w||!h||!iw||!ih)return false;
 const fit=Math.max(w/iw,h/ih),fw=iw*fit*p.z,fh=ih*fit*p.z;
 im.style.position='absolute';im.style.right='auto';im.style.bottom='auto';
 im.style.maxWidth='none';im.style.maxHeight='none';im.style.width=fw+'px';im.style.height=fh+'px';

 im.style.objectFit='fill';im.style.objectPosition='50% 50%';im.style.transform='none';return true
}

/* Kembalikan potongan CSS background untuk pola id pada tema t.
   skala (opsional) melunakkan opasitas, dipakai lapisan latar halaman. */
function polaCss(id, t, skala) {
 const P = POLA[id];
 if (!P) return '';
 const tema = t || {};
 if (P.css) return P.css(tema);
 const c = tema.accent || '#8b7358';
 const op = Math.max(.04, Math.round(P.op * (skala == null ? 1 : skala) * 100) / 100);
 const svg = P.svg(c, op);
 return `background-image:url(data:image/svg+xml,${encodeURIComponent(svg)});background-size:${P.size};background-repeat:repeat;`;
}

function setupMusic(url,name){
 const a=$('musik');if(!url)return;
 try{a.src=new URL(url,location.href).href}catch(e){a.src=url}
 $('musikNama').textContent=name||'Musik Acara';
 const btn=$('musikBtn');btn.style.display='inline-flex';
 let on=false,ac=null,an=null;
 /* Jangan sambungkan audio lintas-origin ke Web Audio. Tanpa header CORS yang
    tepat, createMediaElementSource() tetap memutar elemen tetapi membisukan
    keluarannya — ini terutama membuat musik upload dari Supabase terdengar
    diam. Audio lintas-origin dibiarkan diputar langsung oleh browser. */
 let sameOrigin=false;try{sameOrigin=new URL(a.src,location.href).origin===location.origin}catch(e){}
 const viz=document.createElement('span');viz.className='viz';viz.setAttribute('aria-hidden','true');
 viz.innerHTML='<i></i><i></i><i></i><i></i><i></i>';btn.appendChild(viz);
 const bars=[...viz.querySelectorAll('i')];
 const hook=()=>{if(!sameOrigin)return;try{
  if(an)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  ac=new AC();if(ac.state==='suspended')ac.resume();
  const src=ac.createMediaElementSource(a);an=ac.createAnalyser();an.fftSize=64;
  src.connect(an);an.connect(ac.destination);
  const loop=()=>{if(!an)return;const d=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(d);
   bars.forEach((b,i)=>{b.style.height=(3+Math.round((d[2+i*4]||0)/15))+'px'});
   requestAnimationFrame(loop)};
  loop();viz.classList.add('on');
 }catch(e){an=null}};
 /* Kelas musik-on mengikuti KEJADIAN audio sungguhan, bukan niat memutar:
    bila autoplay diblokir browser, piringan & cincin denyut tidak menipu. */
 a.addEventListener('play',()=>{on=true;document.body.classList.add('musik-on')});
 a.addEventListener('pause',()=>{on=false;document.body.classList.remove('musik-on')});
 a.addEventListener('ended',()=>{on=false;document.body.classList.remove('musik-on')});
 btn.addEventListener('click',()=>{
  /* Pakai status elemen audio aktual, bukan flag niat autoplay. Kalau autoplay
     ditolak browser, klik pertama harus tetap mencoba memutar (bukan pause). */
  if(a.paused){a.play().then(()=>{on=true;hook()}).catch(()=>{on=false})}
  else{a.pause();on=false;viz.classList.remove('on');bars.forEach(b=>b.style.height='3px')}
 });
 return ()=>{a.play().then(()=>{on=true;hook()}).catch(()=>{on=false});
  a.addEventListener('playing',hook,{once:true});
  viz.classList.add('on')}
}

/* Alamat dari tautan Maps pemilik dipakai lebih dulu: tautan panjang Google
   Maps biasanya membawa koordinat (@lat,lng / !3dlat!4dlng) atau q= yang jauh
   lebih akurat daripada menebak dari nama tempat + alamat yang ditulis bebas.

   query ganda seperti "Bendo Gede 2, Bendo Gede 2, Sumbergiri, ..." membuat

/* Panitia mencatat kehadiran di tabel `checkin` saat memindai QR (scan.html).

   60 detik selama undangan masih dibuka — jadi centangnya muncul tanpa tamu
   harus menyegarkan halaman. Tabel/akses yang belum ada = diam saja. */
function qrCekHadir(nama){
 const nm=String(nama||'').replace(/\s+/g,' ').trim();
 if(qrHadirNama!==nm){
  qrHadirNama=nm;qrHadirAda=false;qrHadirJalan=false;
  if(qrHadirTimer){clearTimeout(qrHadirTimer);qrHadirTimer=null}
  qrBadgeTulis('');
 }
 if(!nm||qrHadirAda||DEMO||PREVIEW||!SLUG)return;
 if(!qrHadirVis){
  qrHadirVis=true;
  document.addEventListener('visibilitychange',function(){
   if(!document.hidden&&qrHadirNama&&!qrHadirAda&&!qrHadirJalan&&!qrHadirTimer)qrHadirAmbil()});
 }
 /* Satu permintaan pada satu waktu: nama yang masih diketik belum jadi request,
    dan permintaan yang sedang jalan tidak ditumpuk yang baru. */
 if(qrHadirJalan||qrHadirTimer)return;
 qrHadirTimer=setTimeout(function(){qrHadirTimer=null;qrHadirAmbil()},1200);

function qrHadirAmbil(){
 if(!qrHadirNama||qrHadirAda||qrHadirJalan)return;
 if(document.hidden){qrHadirAmbilNanti();return}
 qrHadirJalan=true;
 fetch(SUPABASE_URL+'/rest/v1/checkin?slug=eq.'+encodeURIComponent(SLUG)+'&guest=eq.'+encodeURIComponent(qrHadirNama)+'&select=guest,checked_in_at',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}})
  .then(function(r){return r&&r.ok?r.json():null})
  .then(function(rows){
   qrHadirJalan=false;
   if(Array.isArray(rows)&&rows.length){
    qrHadirAda=true;
    if(qrHadirTimer){clearTimeout(qrHadirTimer);qrHadirTimer=null}
    qrBadgeTulis('\u2705 Sudah check-in'+(rows[0].checked_in_at?(' \u2022 '+qrWaktuCheckin(rows[0].checked_in_at)):''));

  })

}

  if(svg)svg.innerHTML='';if(elNm)elNm.textContent='';if(elKd)elKd.textContent='';

const BT_LOCAL=[];
function ucapanBaru(n,st,pesan){return{guest:n,status:st,pesan:pesan,t:Date.now()}}
function toastRsvp(st,n){return st==='hadir'?('Terima kasih, '+n+'! Konfirmasi hadir tercatat ✅')

let rsvpJalan=false;
async function rsvpSave(st){
 if(rsvpJalan)return;rsvpJalan=true;
 const n=((document.getElementById('rvpN')?document.getElementById('rvpN').value:GUEST)||'Tamu').trim()||'Tamu';
 const pesan=((window.__stkU?window.__stkU+' ':'')+(document.getElementById('rvpM')?document.getElementById('rvpM').value:'')).trim();
 document.querySelectorAll('[data-rsvpb]').forEach(b=>{b.disabled=true;b.style.opacity=.55});
 document.querySelectorAll('[data-r="'+st+'"]').forEach(b=>{b.classList.add('sent');setTimeout(()=>b.classList.remove('sent'),900)});
 /* Mode demo / file mandiri: simpan lokal saja — jangan menulis baris palsu

 if(DEMO||PREVIEW||!SLUG){

  ivToast(toastRsvp(st,n));
  document.querySelectorAll('[data-rsvpb]').forEach(b=>{b.disabled=false;b.style.opacity=1});
  rsvpJalan=false;
  return;
 }
 const base={slug:SLUG,guest:n,status:st,updated_at:new Date().toISOString()};
 const kirim=(url,body)=>fetch(url,{method:'POST',
  headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
  body:JSON.stringify(body)});
 let ok=false;
 try{
  let r=await kirim(SUPABASE_URL+'/rest/v1/rsvp?on_conflict=slug,guest',Object.assign({pesan:pesan},base));
  if(!r.ok){/* skema lama: tanpa kolom pesan / tanpa unique(slug,guest) — coba cara lama */}
  else ok=true;
  if(!ok)r=await kirim(SUPABASE_URL+'/rest/v1/rsvp',base),ok=r.ok;
 }catch(e){ok=false}
 if(ok){
  ivToast(toastRsvp(st,n));

 }else{

 }
 document.querySelectorAll('[data-rsvpb]').forEach(b=>{b.disabled=false;b.style.opacity=1});
 rsvpJalan=false;

function waktuLalu(ts){let t=Number(ts);if(!Number.isFinite(t))t=Date.now();
 const s=Math.max(0,Math.floor((Date.now()-t)/1000));
 if(s<60)return 'baru saja';
 if(s<3600)return Math.floor(s/60)+' menit lalu';
 if(s<86400)return Math.floor(s/3600)+' jam lalu';
 if(s<2592000)return Math.floor(s/86400)+' hari lalu';
 if(s<31536000)return Math.floor(s/2592000)+' bulan lalu';
 return Math.floor(s/31536000)+' tahun lalu'}
let BT_SHOWN=4;
function btLainnya(){BT_SHOWN+=6;muatBukuTamu(true)}
function btPisahStiker(p){const S=['\u{1F970}','\u{1F60D}','\u{1F62D}','\u{1F389}','\u2728','\u{1F490}','\u{1F64F}','\u2764\uFE0F','\u{1F979}','\u{1F44F}','\u{1F60A}','\u{1F90D}'];
  const s=String(p||'');for(let i=0;i<S.length;i++){if(s.indexOf(S[i])===0)return{e:S[i],p:s.slice(S[i].length).trim()}}return{e:'',p:s}}
function tampilBukuTamu(rows){const el=document.getElementById('btList');if(!el)return;
 if(!rows||!rows.length){el.innerHTML='<div class="bt-memuat">Belum ada ucapan \u2014 jadilah yang pertama! \u2728</div>';return}
 el.innerHTML=rows.slice(0,BT_SHOWN).map(r=>{const st=String(r.status||'hadir');
  const lb=st==='hadir'?'Hadir':st==='ragu'?'Belum Pasti':'Tidak Hadir';
  const cls=st==='hadir'?'hadir':st==='ragu'?'ragu':'tidak';
  const sk=btPisahStiker(r.pesan);
  return '<div class="bt-item"><div class="bt-top"><div class="bt-nm">'+esc(r.guest||'Tamu')+'</div>'+
   '<div class="bt-st '+cls+'">'+lb+'</div>'+
   '<div class="bt-wk">'+esc(waktuLalu(r.t||Date.now()))+'</div></div>'+
   (sk.e?'<div class="bt-stk" aria-hidden="true">'+sk.e+'</div>':'')+
   (sk.p?'<div class="bt-msg">\u201C'+esc(sk.p)+'\u201D</div>':'')+'</div>'}).join('')+
  (rows.length>BT_SHOWN?'<button type="button" class="bt-more" onclick="btLainnya()">Tampilkan lainnya ('+(rows.length-BT_SHOWN)+')</button>':'')}

/* Tema kustom ikut snapshot JSON; array TPL publik tidak pernah ditambah/diurut ulang.
   Validasi palet, pola, font, id, dan path aset sebelum memakai data dari server. */
function customThemeFromDraft(id,rows){
 if(!Array.isArray(rows)||!id||TPL.some(t=>t.id===id)||!/^custom-[a-z0-9][a-z0-9-]{2,80}$/.test(id))return null;
 const raw=rows.find(t=>t&&t.id===id);if(!raw||typeof raw!=='object')return null;
 const base=TPL.find(t=>t.id===raw.baseTpl)||TPL[0];
 const warna=(v,b)=>/^#[0-9a-f]{6}$/i.test(String(v||''))?String(v).toUpperCase():b;
 const fontIds=FONTS.map(f=>f.id),polas=['','batik','botanical','frost','arab','confetti'];
 const aset=v=>{const p=String(v||'').split('/');return p[0]==='assets'&&p.length>1&&p.slice(1).every(x=>/^[a-z0-9._-]+$/i.test(x))&&!p.includes('..')?v:''};
 const g=Array.isArray(raw.g)?raw.g:base.g;
 return {id,nama:String(raw.nama||'Template Kustom').replace(/[<>]/g,'').slice(0,60),ev:['pernikahan','khitanan','ultah','aqiqah','all'].includes(raw.ev)?raw.ev:base.ev,
  g:[0,1,2].map(i=>warna(g[i],base.g[i])),accent:warna(raw.accent,base.accent),ink:warna(raw.ink,base.ink),
  deco:String(raw.deco||base.deco||'✦ ❖ ✦').replace(/[<>]/g,'').slice(0,60),pat:polas.includes(raw.pat)?raw.pat:(base.pat||''),
  ft:fontIds.includes(raw.ft)?raw.ft:base.ft,char:String(raw.char||base.char||'').replace(/[<>]/g,'').slice(0,24),
  arch:!!raw.arch,bg3d:aset(raw.bg3d),bgPaper:aset(raw.bgPaper),custom:true,studioOnly:raw.studioOnly!==false};
}

/* Kelas body yang dikelola boot(): setiap render ulang (termasuk update
   pratinjau dari Studio) WAJIB mulai dari nol untuk kelas-kelas ini, kalau
   tidak pilihan lama menempel terus dan pilihan cover/tombol/ukuran foto
   baru tidak pernah kelihatan di pratinjau. Kelas keadaan sesi (preview,
   sudah dibuka, dsb.) dipertahankan. */
const BOOT_KELAS_SESI=['preview-mode','opened','pv-soft','embed-buka'];
function bootBersihkan(){
 const simpan=BOOT_KELAS_SESI.filter(c=>document.body.classList.contains(c));
 document.body.className=simpan.join(' ');
 /* Elemen yang ditempel boot() sebelumnya ke <body> (di luar #app) ikut
    dibersihkan supaya tidak menumpuk tiap pratinjau diperbarui. */
 document.querySelectorAll('.nv-bar,.gal-lb,#aspAmbient').forEach(el=>el.remove());
 if(window.__aspCdTimer){clearInterval(window.__aspCdTimer);window.__aspCdTimer=null}
 if(window.__aspMapIO){try{window.__aspMapIO.disconnect()}catch(e){}window.__aspMapIO=null}
}
function boot(draft){
 bootBersihkan();
 const d=(draft.data&&typeof draft.data==='object')?draft.data:null;
 const tplId=d&&d.tpl?String(d.tpl):'';
 const customTpl=d&&tplId?customThemeFromDraft(tplId,d.tplCustom):null;
 const tpl=customTpl||(tplId?(TPL.find(t=>t.id===tplId)||null):null);
 const tplF=tpl||TPL[Math.max(0,Math.min(TPL.length-1,(Number.isFinite(+draft.theme)?+draft.theme:0))) ]||TPL[0];
 let ev=(d&&d.event)||tplF.ev;
 if(!d&&tplF.ev==='all'){const li=Number.isFinite(+draft.theme)?+draft.theme:-1;if(LEGACY_EV[li]&&LEGACY_KEY[LEGACY_EV[li]]!=='all')ev=LEGACY_KEY[LEGACY_EV[li]]}
 const form=(d&&d.form)||{};
 const doa=(d&&DOA[d.doa])?DOA[d.doa]:(DOA[ev]||DOA.pernikahan);
 const urlAman=u=>{const s=String(u||'').trim();if(!s)return '';
  try{const x=new URL(s,location.href);if(x.protocol==='https:'||x.protocol==='http:')return x.href}catch(e){}return ''};
 const salamBuka=String((form.salamBuka!==undefined&&form.salamBuka!==null)?form.salamBuka:'Assalamu\u2019alaikum wr. wb.').trim();
 const salamTutup=String((form.salamTutup!==undefined&&form.salamTutup!==null)?form.salamTutup:'Wassalamu\u2019alaikum wr. wb.').trim();

 /* nama utama */
 let titleMain='',titleSub='',names=[{nm:'',rl:''}];
 if(ev==='pernikahan'){
  const p1=(form.namaPria||draft.name1||''),p2=(form.namaWanita||draft.name2||'');
  titleMain=p1||'Nama Pengantin';titleSub=p2||'';
  names=[
   {nm:(form.gelarPria?form.gelarPria+' ':'')+titleMain+(form.namaPria&&form.gelarPria?'':''),rl:'Putra/Kelima dari<br>'+esc(form.putraPutri||'—')},
   {nm:(form.gelarWanita?form.gelarWanita+' ':'')+titleSub,rl:'Putri/Kelima dari<br>'+esc(form.putriDari||'—')}];
 }else{
  titleMain=(form.namaAnak||draft.name1||'Nama Acara');titleSub='';
  const rl={khitanan:esc(form.putraDari||'—')+'<br>'+(form.umurAnak?esc(form.umurAnak):''),
   ultah:(form.temaUltah?esc(form.temaUltah)+'<br>':'')+(form.usia?esc(form.usia)+' Tahun':''),
   aqiqah:esc(form.putraDari||form.temaAqiqah||'—')}[ev];
  names=[{nm:titleMain,rl:rl||''}];
 }

 /* tema */
 const rs=document.documentElement.style;
 const isWedding=ev==='pernikahan';
 const PAPER=isWedding?(tplF.bgPaper||''):'';
 /* Kerangka layout tema: shell-nya dipasang di body supaya CSS bisa menata
    #cover maupun #content. `klasik` ikut dipasang agar konsisten, tapi tidak
    punya aturan CSS — jadi output-nya tetap persis seperti sebelum rombakan. */
 const LX=layoutOf(tplF);
 if(isWedding){document.body.classList.add('wedding-cover','theme-'+tplF.id)}
 if(tplF.arch)document.body.classList.add('gerbang-arch');
 document.body.classList.add('lay-'+LX.shell);
 /* Model cover pembuka: lima model dasar + sepuluh gaya unik dari Studio. */
 const CVL=['amplop','kartu','foto','gerbang','minimal','batik','sakura','night','ticket','editorial','polaroid','glass','royal','archive','neon'].indexOf(d&&d.coverLayout)>=0?d.coverLayout:'amplop';
 if(CVL!=='amplop')document.body.classList.add('cvl-'+CVL);
 if(PAPER){document.body.classList.add('wedding-paper-art');rs.setProperty('--wedding-paper-art',"url('"+PAPER+"')")}
 rs.setProperty('--g0',tplF.g[0]);rs.setProperty('--g1',tplF.g[1]);rs.setProperty('--g2',tplF.g[2]);
 rs.setProperty('--accent',tplF.accent);rs.setProperty('--ink',tplF.ink);
 /* Kontras: cover memakai ink tema apa adanya (gradasinya mengikuti tema), tapi
    kartu konten selalu berlatar terang — untuk 12 tema berpalet gelap, ink tema
    nyaris tak terlihat di sana. assets/theme-contrast.js menurunkan kecerahan
    sampai kontrasnya cukup (rona tema tetap). Bila aset tidak termuat (mis. file
    offline tanpa folder assets/), nilainya kembali ke warna tema seperti semula. */
 const TC=window.AsThemeContrast;
 /* Artwork 3D tema (bila ada): latar cover + teks cover versi terang.
    Tanpa artwork, semuanya kembali ke warna tema seperti semula. */
 const ART=tplF.bg3d||'';
 /* Foto cover: gaya dipilih pemilik di Studio; posisi & zoom dari penyesuai geser.
    Tanpa foto, tidak ada bingkai (perilaku lama tetap sama). */
 const fotoUtama=String((d&&d.cover)||'').trim();
 const CV_GAYA=['kotak','oval','lingkaran','arch','polaroid','emas','kapsul'];
 const cvDiminta=String((d&&d.coverStyle)||(tplF.arch?'arch':''));
 let cvStyle=!fotoUtama?'none'
  :(CV_GAYA.indexOf(cvDiminta)>=0?cvDiminta
   :(cvDiminta==='full'?'full':(cvDiminta==='none'?'none':'kotak')));
 if(CVL==='gerbang'&&fotoUtama){cvStyle='arch';document.body.classList.add('gerbang-arch')}
 else if(CVL==='foto'&&fotoUtama)cvStyle='full';
 else if(CVL==='minimal')cvStyle='none';
 /* Bila cover berfoto penuh, panel gaya membuka ikut membawa potongan
    foto yang sama supaya efek pintu/kotak/blinds menyatu dengan foto. */
 const bukaImg=(cvStyle==='full'&&fotoUtama)?`--bukaImg:url('${fotoUtama.replace(/'/g,'%27').replace(/"/g,'%22')}')`:'';
 const cpo=(d&&d.coverPos)||{};
 const angkaPos=(v,b)=>{const n=parseFloat(v);return isFinite(n)?Math.min(100,Math.max(0,n)):b};
 const cvZ=(()=>{const n=parseFloat(cpo.z);return isFinite(n)?Math.min(4,Math.max(1,n)):1})();
 const cvP={x:angkaPos(cpo.x,50),y:angkaPos(cpo.y,50),z:cvZ};
 _coverCrop=cvP;
 /* Ukuran foto cover & gaya tombol buka: pilihan pemilik dari Studio.
