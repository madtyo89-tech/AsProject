    yang lebih besar + tombol amplop klasik). */
 const CV_UKURAN=['kecil','sedang','besar','jumbo'];
 document.body.classList.add('cvsz-'+(CV_UKURAN.indexOf(d&&d.coverSize)>=0?d.coverSize:'sedang'));
 const BTN_OPEN=['amplop','pil','emas','garis','kaca','pita','cap','daun','kartu','neon','mutiara','royal','minimal'];
 document.body.classList.add('btnopen-'+(BTN_OPEN.indexOf(d&&d.coverBtn)>=0?d.coverBtn:'amplop'));
 if(ART&&cvStyle!=='full'){document.body.classList.add('art3d');rs.setProperty('--cover-art',"url('"+ART+"')")}
 else rs.removeProperty('--cover-art');
 /* Mesin 4D menyala untuk tema bertier VIP ATAU untuk layout bertanda vip
  (shell sinematik panggung/split). Syarat pertama sengaja dibiarkan verbatim:
  tools/test-vip-4d.cjs mencarinya persis sebagai string. */
 const KB=TC&&TC.perbaiki?TC.perbaiki(tplF.accent,'#241d16',3):tplF.accent;
 const KT=TC&&TC.untukKonten?TC.untukKonten(tplF.ink,tplF.accent,tplF.g):null;
 rs.setProperty('--ink-body',KT?KT.ink:tplF.ink);
 rs.setProperty('--accent-body',KT?KT.accent:tplF.accent);

 if(cvStyle==='full'){

 }else{
  rs.setProperty('--accent-cover',ART?KB:(TC&&TC.untukCover?TC.untukCover(tplF.accent,tplF.g[0],tplF.g[1]):tplF.accent));

 const fullNm=titleMain+(titleSub?' & '+titleSub:'');
 document.title=fullNm+' — Undangan';
 const ogT=document.querySelector('meta[property="og:title"]');if(ogT)ogT.content=EV_KICKER[ev]+': '+fullNm;

 const dateStr=fmtDate(form.tanggalAcara||draft.event_date);
 const timeStr=((form&&form.jamAcara)||draft.event_time||'').slice(0,5);
 const venue=(form.venue||draft.venue||'');

 /* ---------- animasi (diatur dari Studio: cover / teks / scroll reveal + pilihan efek) ---------- */
 const AN=(d&&d.anim)||{cover:true,text:true,reveal:true,effect:'zoom',scroll:'fade-up'};

const NAV_MODES=['slide','fade','flip','zoom','up','cube','blur'];
function setupNavPager(mode){
 if(NAV_MODES.indexOf(mode)<0)return;
 const wrap=document.querySelector('#content .wrap');
 if(!wrap)return;
 let slides=[...wrap.children];
 if(slides.length<2)return;
 /* Ukur tinggi tiap bagian selagi aliran normal, lalu gabungkan bagian pendek
    ke satu slide supaya tidak ada slide yang bawahnya kosong memanjang. */
 const target=Math.max(430,(window.innerHeight||700)-150);
 const hs=slides.map(el=>{const r=el.getBoundingClientRect();return (r&&r.height)||el.offsetHeight||0});
 const groups=[];let gr=[slides[0]],sum=hs[0];
 for(let i=1;i<slides.length;i++){
  if(sum+hs[i]+16<=target){gr.push(slides[i]);sum+=hs[i]+16}
  else{groups.push(gr);gr=[slides[i]];sum=hs[i]}
 }
 groups.push(gr);
 slides=groups.map(g=>{
  if(g.length===1){g[0].classList.add('pslide');return g[0]}
  const w=document.createElement('div');w.className='pslide pslide-multi';
  g[0].parentNode.insertBefore(w,g[0]);g.forEach(el=>w.appendChild(el));return w});
 if(slides.length<2){slides.forEach(x=>x.classList.remove('pslide','pslide-multi'));return}
 document.body.classList.add('navpager','nv-'+mode);
 const bar=document.createElement('div');
 bar.className='nv-bar';
 bar.innerHTML='<button class="nv-btn" data-d="-1" aria-label="Bagian sebelumnya">&#8249;</button><div class="nv-dots">'+slides.map((_,k)=>'<i data-k="'+k+'"></i>').join('')+'</div><button class="nv-btn" data-d="1" aria-label="Bagian berikutnya">&#8250;</button>';
 document.body.appendChild(bar);
 let cur=0;
 const show=(k,dir)=>{
  if(k<0||k>=slides.length)return;
  cur=k;
  slides.forEach((s,j)=>s.classList.toggle('pact',j===k));
  const s=slides[k];
  /* Slide baru saja berubah dari display:none menjadi tampil: sekarang
     aman menggambar ubin peta di dalamnya (lihat petaPantauPeta). Observer
     biasanya ikut memicu ini, pemanggilan langsung adalah jaringnya. */
  if(window.__aspMuatPeta)window.__aspMuatPeta(s);
  s.classList.remove('nv-anim');void s.offsetWidth;s.classList.add('nv-anim');
  s.style.setProperty('--nvdir',dir<0?'-1':'1');
  s.scrollTop=0;
  bar.querySelectorAll('.nv-dots i').forEach((d,j)=>d.classList.toggle('on',j===k));
  bar.querySelector('[data-d="-1"]').disabled=k===0;
  bar.querySelector('[data-d="1"]').disabled=k===slides.length-1;
 };
 bar.addEventListener('click',e=>{
  const b=e.target.closest('[data-d]');
  if(b){const d=+b.dataset.d;show(cur+d,d);return}
  const dot=e.target.closest('[data-k]');
  if(dot){const k=+dot.dataset.k;show(k,k-cur);}
 });
 document.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('opened'))return;
  if(e.key==='ArrowRight')show(cur+1,1);
  if(e.key==='ArrowLeft')show(cur-1,-1);
 });
 let tx=null;
 wrap.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
 wrap.addEventListener('touchend',e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx;tx=null;
  if(Math.abs(dx)>50){const d=dx<0?1:-1;show(cur+d,d)}
 },{passive:true});
 show(0,1);
}

function startCountdown(tt){
 const el=id=>$(id);
 const tick=()=>{
  let ms=tt-Date.now();if(ms<0)ms=0;
  const s=Math.floor(ms/1000);
  const pad=n=>String(n).padStart(2,'0');
  const setCd=(id,v)=>{const a=el(id),b=el(id+'0');
   if(a&&a.textContent!==v){a.textContent=v;a.classList.remove('cd-tick');void a.offsetWidth;a.classList.add('cd-tick')}
   if(b&&b.textContent!==v){b.textContent=v;b.classList.remove('cd-tick');void b.offsetWidth;b.classList.add('cd-tick')}};
  setCd('cdH',pad(Math.floor(s/86400)));
  setCd('cdM',pad(Math.floor(s%86400/3600)));
  setCd('cdS',pad(Math.floor(s%3600/60)));
  setCd('cdD',pad(s%60));
 };
 tick();window.__aspCdTimer=setInterval(tick,1000);
}

/* ---------- partikel ambien per tema (rombak dinamis 2026-10-11) ----------
   Tiap tema punya "jiwa gerak": kelopak, daun, bintang, konfeti, gelembung, atau
   debu emas. Ringan (<=18 partikel), berhenti saat tab tersembunyi, mati total
   pada prefers-reduced-motion, dan tanpa efek bila canvas tidak tersedia. */
function ambientPasang(tplF){
 try{
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas');cv.id='aspAmbient';cv.setAttribute('aria-hidden','true');
  const ctx=cv.getContext&&cv.getContext('2d');if(!ctx)return;
  document.body.appendChild(cv);
  const T={'floral-rustic':'petal','sweet-17':'petal','baby-girl':'petal','pearl-ivory':'petal',
   'minimalist-sage':'leaf','emerald-royal':'leaf','islamic-elegant':'leaf',
   'midnight-gold':'star','navy-crest':'star','adult-elegant':'star',
   'kids-party':'confetti','biru-ceria':'confetti',
   'baby-boy':'bubble','luxury-gold':'dust','golden-jubilee':'dust','jawa-elegan':'dust',
   'ivory-klasik':'dust','islamic-neutral':'dust'};
  const type=T[tplF.id]||'dust';
  const cols=[tplF.accent,tplF.g&&tplF.g[2],tplF.g&&tplF.g[1]].filter(Boolean);
  let w=0,h=0,dpr=Math.min(window.devicePixelRatio||1,2);
  const isi=()=>{
   w=cv.clientWidth;h=cv.clientHeight;
   cv.width=Math.max(1,Math.round(w*dpr));cv.height=Math.max(1,Math.round(h*dpr));
   ctx.setTransform(dpr,0,0,dpr,0,0)};
  isi();addEventListener('resize',isi,{passive:true});
  const n=(w<480?12:18);
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const P=Array.from({length:n},()=>({
   x:rnd(0,w),y:rnd(-h*0.2,h),s:rnd(5,type==='dust'?10:15),
   vy:rnd(.25,type==='bubble'?-0.9:.95),vx:rnd(-.35,.35),
   r:rnd(0,Math.PI*2),vr:rnd(-.02,.02),a:rnd(.35,.8),
   c:cols[Math.floor(Math.random()*Math.max(1,cols.length))]}));
  const gambar=()=>{
   if(!cv.isConnected)return; /* kanvas render lama sudah dibuang boot() baru — berhenti, jangan menggambar selamanya */
   if(document.hidden){requestAnimationFrame(gambar);return}
   ctx.clearRect(0,0,w,h);
   for(const p of P){
    p.y+=p.vy;p.x+=p.vx+Math.sin(p.y*0.012)*0.4;p.r+=p.vr;
    if(p.y>h+30){p.y=-20;p.x=rnd(0,w)}
    if(p.y<-40){p.y=h+20;p.x=rnd(0,w)}
    if(p.x> w+30)p.x=-20;if(p.x<-30)p.x=w+20;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=p.a;ctx.fillStyle=p.c;
    if(type==='petal'){ctx.beginPath();ctx.ellipse(0,0,p.s*0.55,p.s*0.3,0,0,Math.PI*2);ctx.fill()}
    else if(type==='leaf'){ctx.beginPath();ctx.ellipse(0,0,p.s*0.5,p.s*0.22,0,0,Math.PI*2);ctx.fill()}
    else if(type==='star'){const k=p.s*0.5;ctx.beginPath();ctx.moveTo(0,-k);ctx.lineTo(k*0.28,-k*0.28);ctx.lineTo(k,0);ctx.lineTo(k*0.28,k*0.28);ctx.lineTo(0,k);ctx.lineTo(-k*0.28,k*0.28);ctx.lineTo(-k,0);ctx.lineTo(-k*0.28,-k*0.28);ctx.closePath();ctx.fill()}
    else if(type==='confetti'){ctx.fillRect(-p.s*0.32,-p.s*0.2,p.s*0.64,p.s*0.4)}
    else if(type==='bubble'){ctx.beginPath();ctx.arc(0,0,p.s*0.5,0,Math.PI*2);ctx.strokeStyle=p.c;ctx.lineWidth=1.4;ctx.globalAlpha=p.a*0.75;ctx.stroke()}
    else{ctx.beginPath();ctx.arc(0,0,p.s*0.28,0,Math.PI*2);ctx.fill()}
    ctx.restore();
   }
   requestAnimationFrame(gambar);
  };
  gambar();
 }catch(e){/* kanvas tak tersedia — undangan tetap tampil normal */}
}

/* Preview katalog: undangan.html?demo=1&tpl={id-tema} — dipakai iframe live
   di kartu katalog supaya tiap tema tampil dengan palet/font/konten sesuai
   kategorinya (bukan satu demo statis untuk semua). */
if(DEMO){const _t=(Q.get('tpl')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
 const _n=(Q.get('tema')||'').toLowerCase();
 let _i=TPL.findIndex(x=>x.id===_t);
 if(_i<0&&_n)_i=TPL.findIndex(x=>(x.nama||'').toLowerCase()===_n);
 if(_i>=0){const _T=TPL[_i];DEMO_DRAFT.theme=_i;
  DEMO_DRAFT.data.tpl=_T.id;DEMO_DRAFT.data.accent=_T.accent;
  DEMO_DRAFT.data.fontTitle=_T.ft||DEMO_DRAFT.data.fontTitle;
  const _ev=_T.ev==='all'?'pernikahan':_T.ev;
  DEMO_DRAFT.data.gallery=({pernikahan:['assets/demo/wedding/01-jawa-elegan.jpg','assets/demo/wedding/02-minimalist-sage.jpg','assets/demo/wedding/03-luxury-gold.jpg'],
   khitanan:['assets/demo/khitanan/01-islamic-elegant.jpg','assets/demo/khitanan/02-biru-ceria.jpg'],
   ultah:['assets/demo/ultah/01-kids-party.jpg','assets/demo/ultah/02-sweet-17.jpg','assets/demo/ultah/03-adult-elegant.jpg'],
   aqiqah:['assets/demo/aqiqah/01-baby-boy.jpg','assets/demo/aqiqah/02-baby-girl.jpg','assets/demo/aqiqah/03-islamic-neutral.jpg']}[_ev]||[]).slice();
  DEMO_DRAFT.data.cover=({pernikahan:'assets/demo/wedding/02-minimalist-sage.jpg',
   khitanan:'assets/demo/khitanan/01-islamic-elegant.jpg',
   ultah:'assets/demo/ultah/01-kids-party.jpg',
   aqiqah:'assets/demo/aqiqah/01-baby-boy.jpg'}[_ev]||'assets/demo/wedding/02-minimalist-sage.jpg');
  DEMO_DRAFT.data.fotoPria=({pernikahan:'assets/demo/wedding/05-mempelai-pria.jpg',
   khitanan:'assets/demo/khitanan/03-anak-khitan.jpg',
   ultah:'assets/demo/ultah/04-anak-ultah.jpg',
   aqiqah:'assets/demo/aqiqah/04-anak-aqiqah.jpg'}[_ev]||'');
  DEMO_DRAFT.data.fotoWanita=_ev==='pernikahan'?'assets/demo/wedding/04-mempelai-wanita.jpg':'';
  if(_ev!=='pernikahan'){
   DEMO_DRAFT.data.event=_ev;DEMO_DRAFT.data.doa=_ev;

   DEMO_DRAFT.name2='';DEMO_DRAFT.data.form.namaAnak=

/* ---------- mulai ---------- */
if(PREVIEW){loading()}
else if(typeof EMBEDDED_DATA!=='undefined'&&EMBEDDED_DATA){loading();setTimeout(()=>boot(EMBEDDED_DATA),350)}
else if(DEMO){loading();setTimeout(()=>boot(DEMO_DRAFT),350)}
else if(!SLUG){notFound()}
else{
 loading();
 fetch(SUPABASE_URL+'/rest/v1/invitation_drafts?slug=eq.'+encodeURIComponent(SLUG)+'&select=*',{
  headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}
 }).then(async r=>{
   if(r.status===404)throw{nf:1};
   if(!r.ok)throw{err:r.status};
   const rows=await r.json();
   if(!Array.isArray(rows)||!rows.length)throw{nf:1};
   boot(rows[0]);
 }).catch(e=>{if(e&&e.nf)notFound();else netError()});
}
