# Launcher tidak memakai AndroidX / Jetifier.
android.useAndroidX=false
android.enableJetifier=false
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Tanda tangan rilis TIDAK disimpan di sini. Isi lewat variabel lingkungan:
#   LAUNCHER_KEYSTORE_FILE, LAUNCHER_KEYSTORE_PASSWORD,
#   LAUNCHER_KEY_ALIAS, LAUNCHER_KEY_PASSWORD
